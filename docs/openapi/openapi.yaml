components:
    schemas:
        AIAgentConfig:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                agentType:
                    type: string
                allowedScopes:
                    type: array
                    items:
                        type: string
                maxTokensPerRequest:
                    type: integer
                    format: int32
                maxRequestsPerMinute:
                    type: integer
                    format: int32
                allowedModels:
                    type: array
                    items:
                        type: string
                requireHumanApproval:
                    type: boolean
                approvalTimeoutSeconds:
                    type: integer
                    format: int32
                auditAllRequests:
                    type: boolean
                isActive:
                    type: boolean
                createdAt:
                    type: string
            description: AI agent configurations
        ActivateEnrichPromptVersionRequest:
            required:
                - versionId
            type: object
            properties:
                versionId:
                    type: string
        ActivateEnrichPromptVersionResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/EnrichConfig'
        AddCustomerRequestNoteRequest:
            required:
                - id
                - body
            type: object
            properties:
                id:
                    type: string
                body:
                    type: string
        AddCustomerRequestVoteRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                subjectKey:
                    type: string
                subjectHash:
                    type: string
                subjectDisplay:
                    type: string
                accountKey:
                    type: string
                accountDisplay:
                    type: string
                weight:
                    type: integer
                    format: int32
                note:
                    type: string
                accountRevenueCents:
                    type: string
                accountRevenueCurrency:
                    type: string
                accountTier:
                    type: string
                accountSizeSegment:
                    type: string
                accountLifecycleStatus:
                    type: string
                accountCrmProvider:
                    type: string
                accountCrmExternalId:
                    type: string
        AddFeedbackTagRequest:
            type: object
            properties:
                feedbackId:
                    type: string
                tagId:
                    type: string
                tagName:
                    type: string
                tagColor:
                    type: string
        AddFeedbackTagResponse:
            type: object
            properties:
                tag:
                    $ref: '#/components/schemas/Tag'
        AddRequestNoteAutomationRequest:
            required:
                - id
                - body
            type: object
            properties:
                id:
                    type: string
                body:
                    type: string
                visibility:
                    type: string
                    description: |-
                        internal (default) -> collaboration note; public -> portal comment
                         routed through the standard moderation pipeline.
        Any:
            type: object
            properties:
                value:
                    $ref: '#/components/schemas/GoogleProtobufAny'
                yaml:
                    type: string
        ApiKey:
            type: object
            properties:
                id:
                    type: string
                keyPrefix:
                    type: string
                label:
                    type: string
                isActive:
                    type: boolean
                createdAt:
                    type: string
                lastUsedAt:
                    type: string
                revokedAt:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
                description:
                    type: string
                expiresAt:
                    type: string
                allowedCidrs:
                    type: array
                    items:
                        type: string
                usageCount:
                    type: string
                rateLimitRpm:
                    type: integer
                    format: int32
                environment:
                    type: string
