components:
    schemas:
        AddFeedbackTagRequest:
            type: object
            properties:
                feedbackId:
                    type: string
                tagId:
                    type: string
                tagName:
                    type: string
                tagColor:
                    type: string
        AddFeedbackTagResponse:
            type: object
            properties:
                tag:
                    $ref: '#/components/schemas/Tag'
        ApiKey:
            type: object
            properties:
                id:
                    type: string
                keyPrefix:
                    type: string
                label:
                    type: string
                isActive:
                    type: boolean
                createdAt:
                    type: string
                lastUsedAt:
                    type: string
                revokedAt:
                    type: string
        ArchiveStateResponse:
            type: object
            properties: {}
        ArchiveTagResponse:
            type: object
            properties: {}
        Attachment:
            type: object
            properties:
                url:
                    type: string
                mime:
                    type: string
                size:
                    type: string
        AttrFilter:
            type: object
            properties:
                dim:
                    type: string
                value:
                    type: string
                multi:
                    type: boolean
            description: |-
                AttrFilter is one per-dim filter in a console list query. The
                 `dim` is a Dimension.Name; `value` is a stable Taxonomy.Value;
                 `multi` says whether the dim is multi-kind (needed because the
                 SQL containment shape differs).
        AuditEntry:
            type: object
            properties:
                id:
                    type: string
                feedbackId:
                    type: string
                entityType:
                    type: string
                fieldName:
                    type: string
                oldValue:
                    type: string
                newValue:
                    type: string
                comment:
                    type: string
                changedBy:
                    type: string
                createdAt:
                    type: string
        AuditLogEntry:
            type: object
            properties:
                id:
                    type: string
                actorType:
                    type: string
                actorId:
                    type: string
                actorEmail:
                    type: string
                actorIp:
                    type: string
                actorUserAgent:
                    type: string
                action:
                    type: string
                targetType:
                    type: string
                targetId:
                    type: string
                summary:
                    type: string
                beforeJson:
                    type: string
                afterJson:
                    type: string
                createdAt:
                    type: string
        BatchDeleteOp:
            type: object
            properties:
                hard:
                    type: boolean
                    description: If true, permanently delete rows. If false (default), soft-delete.
            description: BatchDeleteOp soft-deletes or hard-deletes selected rows.
        BatchFeedbackRequest:
            type: object
            properties:
                feedbackIds:
                    type: array
                    items:
                        type: string
                    description: Explicit row IDs to operate on (mutually exclusive with query).
                query:
                    allOf:
                        - $ref: '#/components/schemas/FeedbackFilter'
                    description: Filter query to select rows (mutually exclusive with feedback_ids).
                maxAffected:
                    type: integer
                    description: |-
                        Safety cap: refuse if query matches more than this many rows.
                         Required when using query-based selection.
                    format: int32
                confirmCount:
                    type: integer
                    description: |-
                        Confirmation count: proceed only if matched count equals this.
                         Prevents TOCTOU races between preview and execute.
                    format: int32
                dryRun:
                    type: boolean
                    description: If true, return what would happen without making changes.
                operation:
                    allOf:
                        - $ref: '#/components/schemas/BatchOperation'
                    description: The operation to perform.
                idempotencyKey:
                    type: string
                    description: |-
                        Client-generated idempotency key for safe retries.
                         Same key + same params = return cached result.
                         Same key + different params = IDEMPOTENCY_CONFLICT error.
                ifUnmodifiedSince:
                    type: string
                    description: |-
                        Optimistic concurrency: reject if any row was modified since this timestamp.
                         Format: RFC3339.
            description: |-
                BatchFeedbackRequest is the envelope for all batch operations.
                 Either feedback_ids or query must be provided to select rows.
        BatchFeedbackResponse:
            type: object
            properties:
                totalMatched:
                    type: integer
                    description: Total rows matched by the selection criteria.
                    format: int32
                succeeded:
                    type: integer
                    description: Number of rows successfully updated.
                    format: int32
                skipped:
                    type: integer
                    description: Number of rows skipped (already in target state, etc.).
                    format: int32
                failed:
                    type: array
                    items:
                        $ref: '#/components/schemas/BatchItemFailure'
                    description: Per-row failures with error details.
                jobId:
                    type: string
                    description: For async operations, the job ID to poll for status.
                jobStatusUrl:
                    type: string
                    description: URL to poll for job status (convenience for clients).
            description: BatchFeedbackResponse reports the outcome of a batch operation.
        BatchItemFailure:
            type: object
            properties:
                feedbackId:
                    type: string
                    description: The feedback row that failed.
                code:
                    type: string
                    description: Machine-readable error code (ErrorCode enum name).
                message:
                    type: string
                    description: Human-readable error message.
                currentUpdatedAt:
                    type: string
                    description: 'For optimistic concurrency failures: the row''s current updated_at.'
            description: BatchItemFailure describes why a single row failed in a batch operation.
        BatchOperation:
            type: object
            properties:
                tag:
                    $ref: '#/components/schemas/BatchTagOp'
                workflow:
                    $ref: '#/components/schemas/BatchWorkflowOp'
                delete:
                    $ref: '#/components/schemas/BatchDeleteOp'
            description: BatchOperation is the discriminated union of supported batch operations.
        BatchTagOp:
            type: object
            properties:
                addTagIds:
                    type: array
                    items:
                        type: string
                    description: Tag IDs to add to all selected rows.
                removeTagIds:
                    type: array
                    items:
                        type: string
                    description: Tag IDs to remove from all selected rows.
            description: BatchTagOp adds and/or removes tags from selected rows.
        BatchTransitionFailure:
            type: object
            properties:
                feedbackId:
                    type: string
                code:
                    type: string
                message:
                    type: string
        BatchTransitionFeedbackRequest:
            type: object
            properties:
                feedbackIds:
                    type: array
                    items:
                        type: string
                toStateId:
                    type: string
                comment:
                    type: string
        BatchTransitionFeedbackResponse:
            type: object
            properties:
                succeeded:
                    type: integer
                    format: int32
                failed:
                    type: array
                    items:
                        $ref: '#/components/schemas/BatchTransitionFailure'
        BatchUpdateFeedbackTagsRequest:
            type: object
            properties:
                feedbackIds:
                    type: array
                    items:
                        type: string
                addTagIds:
                    type: array
                    items:
                        type: string
                removeTagIds:
                    type: array
                    items:
                        type: string
        BatchUpdateFeedbackTagsResponse:
            type: object
            properties:
                affected:
                    type: integer
                    format: int32
        BatchWorkflowOp:
            type: object
            properties:
                toStateId:
                    type: string
                    description: Target workflow state ID.
                comment:
                    type: string
                    description: Optional audit comment for the transition.
            description: BatchWorkflowOp transitions selected rows to a new workflow state.
        CancelGdprRequestRequest:
            type: object
            properties:
                requestId:
                    type: string
        CancelGdprRequestResponse:
            type: object
            properties:
                requestId:
                    type: string
                status:
                    enum:
                        - GDPR_REQUEST_STATUS_UNSPECIFIED
                        - GDPR_REQUEST_STATUS_QUEUED
                        - GDPR_REQUEST_STATUS_RUNNING
                        - GDPR_REQUEST_STATUS_READY
                        - GDPR_REQUEST_STATUS_DOWNLOADED
                        - GDPR_REQUEST_STATUS_COMPLETED
                        - GDPR_REQUEST_STATUS_FAILED
                        - GDPR_REQUEST_STATUS_EXPIRED
                        - GDPR_REQUEST_STATUS_SCHEDULED
                        - GDPR_REQUEST_STATUS_CANCELLED
                        - GDPR_REQUEST_STATUS_REVOKED
                    type: string
                    format: enum
        CancelJobRequest:
            type: object
            properties:
                jobId:
                    type: string
            description: CancelJobRequest cancels a running or queued job.
        CancelJobResponse:
            type: object
            properties:
                status:
                    enum:
                        - JOB_STATUS_UNSPECIFIED
                        - JOB_STATUS_QUEUED
                        - JOB_STATUS_RUNNING
                        - JOB_STATUS_COMPLETED
                        - JOB_STATUS_FAILED
                        - JOB_STATUS_CANCELLED
                    type: string
                    description: The status after cancellation attempt.
                    format: enum
                message:
                    type: string
                    description: Human-readable result message.
            description: CancelJobResponse confirms cancellation.
        ChangePasswordRequest:
            required:
                - currentPassword
                - newPassword
            type: object
            properties:
                currentPassword:
                    type: string
                newPassword:
                    type: string
            description: |-
                ChangePasswordRequest carries the caller's current password (verified
                 before the rotation) and the desired new password. Both fields are
                 REQUIRED; the handler enforces new_password length >= 12.
        ChangePasswordResponse:
            type: object
            properties: {}
            description: |-
                ChangePasswordResponse is empty on success (200). Errors travel through
                 the standard {code, message, requestId} envelope.
        ClusterMember:
            type: object
            properties:
                id:
                    type: string
                content:
                    type: string
                enrichedTitle:
                    type: string
                source:
                    type: string
                createdAt:
                    type: string
                similarity:
                    type: number
                    format: double
            description: ClusterMember is a feedback item within a cluster.
        ClusterSummary:
            type: object
            properties:
                clusterId:
                    type: string
                count:
                    type: integer
                    format: int32
                latestAt:
                    type: string
                label:
                    type: string
                sampleTitle:
                    type: string
            description: ClusterSummary is a condensed view of a feedback cluster.
        CreateApiKeyRequest:
            required:
                - label
            type: object
            properties:
                label:
                    type: string
        CreateApiKeyResponse:
            type: object
            properties:
                key:
                    $ref: '#/components/schemas/ApiKey'
                secret:
                    type: string
                    description: The raw secret — returned only here, once, at creation.
        CreateGuardPolicyRequest:
            type: object
            properties:
                policy:
                    $ref: '#/components/schemas/GuardPolicy'
        CreateInboundSourceRequest:
            required:
                - channel
                - name
            type: object
            properties:
                channel:
                    type: string
                name:
                    type: string
                webhookConfig:
                    $ref: '#/components/schemas/WebhookCreateConfig'
                emailConfig:
                    $ref: '#/components/schemas/EmailCreateConfig'
            description: |-
                CreateInboundSourceRequest — one of webhook_config / email_config is
                 required based on channel. The framework selects the relevant payload;
                 the other is ignored.
        CreateInboundSourceResponse:
            type: object
            properties:
                source:
                    $ref: '#/components/schemas/InboundSource'
                webhookSecretReveal:
                    $ref: '#/components/schemas/WebhookSecretReveal'
            description: |-
                CreateInboundSourceResponse always carries the persisted InboundSource.
                 For webhook channels, webhook_secret_reveal is also populated — this is
                 the only place the raw secret is ever transmitted; clients must store
                 it immediately because rotate is the only path to a new value.
        CreateLLMChannelRequest:
            required:
