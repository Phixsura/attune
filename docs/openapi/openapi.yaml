                    type: string
                source:
                    type: string
                type:
                    type: string
                userId:
                    type: string
                pageUrl:
                    type: string
                enrichedTitle:
                    type: string
                enrichedKind:
                    type: string
                enrichedSeverity:
                    type: string
                enrichedModules:
                    type: array
                    items:
