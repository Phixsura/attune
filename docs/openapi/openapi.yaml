            type: object
            properties:
                name:
                    type: string
                protocol:
                    type: string
                baseUrl:
                    type: string
                authMode:
                    type: string
                apiKey:
                    type: string
                status:
                    type: string
                priority:
                    type: integer
                    format: int32
                weight:
                    type: integer
                    format: int32
                timeoutSeconds:
                    type: integer
                    format: int32
        CreateNotifyTargetRequest:
