                q:
                    type: string
                    description: The natural language query string.
                limit:
                    type: integer
                    description: 'Maximum results to return (default: 20, max: 100).'
                    format: int32
                minSimilarity:
                    type: number
                    description: Minimum similarity threshold (0.0-1.0). Results below this are excluded.
                    format: float
                filter:
                    allOf:
                        - $ref: '#/components/schemas/FeedbackFilter'
                    description: Additional filters to apply on top of semantic ranking.
                semanticWeight:
                    type: number
                    description: 'Weight for semantic (embedding) similarity (0.0-1.0, default: 0.7).'
                    format: float
                keywordWeight:
                    type: number
                    description: 'Weight for keyword (full-text) similarity (0.0-1.0, default: 0.3).'
                    format: float
            description: SemanticSearchRequest is the query envelope for semantic search.
