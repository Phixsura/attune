                        - JOB_STATUS_FAILED
                        - JOB_STATUS_CANCELLED
                    type: string
                    description: Current job status.
                    format: enum
                total:
                    type: integer
                    description: Total items to process.
                    format: int32
                progress:
                    type: integer
                    description: Items processed so far.
                    format: int32
                result:
                    allOf:
                        - $ref: '#/components/schemas/BatchFeedbackResponse'
                    description: Final result (populated when status = COMPLETED).
                error:
                    type: string
                    description: Error message (populated when status = FAILED).
                createdAt:
                    type: string
                    description: When the job was created (RFC3339).
                startedAt:
                    type: string
                    description: When processing started (RFC3339, absent if still queued).
                completedAt:
                    type: string
                    description: When the job finished (RFC3339, absent if still running).
                updatedAt:
                    type: string
                    description: When the job status was last updated (RFC3339).
                retryAfterSeconds:
                    type: integer
                    description: Suggested poll interval in seconds (for long-running jobs).
                    format: int32
            description: JobStatusResponse is the full job status with progress and result.
