                    type: string
                lastUsedAt:
                    type: string
                revokedAt:
                    type: string
                scopes:
                    type: array
                    items:
                        type: string
                description:
                    type: string
                expiresAt:
                    type: string
                allowedCidrs:
                    type: array
                    items:
                        type: string
                usageCount:
                    type: string
                rateLimitRpm:
                    type: integer
                    format: int32
                environment:
                    type: string
                gracePeriodEndsAt:
                    type: string
                serviceAccountId:
                    type: string
                rotatedFromId:
                    type: string
        ApiKeyAnalytics:
            type: object
            properties:
                hour:
                    type: string
                requestCount:
                    type: string
                errorCount:
