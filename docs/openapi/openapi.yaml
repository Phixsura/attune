                    type: integer
                    format: int32
                status4xx:
                    type: integer
                    format: int32
                status5xx:
                    type: integer
                    format: int32
            description: Analytics
        ApiKeyLogEntry:
            type: object
            properties:
                timestamp:
                    type: string
                method:
                    type: string
                path:
                    type: string
                statusCode:
                    type: integer
                    format: int32
                clientIp:
                    type: string
                userAgent:
                    type: string
                latencyMs:
                    type: integer
                    format: int32
                requestId:
                    type: string
        ApiKeyPolicy:
            type: object
            properties:
                maxExpiryDays:
                    type: integer
                    format: int32
                requireExpiry:
                    type: boolean
                requireIpAllowlist:
                    type: boolean
                requireDescription:
                    type: boolean
                maxKeysPerServiceAccount:
                    type: integer
                    format: int32
                allowedEnvironments:
                    type: array
                    items:
                        type: string
                requireMfaForCreate:
                    type: boolean
                requireApprovalForProd:
                    type: boolean
                autoRevokeUnusedDays:
                    type: integer
                    format: int32
            description: Org-level policies
        ApiKeyTag:
            type: object
            properties:
                key:
                    type: string
                value:
                    type: string
            description: Tags
        ApprovalRequest:
            type: object
