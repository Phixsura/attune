    /v1/feedback/ingest:
        post:
            tags:
                - FeedbackService
            description: |-
                Ingest stores one feedback item and queues it for enrichment.

                 Idempotency: send an `Idempotency-Key` header to make retries safe — a
                 replay with the same key + body returns the original id; the same key with
                 a different body fails 409. Errors use the shared ErrorResponse envelope
                 (`code` from the ErrorCode enum).
            operationId: FeedbackService_Ingest
            parameters:
                - name: Idempotency-Key
                  in: header
                  description: Optional dedup token (8-64 chars, [A-Za-z0-9_-]). Replaying the same key with the same body returns the original feedback id; reusing it with a different body fails with 409 IDEMPOTENCY_CONFLICT. When omitted, each request is treated as distinct.
                  schema:
                    type: string
                - name: X-Attune-Api-Version
                  in: header
                  required: false
                  description: Optional request header that pins attune's date-based public API contract. Omit it to use the server's current default. Unsupported values return the shared ErrorResponse envelope with BAD_REQUEST.
                  schema:
                    type: string
                    example: "2026-06-28"
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IngestRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IngestResponse'
                    headers:
                        X-Attune-Api-Version:
                            description: Effective attune API version used to process the request. Echoes the caller-supplied X-Attune-Api-Version value or the server default when omitted.
                            schema:
                                type: string
                                example: "2026-06-28"
                        Deprecation:
                            description: Present when the selected API version is deprecated but still supported. Value follows the HTTP Deprecation header syntax.
                            schema:
                                type: string
                        Sunset:
                            description: Present when the selected API version has a scheduled removal date. Value is an HTTP-date.
                            schema:
                                type: string
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    headers:
                        X-Attune-Api-Version:
                            description: Effective attune API version used to process the request. Echoes the caller-supplied X-Attune-Api-Version value or the server default when omitted.
                            schema:
                                type: string
                                example: "2026-06-28"
                        Deprecation:
                            description: Present when the selected API version is deprecated but still supported. Value follows the HTTP Deprecation header syntax.
                            schema:
                                type: string
                        Sunset:
                            description: Present when the selected API version has a scheduled removal date. Value is an HTTP-date.
                            schema:
                                type: string
                "409":
                    description: Idempotency-Key was reused with a different request body (error code IDEMPOTENCY_CONFLICT).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    headers:
                        X-Attune-Api-Version:
                            description: Effective attune API version used to process the request. Echoes the caller-supplied X-Attune-Api-Version value or the server default when omitted.
                            schema:
                                type: string
                                example: "2026-06-28"
                        Deprecation:
                            description: Present when the selected API version is deprecated but still supported. Value follows the HTTP Deprecation header syntax.
                            schema:
                                type: string
                        Sunset:
                            description: Present when the selected API version has a scheduled removal date. Value is an HTTP-date.
                            schema:
                                type: string
                "413":
                    description: Request body exceeds the 64 KiB ingest limit (error code BODY_TOO_LARGE).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    headers:
                        X-Attune-Api-Version:
                            description: Effective attune API version used to process the request. Echoes the caller-supplied X-Attune-Api-Version value or the server default when omitted.
                            schema:
                                type: string
                                example: "2026-06-28"
                        Deprecation:
                            description: Present when the selected API version is deprecated but still supported. Value follows the HTTP Deprecation header syntax.
                            schema:
                                type: string
                        Sunset:
                            description: Present when the selected API version has a scheduled removal date. Value is an HTTP-date.
                            schema:
                                type: string
                "429":
                    description: Rate limited by the per-tenant or per-key limiter; response carries a Retry-After header (error code RATE_LIMITED).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    headers:
                        X-Attune-Api-Version:
                            description: Effective attune API version used to process the request. Echoes the caller-supplied X-Attune-Api-Version value or the server default when omitted.
                            schema:
                                type: string
                                example: "2026-06-28"
                        Deprecation:
                            description: Present when the selected API version is deprecated but still supported. Value follows the HTTP Deprecation header syntax.
                            schema:
                                type: string
                        Sunset:
                            description: Present when the selected API version has a scheduled removal date. Value is an HTTP-date.
                            schema:
                                type: string
