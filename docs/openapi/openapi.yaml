    /fb/v1/console/feedback:
        get:
            tags:
                - FeedbackService
            description: GET /fb/v1/console/feedback (console; session auth)
            operationId: FeedbackService_ListFeedback
            parameters:
                - name: cursor
                  in: query
                  schema:
                    type: string
                - name: limit
                  in: query
                  schema:
                    type: integer
                    format: int32
                - name: urgent
                  in: query
                  description: nil = no filter; true = only urgent; false = only non-urgent.
                  schema:
                    type: boolean
                - name: q
                  in: query
                  schema:
                    type: string
                - name: tagId
                  in: query
                  schema:
                    type: string
                - name: workflowStateId
                  in: query
                  schema:
                    type: string
                - name: workflowCategory
                  in: query
                  schema:
                    type: string
                - name: enrichmentStatus
                  in: query
                  description: 'Filter by enrichment status: "pending" | "enriching" | "done" | "failed"'
                  schema:
                    type: string
                - name: terminalFailedOnly
                  in: query
                  description: |-
                    If true, only return rows where enrichment_status='failed' AND
                     enrichment_attempts >= maxEnrichmentAttempts AND enrichment_next_retry_at IS NULL.
                  schema:
                    type: boolean
                - name: ids
                  in: query
                  schema:
                    type: array
                    items:
                        type: string
                - name: confidenceLte
                  in: query
                  schema:
                    type: number
                    format: double
                - name: createdFrom
                  in: query
                  schema:
                    type: string
                - name: createdTo
                  in: query
                  schema:
                    type: string
                - name: enrichedFrom
                  in: query
                  schema:
                    type: string
                - name: enrichedTo
                  in: query
                  schema:
                    type: string
                - name: qualitySignal
                  in: query
                  schema:
                    type: string
                - name: source
                  in: query
                  schema:
                    type: string
                - name: type
                  in: query
                  schema:
                    type: string
                - name: cohortId
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListFeedbackResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
