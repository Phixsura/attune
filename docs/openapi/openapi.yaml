                    $ref: '#/components/schemas/WorkflowState'
        CreateTagRequest:
            type: object
            properties:
                name:
                    type: string
                color:
                    type: string
                description:
                    type: string
                exclusiveScope:
                    type: string
        DeleteApiKeyResponse:
