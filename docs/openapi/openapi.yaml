            properties:
                promptTemplate:
                    type: string
                    description: Tenant override; unset means "use default_prompt_template".
                defaultPromptTemplate:
                    type: string
                    description: Built-in default — always returned so the console can restore it.
                modules:
                    type: array
                    items:
                        type: string
                moduleMode:
                    type: string
                    description: |-
                        Derived mode: "freeform" when modules is empty, "constrained"
                         otherwise. Returned as a `string` (not a proto enum) per the #19
                         "domain value-sets stay string" contract — keeps the protojson wire
