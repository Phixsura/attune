            required:
                - region
                - accessToken
            type: object
            properties:
                region:
                    type: string
                accessToken:
                    type: string
                startFrom:
                    type: string
                filterStates:
                    type: array
                    items:
                        type: string
                maxDetailFetches:
                    type: integer
                    format: int32
                filterTags:
                    type: array
                    items:
                        type: string
                filterExcludeTags:
                    type: array
                    items:
                        type: string
            description: |-
                IntercomConnConfig carries the Intercom connection parameters for
                 create and test-connection flows. Auth is a private-app Access Token
                 (Bearer) — Intercom's documented model for same-workspace server
                 integrations; OAuth applies to public/multi-workspace apps (#32).
        IntercomSettings:
            type: object
            properties:
                region:
                    type: string
                startFrom:
                    type: string
                filterStates:
                    type: array
                    items:
                        type: string
                filterTags:
                    type: array
                    items:
                        type: string
                filterExcludeTags:
                    type: array
                    items:
                        type: string
                maxDetailFetches:
                    type: integer
                    format: int32
                workspaceId:
                    type: string
            description: |-
                IntercomSettings is the decrypted, operator-visible slice of a stored
                 Intercom config: everything editable, nothing secret. Region and
                 workspace_id are surfaced read-only for display.
