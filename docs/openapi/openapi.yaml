                    type: string
                source:
                    type: string
                type:
                    type: string
                userId:
                    type: string
                pageUrl:
                    type: string
                enrichedTitle:
                    type: string
                enrichedKind:
                    type: string
                enrichedSeverity:
                    type: string
                enrichedModules:
                    type: array
                    items:
                        type: string
                enrichedPriority:
                    type: number
                    format: double
                enrichmentStatus:
                    type: string
                createdAt:
                    type: string
                sourceMeta:
                    type: object
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                enrichmentError:
                    type: string
                enrichedAt:
                    type: string
            description: 'FeedbackDetail is the single-row view: the list fields plus extras (flat).'
        GetEnrichConfigResponse:
            type: object
