components:
    schemas:
        ApiKey:
            type: object
            properties:
                id:
                    type: string
                keyPrefix:
                    type: string
                label:
                    type: string
                isActive:
                    type: boolean
                createdAt:
                    type: string
                lastUsedAt:
                    type: string
                revokedAt:
                    type: string
        Attachment:
            type: object
            properties:
                url:
                    type: string
                mime:
                    type: string
                size:
                    type: string
        ChangePasswordRequest:
            required:
                - currentPassword
                - newPassword
            type: object
            properties:
                currentPassword:
                    type: string
                newPassword:
                    type: string
            description: |-
                ChangePasswordRequest carries the caller's current password (verified
                 before the rotation) and the desired new password. Both fields are
                 REQUIRED; the handler enforces new_password length >= 12.
        ChangePasswordResponse:
            type: object
            properties: {}
            description: |-
                ChangePasswordResponse is empty on success (200). Errors travel through
                 the standard {code, message, requestId} envelope.
        CreateApiKeyRequest:
            required:
                - label
            type: object
            properties:
                label:
                    type: string
        CreateApiKeyResponse:
            type: object
            properties:
                key:
                    $ref: '#/components/schemas/ApiKey'
                secret:
                    type: string
                    description: The raw secret — returned only here, once, at creation.
        CreateInboundSourceRequest:
            required:
                - channel
                - name
            type: object
            properties:
                channel:
                    type: string
                name:
                    type: string
                webhookConfig:
                    $ref: '#/components/schemas/WebhookCreateConfig'
                emailConfig:
                    $ref: '#/components/schemas/EmailCreateConfig'
            description: |-
                CreateInboundSourceRequest — one of webhook_config / email_config is
                 required based on channel. The framework selects the relevant payload;
                 the other is ignored.
        CreateInboundSourceResponse:
            type: object
            properties:
                source:
                    $ref: '#/components/schemas/InboundSource'
                webhookSecretReveal:
                    $ref: '#/components/schemas/WebhookSecretReveal'
            description: |-
                CreateInboundSourceResponse always carries the persisted InboundSource.
                 For webhook channels, webhook_secret_reveal is also populated — this is
                 the only place the raw secret is ever transmitted; clients must store
                 it immediately because rotate is the only path to a new value.
        CreateNotifyTargetRequest:
            required:
                - destinationType
                - url
            type: object
            properties:
                destinationType:
                    type: string
                audience:
                    type: string
                url:
                    type: string
                secret:
                    type: string
                timeoutSeconds:
                    type: integer
                    format: int32
                disabled:
                    type: boolean
        DeleteApiKeyResponse:
            type: object
            properties: {}
        DeleteInboundSourceResponse:
            type: object
            properties: {}
        DeleteNotifyTargetResponse:
            type: object
            properties: {}
        DimStats:
            type: object
            properties:
                dim:
                    type: string
                top:
                    type: array
                    items:
                        $ref: '#/components/schemas/ValueCount'
            description: DimStats is the per-dim top-values distribution for the stats view.
        Dimension:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Stable machine key: ^[a-z][a-z0-9_]{0,30}$. Immutable after
                         creation; rename = delete + recreate.
                displayName:
                    allOf:
                        - $ref: '#/components/schemas/I18nString'
                    description: Per-locale display surface for the dim itself.
                kind:
                    type: string
                    description: |-
                        "single" — LLM picks one value (or none if !required).
                         "multi"  — LLM picks 0..N values.
                taxonomy:
                    type: array
                    items:
                        $ref: '#/components/schemas/Taxonomy'
                    description: Allowed values; empty + kind=multi = freeform (GitHub-labels style).
                urgentSet:
                    type: array
                    items:
                        type: string
                    description: Subset of taxonomy.value whose presence on a row flips is_urgent.
                required:
                    type: boolean
                    description: When true, the LLM's JSON schema marks this property required.
            description: |-
                Dimension is one enrichment axis the LLM populates for each row.
                 Per-tenant DimensionSet is open in count and closed in shape —
                 adding any new dim is a Settings edit, not a code change.
        EmailConnConfig:
            type: object
            properties:
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                tls:
                    type: boolean
                username:
                    type: string
                password:
                    type: string
                folder:
                    type: string
        EmailCreateConfig:
            required:
                - host
                - port
                - username
                - password
            type: object
            properties:
                host:
                    type: string
                port:
                    type: integer
                    format: int32
                tls:
                    type: boolean
                username:
                    type: string
                password:
                    type: string
                folder:
                    type: string
                pollIntervalSeconds:
                    type: integer
                    format: int32
                startFrom:
                    type: string
                afterIngest:
                    type: string
        EnrichConfig:
            type: object
            properties:
                promptTemplate:
                    type: string
                    description: Tenant override; unset = use default_prompt_template.
                defaultPromptTemplate:
                    type: string
                    description: |-
                        Built-in default prompt body, always returned so the console can
                         offer a "restore default" affordance.
                dimensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dimension'
                    description: |-
                        Per-tenant Dimension set. Migration 014 seeds 3 dims (type +
                         severity + labels) on every fresh tenant; operators may add /
                         remove / edit any dim from here.
        Feedback:
            type: object
            properties:
                id:
                    type: string
                content:
                    type: string
                source:
                    type: string
                type:
                    type: string
                userId:
                    type: string
                pageUrl:
                    type: string
                enrichedTitle:
                    type: string
                enrichedAttrs:
                    type: object
                    description: map<dim.name, string | repeated string> — the LLM-emitted values.
                isUrgent:
                    type: boolean
                enrichmentStatus:
                    type: string
                createdAt:
                    type: string
            description: |-
                Feedback is a console feedback list row. Post-E3 (metadata-driven
                 Dimensions): the per-row classification lives in `enriched_attrs`, a
                 map<dim.name, value> where value is a JSON string (single-kind dim)
                 or a JSON string array (multi-kind dim). `is_urgent` is a derived
                 boolean persisted at write time.
        FeedbackDetail:
            type: object
            properties:
                id:
                    type: string
                content:
                    type: string
                source:
                    type: string
                type:
                    type: string
                userId:
                    type: string
                pageUrl:
                    type: string
                enrichedTitle:
                    type: string
                enrichedAttrs:
                    type: object
                isUrgent:
                    type: boolean
                enrichmentStatus:
                    type: string
                createdAt:
                    type: string
                sourceMeta:
                    type: object
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                enrichmentError:
                    type: string
                enrichedAt:
                    type: string
                enrichedRationale:
                    type: string
                    description: |-
                        LLM's short "why these values" justification. Already delivered
                         via the outbox envelope; persisted to user_feedback.enriched_rationale
                         by migration 013.
            description: 'FeedbackDetail is the single-row view: the list fields plus extras (flat).'
        GetEnrichConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/EnrichConfig'
        GetFeedbackStatsResponse:
            type: object
            properties:
                periodStart:
                    type: string
                periodEnd:
                    type: string
                total:
                    type: string
                dims:
                    type: array
                    items:
                        $ref: '#/components/schemas/DimStats'
                    description: One per-dim distribution for every dim the tenant has configured.
                urgentCount:
                    type: string
                    description: Count of is_urgent = true rows within the window.
        GetMeResponse:
            type: object
            properties:
                tenant:
                    $ref: '#/components/schemas/Tenant'
                user:
                    $ref: '#/components/schemas/SessionUser'
                csrfToken:
                    type: string
        GetUsageResponse:
            type: object
            properties:
                periodStart:
                    type: string
                    description: RFC3339 period bounds (current calendar month, UTC).
                periodEnd:
                    type: string
                total:
                    type: string
                    description: Total ingested rows in the period. (int64 → JSON string.)
                series:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageBucket'
                    description: Per-day buckets.
                quota:
                    type: string
                    description: Plan quota; absent until billing lands. (int64 → JSON string.)
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        I18nString:
            type: object
            properties:
                entries:
                    type: object
                    additionalProperties:
                        type: string
            description: |-
                I18nString is attune's per-locale display map (E3 metadata-driven
                 Dimensions, proposal 2026-06-07-flat-labels.md). Keys are BCP 47
                 locale tags ("zh", "en", "ja", "zh-Hant", ...) plus the reserved
                 "default" key used as the universal fallback. Resolution chain
                 (handled in the console SPA): preferred locale list → "default" →
                 any non-empty entry. The backend never resolves — it returns the
                 full map so the same payload serves every caller.
        InboundSource:
            type: object
            properties:
                id:
                    type: string
                tenantId:
                    type: string
                channel:
                    type: string
                name:
                    type: string
                slug:
                    type: string
                enabled:
                    type: boolean
                lastEventAt:
                    type: string
                lastUid:
                    type: string
                lastError:
                    type: string
                createdAt:
                    type: string
                updatedAt:
                    type: string
            description: InboundSource never carries the secret — it is write-only once stored.
        IngestRequest:
            required:
                - content
            type: object
            properties:
                content:
                    type: string
                    description: The feedback text. Required; the handler caps it at 5000 chars.
                source:
                    type: string
                    description: |-
                        Inbound channel/source identity ("api", "web", …). Channel-agnostic and
                         validated against the handler allow-list; defaults to "api" when empty.
                sourceUser:
                    type: string
                    description: Opaque end-user identifier from the originating system (optional).
                sourceMeta:
                    type: object
                    description: Arbitrary source-specific metadata (optional).
                pageUrl:
                    type: string
                    description: Originating page URL, for the in-app web widget (optional).
            description: |-
                IngestRequest is the JSON body of POST /v1/feedback/ingest.

                 JSON field names follow the protoJSON default (lowerCamelCase), which exactly
                 reproduces today's wire: content / source / sourceUser / sourceMeta / pageUrl.
        IngestResponse:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The stored feedback row id.

                         NOTE: per the protoJSON spec, int64 serializes as a JSON *string*
                         ({"id":"123"}). Deliberate — JavaScript cannot safely parse 64-bit integers.
                enrichmentStatus:
                    type: string
                    description: Enrichment lifecycle state at ingest time (always "pending" here).
            description: IngestResponse is returned on 200.
        ListApiKeysResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/ApiKey'
        ListFeedbackResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/Feedback'
                nextCursor:
                    type: string
        ListInboundSourcesResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/InboundSource'
        ListNotifyTargetsResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/NotifyTarget'
        LoginRequest:
            required:
                - email
                - password
            type: object
            properties:
                email:
                    type: string
                password:
                    type: string
                redirectUri:
                    type: string
        LoginResponse:
            type: object
            properties:
                redirect:
                    type: string
        LogoutRequest:
            type: object
            properties: {}
        LogoutResponse:
            type: object
            properties: {}
        NotifyTarget:
            type: object
            properties:
                id:
                    type: string
                destinationType:
                    type: string
                audience:
                    type: string
                url:
                    type: string
                timeoutSeconds:
                    type: integer
                    format: int32
                disabled:
                    type: boolean
                createdAt:
                    type: string
                lastFailureAt:
                    type: string
                lastError:
                    type: string
            description: NotifyTarget never carries the secret — it is write-only once stored.
        PauseInboundSourceRequest:
            type: object
            properties:
                id:
                    type: string
        PreviewEnrichPromptRequest:
            required:
                - sampleContent
            type: object
            properties:
                sampleContent:
                    type: string
        PreviewEnrichPromptResponse:
            type: object
            properties:
                renderedPrompt:
                    type: string
        ResumeInboundSourceRequest:
            type: object
            properties:
                id:
                    type: string
        RotateInboundSourceSecretRequest:
            type: object
            properties:
                id:
                    type: string
        RotateInboundSourceSecretResponse:
            type: object
            properties:
                secretHex:
                    type: string
                nextEligibleAt:
                    type: string
        SessionUser:
            type: object
            properties:
                openId:
                    type: string
                name:
                    type: string
                avatarUrl:
                    type: string
                role:
                    type: string
            description: |-
                SessionUser is the logged-in console user.
                 open_id is an opaque per-user identifier — historically carried an
                 upstream IM open_id but is now an attune-internal user id.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        Taxonomy:
            type: object
            properties:
                value:
                    type: string
                displayName:
                    $ref: '#/components/schemas/I18nString'
            description: |-
                Taxonomy is one allowed value for a Dimension. `value` is the
                 stable machine identifier the LLM emits and SQL filters use;
                 `display_name` is the i18n surface the console renders and the
                 operator freely edits without affecting persisted data or wire
                 contracts.
        Tenant:
            type: object
            properties:
                id:
                    type: string
                slug:
                    type: string
                name:
                    type: string
                locale:
                    type: string
                timezone:
                    type: string
            description: Tenant is the console-facing tenant record.
        TestInboundConnectionRequest:
            required:
                - channel
            type: object
            properties:
                channel:
                    type: string
                emailConfig:
                    $ref: '#/components/schemas/EmailConnConfig'
            description: |-
                TestInboundConnectionRequest validates an IMAP config without
                 persisting it. Returns ok=false + error message rather than 5xx when
                 the IMAP server rejects credentials.
        TestInboundConnectionResponse:
            type: object
            properties:
                ok:
                    type: boolean
                error:
                    type: string
                latencyMs:
                    type: string
        TestNotifyTargetRequest:
            type: object
            properties:
                id:
                    type: string
        TestNotifyTargetResponse:
            type: object
            properties:
                ok:
                    type: boolean
                statusCode:
                    type: integer
                    format: int32
                latencyMs:
                    type: string
        UpdateEnrichConfigRequest:
            type: object
            properties:
                promptTemplate:
                    type: string
                    description: Omit / null to restore the built-in default prompt.
                dimensions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Dimension'
                    description: Empty list clears all dims (LLM still emits title + rationale).
        UpdateEnrichConfigResponse:
            type: object
            properties:
                config:
                    $ref: '#/components/schemas/EnrichConfig'
        UpdateNotifyTargetRequest:
            type: object
            properties:
                id:
                    type: string
                audience:
                    type: string
                url:
                    type: string
                secret:
                    type: string
                timeoutSeconds:
                    type: integer
                    format: int32
                disabled:
                    type: boolean
        UsageBucket:
            type: object
            properties:
                bucket:
                    type: string
                    description: RFC3339 day bucket (UTC).
                value:
                    type: string
                    description: Rows in the bucket. (int64 → JSON string.)
        ValueCount:
            type: object
            properties:
                value:
                    type: string
                count:
                    type: string
            description: ValueCount is one bucket of a per-dim distribution.
        WebhookCreateConfig:
            type: object
            properties: {}
            description: |-
                WebhookCreateConfig has no body today — the secret is generated
                 server-side. The empty message is a placeholder so future webhook
                 options (e.g., HMAC algorithm override) can be added without breaking
                 CreateInboundSourceRequest's shape.
        WebhookSecretReveal:
            type: object
            properties:
                url:
                    type: string
                secretHex:
                    type: string
                curlExample:
                    type: string
            description: |-
                WebhookSecretReveal — one-time payload returned at Create + Rotate so
                 admins can publish the URL + secret to their automation. The secret
                 is lowercase-hex-encoded; signature is HMAC-SHA256(secret_raw_bytes,
                 "<X-Attune-Timestamp>.<body>") (spec §Webhook adapter). The
                 signature header is hex-encoded (e.g. "sha256=ab12…").
tags:
    - name: ApiKeyService
      description: ApiKeyService manages a tenant's external ingest API keys (console).
    - name: EnrichConfigService
      description: |-
        EnrichConfigService manages per-tenant enricher prompt + the
         metadata-driven Dimension set (#10 → E3 proposal
         docs/proposals/2026/06/2026-06-07-flat-labels.md).
    - name: FeedbackService
      description: |-
        FeedbackService is attune's feedback API. Today it exposes Ingest
         (POST /v1/feedback/ingest, public, API-key auth); the console feedback reads
         (list / stats / detail) join it as the migration proceeds.

         We do NOT generate server stubs — chi routing stays. The google.api.http
         annotation exists only so protoc-gen-openapi emits the REST path + operation
         into the OpenAPI document. (ts-proto with onlyTypes ignores this service.)
    - name: InboundSourceService
      description: |-
        InboundSourceService manages a tenant's inbound source rows (#66
         channel-agnostic inbound framework). Sources back the webhook and
         email IMAP adapters; future channels (RSS, scrape, MQ, …) hang off
         the same shape.
    - name: NotifyTargetService
      description: NotifyTargetService manages a tenant's outbound notification destinations.
    - name: SessionService
      description: SessionService backs the console session (login, current tenant + user, logout).
    - name: UsageService
      description: UsageService serves the console usage dashboard.
