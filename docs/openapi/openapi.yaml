                    type: string
                secretHex:
                    type: string
                curlExample:
                    type: string
            description: |-
                WebhookSecretReveal — one-time payload returned at Create + Rotate so
                 admins can publish the URL + secret to their automation. The secret
                 is lowercase-hex-encoded; signature is HMAC-SHA256(secret_raw_bytes,
                 "<X-Attune-Timestamp>.<body>") (spec §Webhook adapter). The
                 signature header is hex-encoded (e.g. "sha256=ab12…").
        WebhookSubscription:
            type: object
            properties:
                id:
                    type: string
                targetUrl:
                    type: string
                eventTypes:
                    type: array
                    items:
                        type: string
                status:
                    type: string
                disabledReason:
                    type: string
                consumer:
                    type: string
                createdAt:
                    type: string
            description: |-
                WebhookSubscription never carries the secret — it is write-only once
                 stored (same rule as NotifyTarget).
        WorkflowState:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                    description: |-
                        Stable machine key (slug, ^[a-z][a-z0-9_]{0,30}$), immutable after
                         creation — mirrors Dimension.name. The SPA renders display_name.
                color:
                    type: string
                category:
                    type: string
                position:
                    type: integer
                    format: int32
                isDefault:
                    type: boolean
                archived:
                    type: boolean
                createdAt:
                    type: string
                updatedAt:
                    type: string
                displayName:
                    allOf:
                        - $ref: '#/components/schemas/I18nString'
                    description: Per-locale display name; the SPA resolves, the backend never does.
        WorkflowTransition:
            type: object
            properties:
                id:
                    type: string
                fromStateId:
                    type: string
                toStateId:
                    type: string
        WorkflowTransitionEdge:
            type: object
            properties:
                fromStateId:
                    type: string
                toStateId:
                    type: string
        ZendeskConnConfig:
            required:
                - subdomain
                - authMode
            type: object
            properties:
                subdomain:
                    type: string
                authMode:
                    type: string
                email:
                    type: string
                    description: api_token auth fields.
                apiToken:
                    type: string
                startFrom:
                    type: string
                oauthAccessToken:
                    type: string
                    description: OAuth paste-mode fields (replaces old client-credential fields).
                oauthRefreshToken:
                    type: string
                oauthClientIdV2:
                    type: string
                oauthClientSecretV2:
                    type: string
                filterTags:
                    type: array
                    items:
                        type: string
                    description: Advanced config.
                filterExcludeTags:
                    type: array
                    items:
                        type: string
                filterStatuses:
                    type: array
                    items:
                        type: string
                maxCommentFetches:
                    type: integer
                    format: int32
            description: |-
                ZendeskConnConfig carries the Zendesk connection parameters for create
                 and test-connection flows. Auth supports "api_token" (email + API
                 token, sunsetting 2027-04-30) and "oauth" (OAuth 2.0 client
                 credentials).
        ErrorResponse:
            required:
                - code
                - message
            type: object
            properties:
                code:
                    type: string
                    description: Stable machine-readable error code. Values are the attune ErrorCode enum names, such as VALIDATION or RATE_LIMITED.
                message:
                    type: string
                    description: Human-facing error message. Not stable; do not switch on it.
                requestId:
                    type: string
                    description: Request id for support and log correlation. Mirrors the HTTP request-id/trace identifier when available.
            description: attune-standard error envelope for all non-2xx HTTP responses.
tags:
    - name: ApiKeyService
      description: ApiKeyService manages a tenant's external ingest API keys (console).
    - name: AuditLogService
    - name: AuthService
      description: AuthService provides API key verification (public API).
    - name: BatchService
      description: |-
        BatchService provides batch operations on feedback rows (#30).
         Operations can target rows by explicit IDs or by filter query.
    - name: ClassificationQualityService
      description: |-
        ClassificationQualityService serves the console classification quality
         dashboard and its bounded sample drill-downs.
    - name: ClustersService
      description: ClustersService provides semantic cluster views for the console (#25).
    - name: CohortSyncService
      description: |-
        CohortSyncService manages tenant-scoped cohort source connections,
         cohort definitions, and sync run history.
    - name: CustomerRequestAutomationService
      description: |-
        CustomerRequestAutomationService is the API-key automation surface for
         customer requests (#234) — scope requests:read / requests:write. It reuses
         the console message shapes; only the note rpc differs (visibility routing).
    - name: CustomerRequestService
    - name: DigestSubscriptionService
      description: |-
        DigestSubscriptionService manages a tenant's daily digest configuration (#27).
         v1 is a per-tenant singleton resource: one subscription per tenant, so the
         endpoints are get / upsert / delete with no id path param.
    - name: EnrichConfigService
      description: |-
        EnrichConfigService manages per-tenant enricher prompt + the
         metadata-driven Dimension set (#10 → E3 proposal
         docs/proposals/2026/06/2026-06-07-flat-labels.md).
    - name: EnrichmentRuntimeService
    - name: ExternalSyncService
      description: |-
        ExternalSyncService manages tenant-scoped external system connections and
         the sync-run ledger that keeps Attune objects aligned with external issues.
    - name: FeedbackService
      description: |-
        FeedbackService is attune's feedback API. Today it exposes Ingest
         (POST /v1/feedback/ingest, public, API-key auth); the console feedback reads
         (list / stats / detail) join it as the migration proceeds.

         We do NOT generate server stubs — chi routing stays. The google.api.http
         annotation exists only so protoc-gen-openapi emits the REST path + operation
         into the OpenAPI document. (ts-proto with onlyTypes ignores this service.)
    - name: FeedbackTagService
    - name: GdprService
    - name: GuardPolicyService
      description: |-
        GuardPolicyService manages tenant-scoped guard policies and effective-policy
         previews for the Console. System policies are returned read-only by list and
         participate in effective resolution, but tenant sessions only write
         tenant-scoped rows.
    - name: InboundSourceService
      description: |-
        InboundSourceService manages a tenant's inbound source rows (#66
         channel-agnostic inbound framework). Sources back the webhook,
         email IMAP, Slack, Zendesk, and Intercom adapters; future channels
         (RSS, scrape, MQ, …) hang off the same shape.
    - name: JobService
      description: JobService provides status tracking for async batch operations (#30).
    - name: LLMConfigService
      description: LLMConfigService manages DB-backed provider channels and routes.
    - name: MCPClientService
      description: MCPClientService manages MCP OAuth clients and their governance surface.
    - name: MemberService
      description: MemberService manages tenant membership for RBAC (#38).
    - name: NotifyOutboxService
      description: |-
        NotifyOutboxService is the operator surface over the notify_outbox delivery
         queue (#33): list dead / in-flight-failed deliveries and manually retry one
         in place. The retry/backoff/dead engine itself lives in the worker; this
         contract only exposes visibility + manual re-arm.
    - name: NotifyTargetService
      description: NotifyTargetService manages a tenant's outbound notification destinations.
    - name: PortalService
    - name: PublicRequestNotificationService
    - name: PublicVisibilityService
    - name: QualityActionService
      description: |-
        QualityActionService stores the operator action ledger behind the control
         tower. Signals still come from the dedicated quality APIs; this service keeps
         the human workflow state for each recommended action.
    - name: RequestNotificationService
    - name: SearchService
      description: |-
        SearchService provides semantic search over feedback (#30).
         Uses pgvector embeddings when available, falls back to keyword search.
    - name: SessionService
      description: SessionService backs the console session (login, current tenant + user, logout).
    - name: SystemService
      description: SystemService publishes console-only platform health and release context.
    - name: UsageService
      description: UsageService serves the console usage dashboard.
    - name: WebhookSubscriptionService
      description: |-
        WebhookSubscriptionService manages automation webhook subscriptions
         (e.g. Zapier REST hooks) over API-key auth, scope hooks:manage.
         One subscription per consumer hook; event_types filters the append-only
         automation event vocabulary (feedback.created, feedback.urgent,
         request.created, request.status_changed).
    - name: WorkflowService
