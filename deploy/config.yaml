# attune private-deploy config.
#
# Before `docker compose up`, replace:
# - database.url credentials with POSTGRES_PASSWORD from .env
# - console.session_key with at least 32 random characters
# - console.bootstrap_admin password
# - secrets.tink_keyset with output from:
#     docker compose run --rm attune secrets generate-keyset

port: 8090

database:
  url: "postgres://attune@postgres:5432/attune?sslmode=disable"

migrations:
  confirm_lark_delete: false

enricher:
  interval: "30s"
  batch: 10

ingest:
  # Optional: exact browser origins allowed to POST /v1/feedback/ingest
  # with a publishable ingest:write key. Leave empty if your widget is
  # same-origin or if a reverse proxy terminates CORS upstream.
  cors_allowed_origins: []

console:
  base_url: "https://attune.example.com"
  session_key: "replace-with-32-or-more-random-characters"
  bootstrap_admin:
    email: "admin@example.com"
    password: "replace-this-after-first-login"

secrets:
  # Migration-only fallback for old inbound_sources rows encrypted with
  # ATTUNE_INBOUND_MASTER_KEY. Remove after `attune secrets reencrypt --apply`.
  # legacy_inbound_master_key: ""
  tink_keyset: |
    {
      "primaryKeyId": 0,
      "key": []
    }

observability:
  service_version: "dev"
  environment: "dev"
  otlp_endpoint: ""
  otlp_traces_path: "/opentelemetry/v1/traces"
  otlp_headers: {}
  otlp_insecure: false

rate_limit:
  per_minute: 60
  burst: 300
  disabled: false

custom_webhooks: []
