groups:
  - name: attune.recording.slo
    interval: 30s
    rules:
      - record: attune:ingest_service_failure_ratio:ratio5m
        expr: |
          (
            (
              sum by (tenant) (rate(attune_ingest_total{result="internal_err"}[5m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
            +
            (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[5m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
          )
          /
          clamp_min(
            sum by (tenant) (rate(attune_ingest_total[5m]))
            + (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[5m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ),
            1e-9
          )

      - record: attune:ingest_service_failure_ratio:ratio1h
        expr: |
          (
            (
              sum by (tenant) (rate(attune_ingest_total{result="internal_err"}[1h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
            +
            (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[1h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
          )
          /
          clamp_min(
            sum by (tenant) (rate(attune_ingest_total[1h]))
            + (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[1h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ),
            1e-9
          )

      - record: attune:ingest_service_failure_ratio:ratio30m
        expr: |
          (
            (
              sum by (tenant) (rate(attune_ingest_total{result="internal_err"}[30m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
            +
            (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[30m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
          )
          /
          clamp_min(
            sum by (tenant) (rate(attune_ingest_total[30m]))
            + (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[30m]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ),
            1e-9
          )

      - record: attune:ingest_service_failure_ratio:ratio6h
        expr: |
          (
            (
              sum by (tenant) (rate(attune_ingest_total{result="internal_err"}[6h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
            +
            (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[6h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            )
          )
          /
          clamp_min(
            sum by (tenant) (rate(attune_ingest_total[6h]))
            + (
              sum by (tenant) (rate(attune_ingest_rate_limit_total[6h]))
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ),
            1e-9
          )

      - record: attune:enrich_success_under_5s:ratio5m
        expr: |
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_bucket{le="5",result="ok"}[5m]))
          )
          /
          clamp_min(sum by (tenant) (rate(attune_enrich_duration_seconds_count[5m])), 1e-9)

      - record: attune:enrich_success_under_5s:ratio1h
        expr: |
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_bucket{le="5",result="ok"}[1h]))
          )
          /
          clamp_min(sum by (tenant) (rate(attune_enrich_duration_seconds_count[1h])), 1e-9)

      - record: attune:enrich_success_under_5s:ratio30m
        expr: |
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_bucket{le="5",result="ok"}[30m]))
          )
          /
          clamp_min(sum by (tenant) (rate(attune_enrich_duration_seconds_count[30m])), 1e-9)

      - record: attune:enrich_success_under_5s:ratio6h
        expr: |
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_bucket{le="5",result="ok"}[6h]))
          )
          /
          clamp_min(sum by (tenant) (rate(attune_enrich_duration_seconds_count[6h])), 1e-9)

      - record: attune:outbox_delivery_failure_ratio:ratio5m
        expr: |
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total{result="terminal"}[5m]))
          )
          /
          clamp_min(sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[5m])), 1e-9)

      - record: attune:outbox_delivery_failure_ratio:ratio1h
        expr: |
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total{result="terminal"}[1h]))
          )
          /
          clamp_min(sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[1h])), 1e-9)

      - record: attune:outbox_delivery_failure_ratio:ratio30m
        expr: |
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total{result="terminal"}[30m]))
          )
          /
          clamp_min(sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[30m])), 1e-9)

      - record: attune:outbox_delivery_failure_ratio:ratio6h
        expr: |
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total{result="terminal"}[6h]))
          )
          /
          clamp_min(sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[6h])), 1e-9)

      - record: attune:oidc_login_failure_ratio:ratio5m
        expr: |
          (
            sum(rate(attune_oidc_login_total{result!="success"}[5m]))
          )
          /
          clamp_min(sum(rate(attune_oidc_login_total[5m])), 1e-9)

      - record: attune:oidc_login_failure_ratio:ratio1h
        expr: |
          (
            sum(rate(attune_oidc_login_total{result!="success"}[1h]))
          )
          /
          clamp_min(sum(rate(attune_oidc_login_total[1h])), 1e-9)

      - record: attune:oidc_login_failure_ratio:ratio30m
        expr: |
          (
            sum(rate(attune_oidc_login_total{result!="success"}[30m]))
          )
          /
          clamp_min(sum(rate(attune_oidc_login_total[30m])), 1e-9)

      - record: attune:oidc_login_failure_ratio:ratio6h
        expr: |
          (
            sum(rate(attune_oidc_login_total{result!="success"}[6h]))
          )
          /
          clamp_min(sum(rate(attune_oidc_login_total[6h])), 1e-9)

      - record: attune:apikey_access_denial_ratio:ratio5m
        expr: |
          (
            sum(rate(attune_apikey_expired_total[5m]))
            + sum(rate(attune_apikey_ip_denied_total[5m]))
            + sum(rate(attune_apikey_rate_limited_total[5m]))
          )
          /
          clamp_min(
            sum(rate(attune_apikey_usage_total[5m]))
            + sum(rate(attune_apikey_expired_total[5m]))
            + sum(rate(attune_apikey_ip_denied_total[5m]))
            + sum(rate(attune_apikey_rate_limited_total[5m])),
            1e-9
          )

      - record: attune:apikey_access_denial_ratio:ratio1h
        expr: |
          (
            sum(rate(attune_apikey_expired_total[1h]))
            + sum(rate(attune_apikey_ip_denied_total[1h]))
            + sum(rate(attune_apikey_rate_limited_total[1h]))
          )
          /
          clamp_min(
            sum(rate(attune_apikey_usage_total[1h]))
            + sum(rate(attune_apikey_expired_total[1h]))
            + sum(rate(attune_apikey_ip_denied_total[1h]))
            + sum(rate(attune_apikey_rate_limited_total[1h])),
            1e-9
          )

      - record: attune:apikey_access_denial_ratio:ratio30m
        expr: |
          (
            sum(rate(attune_apikey_expired_total[30m]))
            + sum(rate(attune_apikey_ip_denied_total[30m]))
            + sum(rate(attune_apikey_rate_limited_total[30m]))
          )
          /
          clamp_min(
            sum(rate(attune_apikey_usage_total[30m]))
            + sum(rate(attune_apikey_expired_total[30m]))
            + sum(rate(attune_apikey_ip_denied_total[30m]))
            + sum(rate(attune_apikey_rate_limited_total[30m])),
            1e-9
          )

      - record: attune:apikey_access_denial_ratio:ratio6h
        expr: |
          (
            sum(rate(attune_apikey_expired_total[6h]))
            + sum(rate(attune_apikey_ip_denied_total[6h]))
            + sum(rate(attune_apikey_rate_limited_total[6h]))
          )
          /
          clamp_min(
            sum(rate(attune_apikey_usage_total[6h]))
            + sum(rate(attune_apikey_expired_total[6h]))
            + sum(rate(attune_apikey_ip_denied_total[6h]))
            + sum(rate(attune_apikey_rate_limited_total[6h])),
            1e-9
          )

      - record: attune:mcp_tool_error_ratio:ratio5m
        expr: |
          (
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"client_error|internal_error"}[5m]))
          )
          /
          clamp_min(
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"ok|client_error|internal_error"}[5m])),
            1e-9
          )

      - record: attune:mcp_tool_error_ratio:ratio1h
        expr: |
          (
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"client_error|internal_error"}[1h]))
          )
          /
          clamp_min(
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"ok|client_error|internal_error"}[1h])),
            1e-9
          )

      - record: attune:mcp_tool_error_ratio:ratio30m
        expr: |
          (
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"client_error|internal_error"}[30m]))
          )
          /
          clamp_min(
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"ok|client_error|internal_error"}[30m])),
            1e-9
          )

      - record: attune:mcp_tool_error_ratio:ratio6h
        expr: |
          (
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"client_error|internal_error"}[6h]))
          )
          /
          clamp_min(
            sum by (tenant, tool) (rate(attune_mcp_tool_calls_total{result=~"ok|client_error|internal_error"}[6h])),
            1e-9
          )

      - record: attune:gdpr_job_completion_ratio:ratio5m
        expr: |
          (
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="completed"}[5m]))
          )
          /
          clamp_min(
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[5m]))
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="cancelled"}[5m]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[5m])) * 0
              )
            )
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="revoked"}[5m]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[5m])) * 0
              )
            ),
            1e-9
          )

      - record: attune:gdpr_job_completion_ratio:ratio1h
        expr: |
          (
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="completed"}[1h]))
          )
          /
          clamp_min(
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[1h]))
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="cancelled"}[1h]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[1h])) * 0
              )
            )
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="revoked"}[1h]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[1h])) * 0
              )
            ),
            1e-9
          )

      - record: attune:gdpr_job_completion_ratio:ratio30m
        expr: |
          (
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="completed"}[30m]))
          )
          /
          clamp_min(
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[30m]))
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="cancelled"}[30m]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[30m])) * 0
              )
            )
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="revoked"}[30m]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[30m])) * 0
              )
            ),
            1e-9
          )

      - record: attune:gdpr_job_completion_ratio:ratio6h
        expr: |
          (
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="completed"}[6h]))
          )
          /
          clamp_min(
            sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[6h]))
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="cancelled"}[6h]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[6h])) * 0
              )
            )
            - (
              sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="revoked"}[6h]))
              or on(tenant, request_type) (
                sum by (tenant, request_type) (rate(attune_gdpr_job_total{result="started"}[6h])) * 0
              )
            ),
            1e-9
          )


  - name: attune.alerts.slo
    rules:
      - alert: AttuneIngestServiceFastBurn
        expr: |
          (
            (attune:ingest_service_failure_ratio:ratio5m) / 0.001 > 14.4
          )
          and
          (
            (attune:ingest_service_failure_ratio:ratio1h) / 0.001 > 14.4
          )
          and
          (
            sum by (tenant) (attune:ingest_requests:rate5m)
            + (
              attune:ingest_rate_limit:rate5m
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ) > 0.01
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: ingest_service
        annotations:
          summary: "Attune ingest service is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Burn trend."
          owner: "Ingest"
          escalation: "Ingest on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestservicefastburn"
          action: "Inspect ingest internal errors and rate-limit pressure by tenant and source/result, then confirm whether the root cause is a code regression, hot tenant, bad client payloads, or an upstream dependency failure."

      - alert: AttuneIngestServiceSlowBurn
        expr: |
          (
            (attune:ingest_service_failure_ratio:ratio30m) / 0.001 > 6
          )
          and
          (
            (attune:ingest_service_failure_ratio:ratio6h) / 0.001 > 6
          )
          and
          (
            sum by (tenant) (attune:ingest_requests:rate5m)
            + (
              attune:ingest_rate_limit:rate5m
              or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)
            ) > 0.01
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: ingest_service
        annotations:
          summary: "Attune ingest service is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Burn trend."
          owner: "Ingest"
          escalation: "Ingest on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestserviceslowburn"
          action: "Check whether the ingest regression is sustained, compare against recent deploys, and verify whether rate-limit pressure, validation noise, or a hot tenant is masking a real backend failure."

      - alert: AttuneEnrichmentFastBurn
        expr: |
          (
            (1 - attune:enrich_success_under_5s:ratio5m) / 0.05 > 14.4
          )
          and
          (
            (1 - attune:enrich_success_under_5s:ratio1h) / 0.05 > 14.4
          )
          and
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_count[5m])) > 0.01
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: enrichment_latency
        annotations:
          summary: "Attune enrichment latency is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} is above the 14.4x fast-burn threshold on both 5m and 1h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend."
          owner: "AI Pipeline"
          escalation: "AI Pipeline on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentfastburn"
          action: "Split enrichment latency by dims_mode and result, then confirm whether the issue is provider latency, queue pressure, or a parser / prompt regression."

      - alert: AttuneEnrichmentSlowBurn
        expr: |
          (
            (1 - attune:enrich_success_under_5s:ratio30m) / 0.05 > 6
          )
          and
          (
            (1 - attune:enrich_success_under_5s:ratio6h) / 0.05 > 6
          )
          and
          (
            sum by (tenant) (rate(attune_enrich_duration_seconds_count[5m])) > 0.01
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: enrichment_latency
        annotations:
          summary: "Attune enrichment latency is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} is above the 6x slow-burn threshold on both 30m and 6h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend."
          owner: "AI Pipeline"
          escalation: "AI Pipeline on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentslowburn"
          action: "Compare with AI queue depth and provider errors. If latency is elevated but failures are not, the system may be saturating rather than failing."

      - alert: AttuneOutboxDeliveryFastBurn
        expr: |
          (
            (attune:outbox_delivery_failure_ratio:ratio5m) / 0.001 > 14.4
          )
          and
          (
            (attune:outbox_delivery_failure_ratio:ratio1h) / 0.001 > 14.4
          )
          and
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[5m])) > 0.01
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: outbox_delivery
        annotations:
          summary: "Attune outbox delivery is burning error budget quickly"
          description: "Destination type {{ $labels.destination_type }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Delivery pressure."
          owner: "Delivery"
          escalation: "Delivery on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-destination_type={{ $labels.destination_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryfastburn"
          action: "Inspect terminal delivery failures, then compare outbox lag and notify failures to decide whether the destination or worker capacity is the limiting factor."

      - alert: AttuneOutboxDeliverySlowBurn
        expr: |
          (
            (attune:outbox_delivery_failure_ratio:ratio30m) / 0.001 > 6
          )
          and
          (
            (attune:outbox_delivery_failure_ratio:ratio6h) / 0.001 > 6
          )
          and
          (
            sum by (destination_type) (rate(attune_outbound_delivery_attempts_total[5m])) > 0.01
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: outbox_delivery
        annotations:
          summary: "Attune outbox delivery is consuming budget too fast"
          description: "Destination type {{ $labels.destination_type }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Delivery pressure."
          owner: "Delivery"
          escalation: "Delivery on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-destination_type={{ $labels.destination_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryslowburn"
          action: "Check provider rejection patterns, retry pressure, and whether the worker pool is keeping up with the queue."

      - alert: AttuneOIDCLoginFastBurn
        expr: |
          (
            (attune:oidc_login_failure_ratio:ratio5m) / 0.001 > 14.4
          )
          and
          (
            (attune:oidc_login_failure_ratio:ratio1h) / 0.001 > 14.4
          )
          and
          (
            sum(rate(attune_oidc_login_total[5m])) > 0.01
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: oidc_login
        annotations:
          summary: "Attune OIDC login is burning error budget quickly"
          description: "OIDC login failures are above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Auth pressure."
          owner: "Auth"
          escalation: "Auth on-call"
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoidcloginfastburn"
          action: "Check the failing login outcomes, IdP status, callback errors, and recent auth or cookie changes before changing SSO configuration."

      - alert: AttuneOIDCLoginSlowBurn
        expr: |
          (
