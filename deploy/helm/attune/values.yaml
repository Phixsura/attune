      pullPolicy: IfNotPresent
    service:
      port: 5432
      headless: true
      annotations: {}
    auth:
      database: attune
      username: attune
      existingSecret: ""
      secretKeys:
        username: username
        password: password
        database: database
    persistence:
      enabled: true
      existingClaim: ""
      accessModes:
        - ReadWriteOnce
      size: 10Gi
      storageClass: ""
      annotations: {}
    resources: {}
    podSecurityContext: {}
    securityContext: {}
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    priorityClassName: ""
    extraEnv: []
    extraVolumeMounts: []
    extraVolumes: []
  external:
    enabled: false

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  namespaceSelector: {}
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  scheme: http
  tlsConfig: {}
  bearerTokenSecret: {}
  relabelings: []
  metricRelabelings: []
  targetLabels: []
  podTargetLabels: []

grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}

prometheusRule:
  enabled: false
  labels: {}
  annotations: {}

helmTest:
  enabled: true
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  image:
    repository: curlimages/curl
    tag: 8.11.1
    pullPolicy: IfNotPresent
  dnsImage:
    repository: busybox
    tag: 1.37.0
    pullPolicy: IfNotPresent

# ── Restore drill (#151) ─────────────────────────────────────────────────────
# Opt-in scheduled CronJob that verifies an already-restored database is
# recoverable (schema, row counts, pgvector, decryptability of managed secrets)
# and records the result so the System Readiness page can surface it. Point
# targetDatabaseURL at a restored, throwaway database — e.g. a CloudNativePG
# recovery Cluster or an ephemeral database you restore a backup into. The drill
# never touches production beyond appending its result row.
#
# SECURITY: target/baselineDatabaseURL are passed as CronJob pod ARGS, which are
# visible via `kubectl describe pod` and stored in etcd. Prefer a throwaway
# target whose credentials are low-value and short-lived, restrict RBAC/etcd
# access, and rotate the target DB password. (The Tink keyset and the production
# DB URL used for --record stay in the mounted config Secret, not in args.)
restoreDrill:
  enabled: false
  schedule: "0 2 * * 0" # weekly, Sunday 02:00
  # Restored (throwaway) database to verify. Required when enabled.
  targetDatabaseURL: ""
  # Live database URL for row-count comparison (optional; usually the production
  # DB — the same value as config.render.databaseURL).
  baselineDatabaseURL: ""
  # Operator label for the backup under test (recorded as audit evidence).
  backupRef: ""
  # RPO/RTO SLA targets (Go durations, e.g. 24h / 30m). Empty = no target. The
  # recovery_objectives check warns if the measured RPO/RTO exceeds them. Pass
  # --backup-taken-at / --restore-duration from the restore step to measure them.
  rpoTarget: ""
  rtoTarget: ""
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Pod wall-clock backstop. Must EXCEED the in-process 30m drill timeout so the
  # drill self-terminates with a recorded verdict before the kubelet SIGKILLs it
  # mid-run (which would leave no record and read as a recoverability failure).
  activeDeadlineSeconds: 2100
  # If a scheduled run is missed (controller down, or a prior run still active),
  # still start it within this window rather than silently dropping the weekly
  # drill until the next slot.
  startingDeadlineSeconds: 3600
  # A bounded default so a large-DB drill is sized, not OOM-evicted (which would
  # read as a recoverability failure). Override for very large databases.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
