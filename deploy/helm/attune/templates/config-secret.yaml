{{- include "attune.validate" . -}}
{{- if and .Values.workload.enabled (not .Values.config.existingSecret) .Values.config.render.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "attune.configSecretName" . }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
  {{- with (include "attune.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.config.secretKey }}: |
    profile: {{ .Values.profile | quote }}
    port: {{ .Values.config.render.port }}
    database:
      url: {{ include "attune.databaseURL" . | quote }}
    migrations:
      confirm_lark_delete: {{ .Values.config.render.migrations.confirmLarkDelete }}
    enricher:
      interval: {{ .Values.config.render.enricher.interval | quote }}
      batch: {{ .Values.config.render.enricher.batch }}
    audit:
      retention_days: {{ .Values.config.render.audit.retentionDays }}
      prune_interval: {{ .Values.config.render.audit.pruneInterval | quote }}
    shutdown:
      drain_delay: {{ .Values.config.render.shutdown.drainDelay | quote }}
      timeout: {{ .Values.config.render.shutdown.timeout | quote }}
    console:
      base_url: {{ .Values.config.render.console.baseURL | quote }}
      session_key: {{ .Values.config.render.console.sessionKey | quote }}
      bootstrap_admin:
        email: {{ .Values.config.render.console.bootstrapAdmin.email | quote }}
        password: {{ default "" .Values.config.render.console.bootstrapAdmin.password | quote }}
    secrets:
      legacy_inbound_master_key: {{ .Values.config.render.secrets.legacyInboundMasterKey | quote }}
      tink_keyset: |
{{ .Values.config.render.secrets.tinkKeyset | nindent 8 }}
    observability:
      service_version: {{ default .Chart.AppVersion .Values.config.render.observability.serviceVersion | quote }}
      environment: {{ default .Values.profile .Values.config.render.observability.environment | quote }}
      otlp_endpoint: {{ .Values.config.render.observability.otlpEndpoint | quote }}
      otlp_traces_path: {{ .Values.config.render.observability.otlpTracesPath | quote }}
      otlp_headers:
{{- toYaml .Values.config.render.observability.otlpHeaders | nindent 8 }}
      otlp_insecure: {{ .Values.config.render.observability.otlpInsecure }}
    rate_limit:
      per_minute: {{ .Values.config.render.rateLimit.perMinute }}
      burst: {{ .Values.config.render.rateLimit.burst }}
      disabled: {{ .Values.config.render.rateLimit.disabled }}
    security:
      allow_loopback_egress: {{ .Values.config.render.security.allowLoopbackEgress }}
      allow_private_egress: {{ .Values.config.render.security.allowPrivateEgress }}
      trusted_proxy_hops: {{ .Values.config.render.security.trustedProxyHops }}
    oidc:
      enabled: {{ .Values.config.render.oidc.enabled }}
      issuer_url: {{ .Values.config.render.oidc.issuerURL | quote }}
      client_id: {{ .Values.config.render.oidc.clientID | quote }}
      client_secret: {{ .Values.config.render.oidc.clientSecret | quote }}
      redirect_uri: {{ .Values.config.render.oidc.redirectURI | quote }}
      scopes:
{{- toYaml .Values.config.render.oidc.scopes | nindent 8 }}
      user_claim: {{ .Values.config.render.oidc.userClaim | quote }}
      groups_claim: {{ .Values.config.render.oidc.groupsClaim | quote }}
      provider_name: {{ .Values.config.render.oidc.providerName | quote }}
      role_mapping:
{{- toYaml .Values.config.render.oidc.roleMapping | nindent 8 }}
      allowed_groups:
{{- toYaml .Values.config.render.oidc.allowedGroups | nindent 8 }}
      oidc_only: {{ .Values.config.render.oidc.oidcOnly }}
      skip_issuer_check: {{ .Values.config.render.oidc.skipIssuerCheck }}
      insecure_skip_verify: {{ .Values.config.render.oidc.insecureSkipVerify }}
    custom_webhooks:
{{- toYaml .Values.config.render.customWebhooks | nindent 6 }}
{{- end }}
