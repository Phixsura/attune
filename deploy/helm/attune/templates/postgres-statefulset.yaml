{{- if .Values.postgres.embedded.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "attune.postgresFullname" . }}
  labels:
    {{- include "attune.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "attune.postgresFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "attune.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.postgres.embedded.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "attune.postgresSelectorLabels" . | nindent 8 }}
        {{- with .Values.postgres.embedded.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.postgres.embedded.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.postgres.embedded.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.embedded.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.embedded.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.embedded.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.embedded.image.repository }}:{{ .Values.postgres.embedded.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.embedded.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.embedded.service.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresSecretName" . }}
                  key: {{ .Values.postgres.embedded.auth.secretKeys.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresSecretName" . }}
                  key: {{ .Values.postgres.embedded.auth.secretKeys.password }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "attune.postgresSecretName" . }}
                  key: {{ .Values.postgres.embedded.auth.secretKeys.database }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- with .Values.postgres.embedded.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          {{- with .Values.postgres.embedded.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgres.embedded.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- with .Values.postgres.embedded.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- if or (not .Values.postgres.embedded.persistence.enabled) .Values.postgres.embedded.persistence.existingClaim .Values.postgres.embedded.extraVolumes }}
      volumes:
        {{- if not .Values.postgres.embedded.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- else if .Values.postgres.embedded.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.embedded.persistence.existingClaim | quote }}
        {{- end }}
        {{- with .Values.postgres.embedded.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if and .Values.postgres.embedded.persistence.enabled (not .Values.postgres.embedded.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "attune.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
        {{- with .Values.postgres.embedded.persistence.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.postgres.embedded.persistence.accessModes | nindent 10 }}
        {{- with .Values.postgres.embedded.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.embedded.persistence.size }}
  {{- end }}
{{- end }}
