version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Phixsura/attune/internal/proto
    # The gnostic openapi annotations drive the OpenAPI generator only; Go never
    # reads them, but protoc-gen-go still emits a blank import to register the
    # extension. Point that import at the upstream lightweight gnostic-models
    # module instead of our internal/proto tree (which doesn't generate it).
    - file_option: go_package
      module: buf.build/gnostic/gnostic
      value: github.com/google/gnostic-models/openapiv3
  disable:
    - module: buf.build/googleapis/googleapis
plugins:
  # Go message types — consumed by internal/handlers.
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: internal/proto
    opt: paths=source_relative
  # TypeScript interfaces for the console SPA (ts-proto). `onlyTypes` keeps it to
  # plain interfaces with no runtime deps, and ts-proto ignores the
  # google.api.http / field_behavior options (those drive OpenAPI, not the TS
  # client) — so the annotations stay in proto without breaking TS.
  - remote: buf.build/community/stephenh-ts-proto:v2.6.1
    out: console/src/proto
    opt:
      - onlyTypes=true
      - forceLong=string
      - useOptionals=messages
      # `stringEnums=true` makes ts-proto emit string-valued enums
      # (`export enum ErrorCode { CONFLICT = "CONFLICT", ... }`) so the
      # generated TS enum constant equals the wire value verbatim. Without
      # it, ts-proto emits number-based enums and JSON deserialization maps
      # the wire `"CONFLICT"` string through a helper to the number 4 — type-
      # safe but opaque against logs and grep. Load-bearing for the
      # ErrorCode contract introduced in 2026-06-09-http-dispatcher.md.
      - stringEnums=true
  # TypeScript interfaces for the published Node SDK (@phixsura/attune, #37).
  # Same ts-proto options as the console target so the SDK's wire types are
  # byte-identical to the console's and to the contract. `onlyTypes=true` means
  # these compile to pure type declarations (no runtime JS), so generating the
  # full message set into the package adds zero runtime weight. The SDK's public
  # surface re-exports only IngestRequest/IngestResponse + ErrorResponse/ErrorCode.
  - remote: buf.build/community/stephenh-ts-proto:v2.6.1
    out: sdk/node/src/proto
    opt:
      - onlyTypes=true
      - forceLong=string
      - useOptionals=messages
      - stringEnums=true
  # OpenAPI v3 (gnostic) — REST paths come from the google.api.http annotations.
  - remote: buf.build/community/google-gnostic-openapi:v0.7.0
    out: docs/openapi
    opt:
      - enum_type=string
