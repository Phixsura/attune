syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";

import "attune/v1/batch.proto";
import "attune/v1/ingest.proto";

// SearchService provides semantic search over feedback (#30).
// Uses pgvector embeddings when available, falls back to keyword search.
service SearchService {
  rpc SemanticSearch(SemanticSearchRequest) returns (SemanticSearchResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/search"
      body: "*"
    };
  }
}

// SemanticSearchRequest is the query envelope for semantic search.
message SemanticSearchRequest {
  // The natural language query string.
  string q = 1;

  // Maximum results to return (default: 20, max: 100).
  optional int32 limit = 2;

  // Minimum similarity threshold (0.0-1.0). Results below this are excluded.
  optional float min_similarity = 3;

  // Additional filters to apply on top of semantic ranking.
  optional FeedbackFilter filter = 4;

  // Weight for semantic (embedding) similarity (0.0-1.0, default: 0.7).
  optional float semantic_weight = 5;

  // Weight for keyword (full-text) similarity (0.0-1.0, default: 0.3).
  optional float keyword_weight = 6;
}

// SemanticSearchResponse contains the ranked search results.
message SemanticSearchResponse {
  // Ranked results ordered by fused relevance score.
  repeated SemanticSearchHit hits = 1;

  // The embedding model used for this search.
  string embedding_model = 2;

  // Count of feedback rows that have embeddings in this tenant.
  int32 total_with_embeddings = 3;

  // True if semantic search was unavailable and results are keyword-only.
  bool used_keyword_fallback = 4;

  // Machine-readable reason for keyword-only fallback, when used.
  optional string fallback_reason = 5;

  // Version of the ranking algorithm and default parameters used.
  string ranking_version = 6;

  // Coverage metadata for the searched corpus.
  optional SearchCoverage coverage = 7;
}

// SemanticSearchHit is a single search result with ranking metadata.
message SemanticSearchHit {
  // The feedback row.
  Feedback feedback = 1;

  // Semantic (embedding) similarity score (0.0-1.0).
  float similarity = 2;

  // Keyword (full-text) relevance score (0.0-1.0).
  float keyword_score = 3;

  // How this result was matched: "semantic", "keyword", or "hybrid".
  string match_type = 4;

  // 1-based rank in the semantic candidate list. Zero means not present.
  int32 semantic_rank = 5;

  // 1-based rank in the lexical candidate list. Zero means not present.
  int32 lexical_rank = 6;

  // Fused relevance score after combining available candidate lists.
  float fused_score = 7;

  // Short evidence snippets explaining why this result matched.
  repeated SearchEvidence evidence = 8;

  // Bounded ranking signals used for explainability.
  repeated string ranking_signals = 9;
}

// SearchEvidence is a short, permission-safe explanation for a matched result.
message SearchEvidence {
  // The source field, for example "content", "title", or "semantic".
  string field = 1;

  // Short snippet. It must not include content the user cannot already view.
  string snippet = 2;

  // Machine-readable reason, for example "lexical_match" or "vector_similarity".
  string reason = 3;
}

// SearchCoverage describes how much of the live feedback corpus was searchable.
message SearchCoverage {
  // Count of live feedback rows in this tenant.
  int32 total_live_feedback = 1;

  // Count of live feedback rows that have embeddings in this tenant.
  int32 total_with_embeddings = 2;

  // Embedding model shared by the searchable corpus, when available.
  string embedding_model = 3;
}
