syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";

import "attune/v1/batch.proto";

// JobService provides status tracking for async batch operations (#30).
service JobService {
  rpc GetJobStatus(GetJobStatusRequest) returns (JobStatusResponse) {
    option (google.api.http) = {get: "/fb/v1/console/jobs/{job_id}"};
  }

  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/jobs"};
  }

  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/jobs/{job_id}/cancel"
      body: "*"
    };
  }
}

// JobStatus represents the lifecycle state of an async job.
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_RUNNING = 2;
  JOB_STATUS_COMPLETED = 3;
  JOB_STATUS_FAILED = 4;
  JOB_STATUS_CANCELLED = 5;
}

// GetJobStatusRequest fetches the current status of a job.
message GetJobStatusRequest {
  string job_id = 1;
}

// JobStatusResponse is the full job status with progress and result.
message JobStatusResponse {
  // Unique job identifier.
  string job_id = 1;

  // Current job status.
  JobStatus status = 2;

  // Total items to process.
  int32 total = 3;

  // Items processed so far.
  int32 progress = 4;

  // Final result (populated when status = COMPLETED).
  optional BatchFeedbackResponse result = 5;

  // Error message (populated when status = FAILED).
  optional string error = 6;

  // When the job was created (RFC3339).
  string created_at = 7;

  // When processing started (RFC3339, absent if still queued).
  optional string started_at = 8;

  // When the job finished (RFC3339, absent if still running).
  optional string completed_at = 9;

  // When the job status was last updated (RFC3339).
  optional string updated_at = 10;

  // Suggested poll interval in seconds (for long-running jobs).
  int32 retry_after_seconds = 11;
}

// ListJobsRequest lists jobs with optional filtering.
message ListJobsRequest {
  // Filter by status (optional). Values: queued, running, completed, failed, cancelled.
  optional string status = 1;

  // Maximum jobs to return (default: 20, max: 100).
  optional int32 limit = 2;
}

// ListJobsResponse contains the list of jobs.
message ListJobsResponse {
  repeated JobStatusResponse jobs = 1;
}

// CancelJobRequest cancels a running or queued job.
message CancelJobRequest {
  string job_id = 1;
}

// CancelJobResponse confirms cancellation.
message CancelJobResponse {
  // The status after cancellation attempt.
  JobStatus status = 1;

  // Human-readable result message.
  string message = 2;
}
