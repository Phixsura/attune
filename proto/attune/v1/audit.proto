syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";

service AuditLogService {
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option (google.api.http) = {
      get: "/v1/audit-log"
      additional_bindings {get: "/fb/v1/console/audit-log"}
    };
  }
  rpc ExportAuditLogCSV(ExportAuditLogCSVRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/audit-log/export.csv"
      additional_bindings {get: "/fb/v1/console/audit-log/export.csv"}
    };
  }
  rpc CreateAuditEvidenceExport(CreateAuditEvidenceExportRequest)
      returns (CreateAuditEvidenceExportResponse) {
    option (google.api.http) = {
      post: "/v1/audit-log/evidence"
      body: "*"
      additional_bindings {
      post: "/fb/v1/console/audit-log/evidence"
      body: "*"
      }
    };
  }
  rpc GetAuditEvidenceExport(GetAuditEvidenceExportRequest)
      returns (GetAuditEvidenceExportResponse) {
    option (google.api.http) = {
      get: "/v1/audit-log/evidence/{job_id}"
      additional_bindings {get: "/fb/v1/console/audit-log/evidence/{job_id}"}
    };
  }
  rpc DownloadAuditEvidenceExport(DownloadAuditEvidenceExportRequest)
      returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/audit-log/evidence/{job_id}/download"
      additional_bindings {get: "/fb/v1/console/audit-log/evidence/{job_id}/download"}
    };
  }
  rpc ListSavedAuditLogViews(ListSavedAuditLogViewsRequest)
      returns (ListSavedAuditLogViewsResponse) {
    option (google.api.http) = {
      get: "/v1/audit-log/views"
      additional_bindings {get: "/fb/v1/console/audit-log/views"}
    };
  }
  rpc CreateSavedAuditLogView(CreateSavedAuditLogViewRequest)
      returns (SavedAuditLogViewResponse) {
    option (google.api.http) = {
      post: "/v1/audit-log/views"
      body: "*"
      additional_bindings {
        post: "/fb/v1/console/audit-log/views"
        body: "*"
      }
    };
  }
  rpc UpdateSavedAuditLogView(UpdateSavedAuditLogViewRequest)
      returns (SavedAuditLogViewResponse) {
    option (google.api.http) = {
      put: "/v1/audit-log/views/{id}"
      body: "*"
      additional_bindings {
        put: "/fb/v1/console/audit-log/views/{id}"
        body: "*"
      }
    };
  }
  rpc DeleteSavedAuditLogView(DeleteSavedAuditLogViewRequest)
      returns (DeleteSavedAuditLogViewResponse) {
    option (google.api.http) = {
      delete: "/v1/audit-log/views/{id}"
      additional_bindings {delete: "/fb/v1/console/audit-log/views/{id}"}
    };
  }
}

message AuditLogEntry {
  int64 id = 1;
  string actor_type = 2;
  string actor_id = 3;
  string actor_email = 4;
  string actor_ip = 5;
  string actor_user_agent = 6;
  string action = 7;
  string target_type = 8;
  string target_id = 9;
  string summary = 10;
  string before_json = 11;
  string after_json = 12;
  string created_at = 13;
}

message ListAuditLogRequest {
  string action = 1;
  string actor_type = 2;
  string actor_id = 3;
  string target_type = 4;
  string target_id = 5;
  string from = 6;
  string to = 7;
  int32 limit = 8;
  optional string cursor = 9;
  repeated string actions = 10;
}

message ListAuditLogResponse {
  repeated AuditLogEntry items = 1;
  optional string next_cursor = 2;
}

message ExportAuditLogCSVRequest {
  string action = 1;
  string actor_type = 2;
  string actor_id = 3;
  string target_type = 4;
  string target_id = 5;
  string from = 6;
  string to = 7;
  repeated string actions = 8;
}

message CreateAuditEvidenceExportRequest {
  string from = 1;
  string to = 2;
  repeated string actions = 3;
  string actor_type = 4;
  string actor_id = 5;
  string target_type = 6;
  string target_id = 7;
}

message CreateAuditEvidenceExportResponse {
  string job_id = 1;
  string status = 2;
  int32 retry_after_seconds = 3;
}

message GetAuditEvidenceExportRequest {
  string job_id = 1;
}

message GetAuditEvidenceExportResponse {
  string job_id = 1;
  string status = 2;
  int32 total_events = 3;
  string created_at = 4;
  optional string started_at = 5;
  optional string completed_at = 6;
  optional string expires_at = 7;
  optional string downloaded_at = 8;
  optional string download_path = 9;
  optional string archive_filename = 10;
  optional string error = 11;
  int32 retry_after_seconds = 12;
}

message DownloadAuditEvidenceExportRequest {
  string job_id = 1;
}

message AuditLogViewState {
  repeated string actions = 1;
  string actor_type = 2;
  string actor_id = 3;
  string target_type = 4;
  string target_id = 5;
  string from = 6;
  string to = 7;
  string local_query = 8;
  optional string inspected_entry_id = 9;
}

message SavedAuditLogView {
  string id = 1;
  string name = 2;
  AuditLogViewState state = 3;
  string created_at = 4;
  string updated_at = 5;
}

message ListSavedAuditLogViewsRequest {}

message ListSavedAuditLogViewsResponse {
  repeated SavedAuditLogView items = 1;
}

message CreateSavedAuditLogViewRequest {
  string name = 1;
  AuditLogViewState state = 2;
}

message UpdateSavedAuditLogViewRequest {
  string id = 1;
  string name = 2;
  AuditLogViewState state = 3;
}

message SavedAuditLogViewResponse {
  SavedAuditLogView view = 1;
}

message DeleteSavedAuditLogViewRequest {
  string id = 1;
}

message DeleteSavedAuditLogViewResponse {}
