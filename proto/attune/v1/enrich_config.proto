syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "attune/v1/common.proto";

// EnrichConfigService manages per-tenant enricher prompt + the
// metadata-driven Dimension set (#10 → E3 proposal
// docs/proposals/2026/06/2026-06-07-flat-labels.md).
service EnrichConfigService {
  // GET /fb/v1/console/enrich-config
  rpc GetEnrichConfig(GetEnrichConfigRequest) returns (GetEnrichConfigResponse) {
    option (google.api.http) = {get: "/fb/v1/console/enrich-config"};
  }
  // PUT /fb/v1/console/enrich-config
  rpc UpdateEnrichConfig(UpdateEnrichConfigRequest) returns (UpdateEnrichConfigResponse) {
    option (google.api.http) = {
      put: "/fb/v1/console/enrich-config"
      body: "*"
    };
  }
  // POST /fb/v1/console/enrich-config/preview
  rpc PreviewEnrichPrompt(PreviewEnrichPromptRequest) returns (PreviewEnrichPromptResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/enrich-config/preview"
      body: "*"
    };
  }
  // GET /fb/v1/console/enrich-config/eval-suggestions
  // Returns off-list values the LLM suggested during the most recent eval run.
  rpc GetEvalSuggestions(GetEvalSuggestionsRequest) returns (GetEvalSuggestionsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/enrich-config/eval-suggestions"};
  }
  // POST /fb/v1/console/enrich-config/promote
  // Promotes a suggested value to the dimension taxonomy.
  rpc PromoteSuggestedValue(PromoteSuggestedValueRequest) returns (PromoteSuggestedValueResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/enrich-config/promote"
      body: "*"
    };
  }
}

message EnrichConfig {
  // Tenant override; unset = use default_prompt_template.
  optional string prompt_template = 1;
  // Built-in default prompt body, always returned so the console can
  // offer a "restore default" affordance.
  string default_prompt_template = 2;
  // Per-tenant Dimension set. Migration 014 seeds 3 dims (type +
  // severity + labels) on every fresh tenant; operators may add /
  // remove / edit any dim from here.
  repeated Dimension dimensions = 3;
}

message GetEnrichConfigRequest {}

message GetEnrichConfigResponse {
  EnrichConfig config = 1;
}

message UpdateEnrichConfigRequest {
  // Omit / null to restore the built-in default prompt.
  optional string prompt_template = 1;
  // Empty list clears all dims (LLM still emits title + rationale).
  repeated Dimension dimensions = 2;
}

message UpdateEnrichConfigResponse {
  EnrichConfig config = 1;
}

message PreviewEnrichPromptRequest {
  string sample_content = 1 [(google.api.field_behavior) = REQUIRED];
}

message PreviewEnrichPromptResponse {
  string rendered_prompt = 1;
}

// GetEvalSuggestions returns off-list values the LLM suggested during eval.
message GetEvalSuggestionsRequest {}

message GetEvalSuggestionsResponse {
  // Coverage per dimension: 1.0 = all on-list, 0.85 = 15% dropped.
  map<string, double> coverage = 1;
  // Top suggested candidates sorted by confidence descending.
  repeated SuggestedCandidate candidates = 2;
  // Actionable recommendations for high-confidence candidates.
  repeated SuggestedRecommendation recommendations = 3;
}

// SuggestedCandidate is one off-list value with analysis metadata.
message SuggestedCandidate {
  string dim = 1;
  string value = 2;
  int32 count = 3;
  double confidence = 4;
  double coverage_impact = 5;
}

// SuggestedRecommendation is an actionable suggestion for the operator.
message SuggestedRecommendation {
  string action = 1;
  string dim = 2;
  string value = 3;
  string reason = 4;
  string impact = 5;
}

// PromoteSuggestedValue adds a value to the dimension taxonomy.
message PromoteSuggestedValueRequest {
  string dimension_name = 1 [(google.api.field_behavior) = REQUIRED];
  string value = 2 [(google.api.field_behavior) = REQUIRED];
  I18nString display_name = 3 [(google.api.field_behavior) = REQUIRED];
}

message PromoteSuggestedValueResponse {
  // The updated dimension with the new taxonomy value.
  Dimension dimension = 1;
}
