syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// InboundSourceService manages a tenant's inbound source rows (#66
// channel-agnostic inbound framework). Sources back the webhook,
// email IMAP, Slack, Zendesk, and Intercom adapters; future channels
// (RSS, scrape, MQ, …) hang off the same shape.
service InboundSourceService {
  // GET /fb/v1/console/inbound/sources
  rpc ListInboundSources(ListInboundSourcesRequest) returns (ListInboundSourcesResponse) {
    option (google.api.http) = {get: "/fb/v1/console/inbound/sources"};
  }
  // GET /fb/v1/console/inbound/sources/{id}
  rpc GetInboundSource(GetInboundSourceRequest) returns (InboundSource) {
    option (google.api.http) = {get: "/fb/v1/console/inbound/sources/{id}"};
  }
  // POST /fb/v1/console/inbound/sources — create webhook, email, Slack, or Zendesk source.
  // Webhook responses include a one-time secret reveal (url + secret +
  // example); the raw secret is never returned again.
  rpc CreateInboundSource(CreateInboundSourceRequest) returns (CreateInboundSourceResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources"
      body: "*"
    };
  }
  // POST /fb/v1/console/inbound/sources/{id}/rotate-secret — webhook only.
  // Returns 409 with rotation_in_grace_window error if a prior rotation
  // is still inside its 24h grace.
  rpc RotateInboundSourceSecret(RotateInboundSourceSecretRequest) returns (RotateInboundSourceSecretResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources/{id}/rotate-secret"
      body: "*"
    };
  }
  // POST /fb/v1/console/inbound/sources/{id}/pause — disables the source.
  rpc PauseInboundSource(PauseInboundSourceRequest) returns (InboundSource) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources/{id}/pause"
      body: "*"
    };
  }
  // POST /fb/v1/console/inbound/sources/{id}/resume — re-enables.
  rpc ResumeInboundSource(ResumeInboundSourceRequest) returns (InboundSource) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources/{id}/resume"
      body: "*"
    };
  }
  // DELETE /fb/v1/console/inbound/sources/{id}
  rpc DeleteInboundSource(DeleteInboundSourceRequest) returns (DeleteInboundSourceResponse) {
    option (google.api.http) = {delete: "/fb/v1/console/inbound/sources/{id}"};
  }
  // POST /fb/v1/console/inbound/sources/test-connection — email,
  // Slack, or Zendesk only, no state changes. Validates the configured
  // auth path.
  rpc TestInboundConnection(TestInboundConnectionRequest) returns (TestInboundConnectionResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources/test-connection"
      body: "*"
    };
  }
  // POST /fb/v1/console/inbound/sources/slack/discover — returns the
  // readable channels for a Slack bot token so Console can let the
  // operator select a channel without hand-typing opaque IDs.
  rpc DiscoverSlackChannels(DiscoverSlackChannelsRequest) returns (DiscoverSlackChannelsResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/inbound/sources/slack/discover"
      body: "*"
    };
  }
}

// InboundSource never carries the secret — it is write-only once stored.
message InboundSource {
  string id = 1;
  string tenant_id = 2;
  string channel = 3;  // "webhook" | "email" | "slack" | "zendesk" | "intercom" | future channels
  string name = 4;
  string slug = 5;
  bool enabled = 6;
  optional string last_event_at = 7;  // RFC3339, null if never received
  int64 last_uid = 8;                 // poll-mode cursor; 0 for push channels
  string last_error = 9;              // empty if healthy
  string created_at = 10;             // RFC3339
  string updated_at = 11;             // RFC3339
  // Sync progress stats (populated for poll-mode channels like Zendesk).
  optional int64 tickets_synced = 12;
  optional int64 last_synced_ticket_id = 13;
  optional bool backfill_done = 14;
}

message ListInboundSourcesRequest {}

message ListInboundSourcesResponse {
  repeated InboundSource items = 1;
}

message GetInboundSourceRequest {
  string id = 1;  // path param (UUID)
}

// CreateInboundSourceRequest — one of webhook_config / email_config is
// required based on channel. The framework selects the relevant payload;
// the other is ignored.
message CreateInboundSourceRequest {
  string channel = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  optional WebhookCreateConfig webhook_config = 3;
  optional EmailCreateConfig email_config = 4;
  optional SlackConnConfig slack_config = 5;
  optional ZendeskConnConfig zendesk_config = 6;
  optional IntercomConnConfig intercom_config = 7;
}

// CreateInboundSourceResponse always carries the persisted InboundSource.
// For webhook channels, webhook_secret_reveal is also populated — this is
// the only place the raw secret is ever transmitted; clients must store
// it immediately because rotate is the only path to a new value.
message CreateInboundSourceResponse {
  InboundSource source = 1;
  optional WebhookSecretReveal webhook_secret_reveal = 2;
}

// WebhookCreateConfig has no body today — the secret is generated
// server-side. The empty message is a placeholder so future webhook
// options (e.g., HMAC algorithm override) can be added without breaking
// CreateInboundSourceRequest's shape.
message WebhookCreateConfig {}

message EmailCreateConfig {
  string host = 1 [(google.api.field_behavior) = REQUIRED];
  int32 port = 2 [(google.api.field_behavior) = REQUIRED];
  bool tls = 3;
  string username = 4 [(google.api.field_behavior) = REQUIRED];
  string password = 5 [(google.api.field_behavior) = REQUIRED];
  string folder = 6;                  // defaults to "INBOX"
  // Field 7 reserved — poll_interval_seconds was removed before release
  // (#66 review H2): the current pollLoop topology uses a fixed
  // loopInterval = 60s for all sources; per-source intervals require a
  // per-source-goroutine refactor and weren't shipping in v1.
  reserved 7;
  reserved "poll_interval_seconds";
  string start_from = 8;              // "now" | "all_unseen" (default "now")
  string after_ingest = 9;            // "mark_seen" | "keep_unseen" | "move_to:<folder>" (default "mark_seen")
}

// WebhookSecretReveal — one-time payload returned at Create + Rotate so
// admins can publish the URL + secret to their automation. The secret
// is lowercase-hex-encoded; signature is HMAC-SHA256(secret_raw_bytes,
// "<X-Attune-Timestamp>.<body>") (spec §Webhook adapter). The
// signature header is hex-encoded (e.g. "sha256=ab12…").
message WebhookSecretReveal {
  string url = 1;
  string secret_hex = 2;
  string curl_example = 3;
}

message RotateInboundSourceSecretRequest {
  string id = 1;  // path param (UUID)
}

message RotateInboundSourceSecretResponse {
  string secret_hex = 1;
  string next_eligible_at = 2;  // RFC3339, end of 24h grace
}

message PauseInboundSourceRequest {
  string id = 1;
}

message ResumeInboundSourceRequest {
  string id = 1;
}

message DeleteInboundSourceRequest {
  string id = 1;
}

message DeleteInboundSourceResponse {}

// TestInboundConnectionRequest validates an IMAP config without
// persisting it. Returns ok=false + error message rather than 5xx when
// the upstream rejects credentials or channel access.
message TestInboundConnectionRequest {
  string channel = 1 [(google.api.field_behavior) = REQUIRED];  // currently "email", "slack", "zendesk", or "intercom"
  optional EmailConnConfig email_config = 2;
  optional SlackConnConfig slack_config = 3;
  optional ZendeskConnConfig zendesk_config = 4;
  optional IntercomConnConfig intercom_config = 5;
}

message TestInboundConnectionResponse {
  bool ok = 1;
  optional string error = 2;
  optional int64 latency_ms = 3;
  // Human-readable identity of the connected upstream (Intercom
  // workspace name; other channels may fill it later).
  optional string workspace_name = 4;
}

message EmailConnConfig {
  string host = 1;
  int32 port = 2;
  bool tls = 3;
  string username = 4;
  string password = 5;
  string folder = 6;
}

message SlackConnConfig {
  string bot_token = 1;
  string channel_id = 2;  // optional for auth-only test / required for create
}

message SlackChannel {
  string id = 1;
  string name = 2;
  bool is_private = 3;
  bool is_archived = 4;
  bool is_shared = 5;
}

message DiscoverSlackChannelsRequest {
  SlackConnConfig slack_config = 1 [(google.api.field_behavior) = REQUIRED];
}

message DiscoverSlackChannelsResponse {
  repeated SlackChannel channels = 1;
}

// ZendeskConnConfig carries the Zendesk connection parameters for create
// and test-connection flows. Auth supports "api_token" (email + API
// token, sunsetting 2027-04-30) and "oauth" (OAuth 2.0 client
// credentials).
message ZendeskConnConfig {
  string subdomain = 1 [(google.api.field_behavior) = REQUIRED];
  string auth_mode = 2 [(google.api.field_behavior) = REQUIRED];  // "api_token" | "oauth"
  // api_token auth fields.
  optional string email = 3;
  optional string api_token = 4;
  // Fields 5-6 reserved: were oauth_client_id/oauth_client_secret in MVP;
  // replaced by paste-mode token fields below.
  reserved 5, 6;
  reserved "oauth_client_id", "oauth_client_secret";
  optional string start_from = 7;
  // OAuth paste-mode fields (replaces old client-credential fields).
  optional string oauth_access_token = 8;
  optional string oauth_refresh_token = 9;
  optional string oauth_client_id_v2 = 10;   // for refresh grant
  optional string oauth_client_secret_v2 = 11; // for refresh grant
  // Advanced config.
  repeated string filter_tags = 12;
  repeated string filter_exclude_tags = 13;
  repeated string filter_statuses = 14;
  optional int32 max_comment_fetches = 15;
}

// IntercomConnConfig carries the Intercom connection parameters for
// create and test-connection flows. Auth is a private-app Access Token
// (Bearer) — Intercom's documented model for same-workspace server
// integrations; OAuth applies to public/multi-workspace apps (#32).
message IntercomConnConfig {
  string region = 1 [(google.api.field_behavior) = REQUIRED];        // "us" | "eu" | "au"
  string access_token = 2 [(google.api.field_behavior) = REQUIRED];  // write-only, never returned
  optional string start_from = 3;      // "now" (default) | "full"
  repeated string filter_states = 4;   // open/closed/snoozed; empty = all
  optional int32 max_detail_fetches = 5;
  repeated string filter_tags = 6;         // conversation must carry ALL
  repeated string filter_exclude_tags = 7; // skip if it carries ANY
}
