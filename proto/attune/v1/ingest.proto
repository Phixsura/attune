  int64 closed_count = 4;
  int64 urgent_open_count = 5;
  int64 terminal_failure_count = 6;
  int64 identity_debt_count = 7;
  int64 overdue_count = 8;
  int64 due_soon_count = 9;
  repeated FeedbackTriageLane lanes = 10;
}

message FeedbackTriageLane {
  string key = 1;
  string label = 2;
  string owner_lane = 3;
  string severity = 4;
  int32 sla_hours = 5;
  int64 count = 6;
  int64 overdue_count = 7;
  int64 due_soon_count = 8;
  string oldest_created_at = 9;
  string next_deadline_at = 10;
  string recommended_action = 11;
  string filter_query = 12;
  repeated int64 sample_feedback_ids = 13;
}
