syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "gnostic/openapi/v3/annotations.proto";

import "attune/v1/tag.proto";
import "attune/v1/workflow.proto";

// FeedbackService is attune's feedback API. Today it exposes Ingest
// (POST /v1/feedback/ingest, public, API-key auth); the console feedback reads
// (list / stats / detail) join it as the migration proceeds.
//
// We do NOT generate server stubs — chi routing stays. The google.api.http
// annotation exists only so protoc-gen-openapi emits the REST path + operation
// into the OpenAPI document. (ts-proto with onlyTypes ignores this service.)
service FeedbackService {
  // Ingest stores one feedback item and queues it for enrichment.
  //
  // Idempotency: send an `Idempotency-Key` header to make retries safe — a
  // replay with the same key + body returns the original id; the same key with
  // a different body fails 409. Errors use the shared ErrorResponse envelope
  // (`code` from the ErrorCode enum).
  rpc Ingest(IngestRequest) returns (IngestResponse) {
    option (google.api.http) = {
      post: "/v1/feedback/ingest"
      body: "*"
    };
    // The OpenAPI document is generated, so the header parameter and the
    // header-driven error responses (which the proto request/response types
    // can't express) are declared here for the REST contract.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            description: "Optional dedup token (8-64 chars, [A-Za-z0-9_-]). Replaying the same key with the same body returns the original feedback id; reusing it with a different body fails with 409 IDEMPOTENCY_CONFLICT. When omitted, each request is treated as distinct."
            required: false
            schema: {schema: {type: "string"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "409"
            value: {response: {description: "Idempotency-Key was reused with a different request body (error code IDEMPOTENCY_CONFLICT)."}}
          },
          {
            name: "413"
            value: {response: {description: "Request body exceeds the 64 KiB ingest limit (error code BODY_TOO_LARGE)."}}
          },
          {
            name: "429"
            value: {response: {description: "Rate limited by the per-tenant or per-key limiter; response carries a Retry-After header (error code RATE_LIMITED)."}}
          }
        ]
      }
    };
  }

  // GET /fb/v1/console/feedback (console; session auth)
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback"};
  }
  // GET /fb/v1/console/feedback/{id}
  rpc GetFeedback(GetFeedbackRequest) returns (FeedbackDetail) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/{id}"};
  }
  // GET /fb/v1/console/feedback/{feedback_id}/signal-trace
  rpc GetFeedbackSignalTrace(GetFeedbackSignalTraceRequest) returns (FeedbackSignalTrace) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/{feedback_id}/signal-trace"};
  }
  // GET /fb/v1/console/feedback/stats
  rpc GetFeedbackStats(GetFeedbackStatsRequest) returns (GetFeedbackStatsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/stats"};
  }
  // GET /fb/v1/console/feedback/identity-review
  rpc GetFeedbackIdentityReview(GetFeedbackIdentityReviewRequest) returns (GetFeedbackIdentityReviewResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/identity-review"};
  }
  // GET /fb/v1/console/feedback/identity-review/subjects/{subject_id}
  rpc GetFeedbackIdentitySubject(GetFeedbackIdentitySubjectRequest) returns (FeedbackIdentitySubjectDetail) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/identity-review/subjects/{subject_id}"};
  }
  // POST /fb/v1/console/feedback/identity-review/merge
  rpc MergeFeedbackIdentityReview(MergeFeedbackIdentityReviewRequest) returns (MergeFeedbackIdentityReviewResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/identity-review/merge"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/identity-review/split
  rpc SplitFeedbackIdentityReview(SplitFeedbackIdentityReviewRequest) returns (SplitFeedbackIdentityReviewResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/identity-review/split"
      body: "*"
    };
  }
  // GET /fb/v1/console/feedback/terminal-failures
  rpc GetTerminalFailureWorkbench(GetTerminalFailureWorkbenchRequest) returns (GetTerminalFailureWorkbenchResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/terminal-failures"};
  }
  // GET /fb/v1/console/feedback/triage-command-center
  rpc GetFeedbackTriageCommandCenter(GetFeedbackTriageCommandCenterRequest) returns (FeedbackTriageCommandCenter) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/triage-command-center"};
  }
  // PATCH /fb/v1/console/feedback/{feedback_id}/assignment
  rpc AssignFeedback(AssignFeedbackRequest) returns (FeedbackAssignment) {
    option (google.api.http) = {
      patch: "/fb/v1/console/feedback/{feedback_id}/assignment"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/assignment:batch
  rpc BatchAssignFeedback(BatchAssignFeedbackRequest) returns (BatchAssignFeedbackResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/assignment:batch"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/assignment:recommend
  rpc RecommendFeedbackAssignment(RecommendFeedbackAssignmentRequest) returns (RecommendFeedbackAssignmentResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/assignment:recommend"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/assignment:apply-recommendations
  rpc ApplyFeedbackAssignmentRecommendations(ApplyFeedbackAssignmentRecommendationsRequest) returns (ApplyFeedbackAssignmentRecommendationsResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/assignment:apply-recommendations"
      body: "*"
    };
  }
  // GET /fb/v1/console/feedback/assignment/escalations
  rpc GetFeedbackAssignmentEscalations(GetFeedbackAssignmentEscalationsRequest) returns (FeedbackAssignmentEscalationQueue) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/assignment/escalations"};
  }
  // GET /fb/v1/console/feedback/assignment/policy
  rpc GetFeedbackAssignmentPolicy(GetFeedbackAssignmentPolicyRequest) returns (FeedbackAssignmentPolicy) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/assignment/policy"};
  }
  // PUT /fb/v1/console/feedback/assignment/policy
  rpc UpdateFeedbackAssignmentPolicy(UpdateFeedbackAssignmentPolicyRequest) returns (FeedbackAssignmentPolicy) {
    option (google.api.http) = {
      put: "/fb/v1/console/feedback/assignment/policy"
      body: "*"
    };
  }
  // GET /fb/v1/console/feedback/assignment/policy/revisions
  rpc ListFeedbackAssignmentPolicyRevisions(ListFeedbackAssignmentPolicyRevisionsRequest) returns (ListFeedbackAssignmentPolicyRevisionsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/assignment/policy/revisions"};
  }
  // POST /fb/v1/console/feedback/assignment/policy:dry-run
  rpc DryRunFeedbackAssignmentPolicy(DryRunFeedbackAssignmentPolicyRequest) returns (DryRunFeedbackAssignmentPolicyResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/assignment/policy:dry-run"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/assignment/policy:restore
  rpc RestoreFeedbackAssignmentPolicy(RestoreFeedbackAssignmentPolicyRequest) returns (FeedbackAssignmentPolicy) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/assignment/policy:restore"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/regenerate (console; member session auth)
  rpc RegenerateReplyDraft(RegenerateReplyDraftRequest) returns (RegenerateReplyDraftResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/regenerate"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/edit (console; member session auth)
  rpc UpdateReplyDraft(UpdateReplyDraftRequest) returns (ReplyDraftWorkflowResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/edit"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/approve (console; member session auth)
  rpc ApproveReplyDraft(ApproveReplyDraftRequest) returns (ReplyDraftWorkflowResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/approve"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/reject (console; member session auth)
  rpc RejectReplyDraft(RejectReplyDraftRequest) returns (ReplyDraftWorkflowResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/reject"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/send (console; member session auth)
  rpc SendReplyDraft(SendReplyDraftRequest) returns (SendReplyDraftResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/send"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            description: "Required dedup token (8-128 chars, [A-Za-z0-9_-]) for safe reply-send retries. The JSON idempotencyKey field is accepted for generated clients that cannot set headers."
            required: true
            schema: {schema: {type: "string"}}
          }
        }
      ]
    };
  }
  // GET /fb/v1/console/reply-send-hook (console; admin session auth)
  rpc GetReplySendHook(GetReplySendHookRequest) returns (ReplySendHook) {
    option (google.api.http) = {get: "/fb/v1/console/reply-send-hook"};
  }
  // PUT /fb/v1/console/reply-send-hook (console; admin session auth)
  rpc UpsertReplySendHook(UpsertReplySendHookRequest) returns (ReplySendHook) {
    option (google.api.http) = {
      put: "/fb/v1/console/reply-send-hook"
      body: "*"
    };
  }
  // DELETE /fb/v1/console/reply-send-hook (console; admin session auth)
  rpc DisableReplySendHook(DisableReplySendHookRequest) returns (ReplySendHook) {
    option (google.api.http) = {delete: "/fb/v1/console/reply-send-hook"};
  }
  // GET /fb/v1/console/reply-send-hook/health (console; admin session auth)
  rpc GetReplySendHookHealth(GetReplySendHookHealthRequest) returns (ReplySendHookHealth) {
    option (google.api.http) = {get: "/fb/v1/console/reply-send-hook/health"};
  }
  // GET /fb/v1/console/reply-send-hook/deliveries (console; admin session auth)
  rpc ListReplySendHookDeliveries(ListReplySendHookDeliveriesRequest) returns (ListReplySendHookDeliveriesResponse) {
    option (google.api.http) = {get: "/fb/v1/console/reply-send-hook/deliveries"};
  }
  // POST /fb/v1/console/reply-send-hook/test (console; admin session auth)
  rpc TestReplySendHook(TestReplySendHookRequest) returns (ReplySendHookDelivery) {
    option (google.api.http) = {
      post: "/fb/v1/console/reply-send-hook/test"
      body: "*"
    };
  }
  // POST /fb/v1/console/reply-send-hook/deliveries/{id}/redeliver (console; admin session auth)
  rpc RedeliverReplySendHookDelivery(RedeliverReplySendHookDeliveryRequest) returns (ReplySendHookDelivery) {
    option (google.api.http) = {
      post: "/fb/v1/console/reply-send-hook/deliveries/{id}/redeliver"
      body: "*"
    };
  }
  // POST /fb/v1/console/feedback/{id}/retry-enrichment (console; session auth)
  // Resets a terminal-failed row so it can be re-enriched.
  rpc RetryEnrichment(RetryEnrichmentRequest) returns (RetryEnrichmentResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/retry-enrichment"
      body: "*"
    };
  }
}

// IngestRequest is the JSON body of POST /v1/feedback/ingest.
//
// JSON field names follow the protoJSON default (lowerCamelCase), which exactly
// reproduces today's wire: content / source / sourceUser / sourceMeta / pageUrl.
message IngestRequest {
  // The feedback text. Required; the handler caps it at 5000 chars.
  string content = 1 [(google.api.field_behavior) = REQUIRED];

  // Inbound channel/source identity ("api", "web", …). Channel-agnostic and
  // validated against the handler allow-list; defaults to "api" when empty.
  string source = 2;

  // Opaque end-user identifier from the originating system (optional).
  string source_user = 3;

  // Arbitrary source-specific metadata (optional).
  google.protobuf.Struct source_meta = 4;

  // Originating page URL, for the in-app web widget (optional).
  string page_url = 5;
}

// IngestResponse is returned on 200.
message IngestResponse {
  // The stored feedback row id.
  //
  // NOTE: per the protoJSON spec, int64 serializes as a JSON *string*
  // ({"id":"123"}). Deliberate — JavaScript cannot safely parse 64-bit integers.
  int64 id = 1;

  // Enrichment lifecycle state at ingest time (always "pending" here).
  string enrichment_status = 2;
}

// Feedback is a console feedback list row. Post-E3 (metadata-driven
// Dimensions): the per-row classification lives in `enriched_attrs`, a
// map<dim.name, value> where value is a JSON string (single-kind dim)
// or a JSON string array (multi-kind dim). `is_urgent` is a derived
// boolean persisted at write time.
message Feedback {
  int64 id = 1;  // → JSON string
  string content = 2;
  string source = 3;
  string type = 4;
  string user_id = 5;
  string page_url = 6;
  optional string enriched_title = 7;
  // map<dim.name, string | repeated string> — the LLM-emitted values.
  google.protobuf.Struct enriched_attrs = 8;
  bool is_urgent = 9;
  string enrichment_status = 10;  // pending | enriching | done | failed
  string created_at = 11;         // RFC3339
  optional string language = 12;   // ISO 639-1-ish detected source language
  optional string enriched_display_title = 13;     // tenant-locale console title
  optional string enriched_display_locale = 14;  // tenant locale used for display
  optional double classification_confidence = 15;  // model self-rated review signal [0,1]
  repeated Tag tags = 16;
  optional WorkflowState         workflow_state      = 17;
  repeated WorkflowState         allowed_next_states = 18;
  // Number of enrichment attempts made (0 = never attempted, max 5)
  optional int32 enrichment_attempts = 19;
  // RFC3339 timestamp of next scheduled retry; absent if terminal or not failed
  optional string enrichment_next_retry_at = 20;
  optional string enrichment_failure_reason_class = 21;
  optional string enrichment_failure_model = 22;
  optional string enrichment_failure_channel_id = 23;
  optional string enrichment_failure_channel_name = 24;
  optional string enrichment_failure_config_fingerprint = 25;
  optional string enrichment_failure_prompt_version = 26;
  optional FeedbackAssignment assignment = 27;
  optional FeedbackAccountContext account_context = 28;
}

// FeedbackDetail is the single-row view: the list fields plus extras (flat).
message FeedbackDetail {
  int64 id = 1;
  string content = 2;
  string source = 3;
  string type = 4;
  string user_id = 5;
  string page_url = 6;
  optional string enriched_title = 7;
  google.protobuf.Struct enriched_attrs = 8;
  bool is_urgent = 9;
  string enrichment_status = 10;
  string created_at = 11;
  google.protobuf.Struct source_meta = 12;
  repeated Attachment attachments = 13;
  optional string enrichment_error = 14;
  optional string enriched_at = 15;  // RFC3339
  // LLM's short "why these values" justification. Already delivered
  // via the outbox envelope; persisted to user_feedback.enriched_rationale
  // by migration 013.
  optional string enriched_rationale = 16;
  optional string language = 17;  // ISO 639-1-ish detected source language
  optional string enriched_display_title = 18;      // tenant-locale console title
  optional string enriched_display_rationale = 19;  // tenant-locale "why these values"
  optional string enriched_display_locale = 20;   // tenant locale used for display
  optional double classification_confidence = 21;  // model self-rated review signal [0,1]
  optional string reply_draft = 22;                 // operator-facing LLM draft (#26); never auto-sent
  optional string reply_draft_generated_at = 23;    // RFC3339; when the draft was last generated
  bool reply_draft_enabled = 24;                    // tenant opt-in; lets the UI tell off / on-but-empty / has-draft apart
  repeated Tag tags = 25;
  optional WorkflowState         workflow_state      = 26;
  repeated WorkflowState         allowed_next_states = 27;
  // Number of enrichment attempts made (0 = never attempted, max 5)
  optional int32 enrichment_attempts = 28;
  // RFC3339 timestamp of next scheduled retry; absent if terminal or not failed
  optional string enrichment_next_retry_at = 29;
  optional string enrichment_failure_reason_class = 30;
  optional string enrichment_failure_model = 31;
  optional string enrichment_failure_channel_id = 32;
  optional string enrichment_failure_channel_name = 33;
  optional string enrichment_failure_config_fingerprint = 34;
  optional string enrichment_failure_prompt_version = 35;
  optional ReplyDraftWorkflow reply_draft_workflow = 36;
  FeedbackIdentityEvidence identity_evidence = 37;
  optional FeedbackAssignment assignment = 38;
  optional FeedbackAccountContext account_context = 39;
}

// FeedbackAccountContext normalizes account/company hints embedded in source
// metadata so raw feedback can participate in account-level filtering before a
// durable account table owns the canonical profile.
message FeedbackAccountContext {
  string account_key = 1;
  string account_display = 2;
  string source = 3;
}

message FeedbackAssignmentOwner {
  string member_id = 1;
  string member_type = 2;
  string user_id = 3;
  string email = 4;
  string role = 5;
}

message FeedbackAssignment {
  int64 feedback_id = 1;
  optional FeedbackAssignmentOwner owner = 2;
  optional string assigned_at = 3;
  string assigned_by = 4;
  optional string sla_due_at = 5;
  string sla_status = 6;
  string note = 7;
}

message AssignFeedbackRequest {
  int64 feedback_id = 1;
  optional string owner_member_id = 2;
  optional string sla_due_at = 3;
  string note = 4;
}

message BatchAssignFeedbackRequest {
  repeated int64 feedback_ids = 1;
  bool owner_member_id_set = 2;
  optional string owner_member_id = 3;
  bool sla_due_at_set = 4;
  optional string sla_due_at = 5;
  string note = 6;
}

message BatchAssignFeedbackResponse {
  int32 total_matched = 1;
  int32 succeeded = 2;
  repeated BatchAssignFeedbackFailure failed = 3;
}

message BatchAssignFeedbackFailure {
  int64 feedback_id = 1;
  string code = 2;
  string message = 3;
}

message RecommendFeedbackAssignmentRequest {
  repeated int64 feedback_ids = 1;
}

message FeedbackAssignmentRecommendation {
  int64 feedback_id = 1;
  string rule_key = 2;
  string rule_name = 3;
  string owner_lane = 4;
  string severity = 5;
  int32 sla_hours = 6;
  optional string recommended_sla_due_at = 7;
  string rationale = 8;
  bool already_satisfied = 9;
  optional FeedbackAssignment current_assignment = 10;
  optional string recommended_owner_member_id = 11;
}

message RecommendFeedbackAssignmentResponse {
  int32 total_matched = 1;
  repeated FeedbackAssignmentRecommendation recommendations = 2;
  repeated BatchAssignFeedbackFailure failed = 3;
}

message ApplyFeedbackAssignmentRecommendationsRequest {
  repeated int64 feedback_ids = 1;
  optional string owner_member_id = 2;
  string note = 3;
}

message ApplyFeedbackAssignmentRecommendationsResponse {
  int32 total_matched = 1;
  int32 succeeded = 2;
  int32 skipped = 3;
  repeated BatchAssignFeedbackFailure failed = 4;
  repeated FeedbackAssignmentRecommendation applied = 5;
}

message GetFeedbackAssignmentEscalationsRequest {
  optional int32 limit = 1;
}

message FeedbackAssignmentEscalationQueue {
  string generated_at = 1;
  int64 overdue_count = 2;
  int64 due_soon_count = 3;
  int64 missing_owner_count = 4;
  int64 missing_sla_count = 5;
  repeated FeedbackAssignmentEscalation items = 6;
}

message FeedbackAssignmentEscalation {
  int64 feedback_id = 1;
  string title = 2;
  string source = 3;
  string type = 4;
  bool is_urgent = 5;
  string created_at = 6;
  optional FeedbackAssignment assignment = 7;
  repeated string escalation_reasons = 8;
  optional int32 hours_until_due = 9;
  string priority = 10;
  optional FeedbackAccountContext account_context = 11;
}

message GetFeedbackAssignmentPolicyRequest {}

message FeedbackAssignmentPolicyRule {
  string rule_key = 1;
  string rule_name = 2;
  string owner_lane = 3;
  string severity = 4;
  int32 sla_hours = 5;
  optional string default_owner_member_id = 6;
  bool enabled = 7;
  string rationale = 8;
}

message FeedbackAssignmentPolicy {
  repeated FeedbackAssignmentPolicyRule rules = 1;
  int32 version = 2;
  optional string updated_at = 3;
  string updated_by = 4;
  string note = 5;
}

message UpdateFeedbackAssignmentPolicyRequest {
  repeated FeedbackAssignmentPolicyRule rules = 1;
  string note = 2;
}

message ListFeedbackAssignmentPolicyRevisionsRequest {}

message FeedbackAssignmentPolicyRevision {
  int32 version = 1;
  optional string updated_at = 2;
  string updated_by = 3;
  string note = 4;
  repeated FeedbackAssignmentPolicyRule rules = 5;
}

message ListFeedbackAssignmentPolicyRevisionsResponse {
  repeated FeedbackAssignmentPolicyRevision revisions = 1;
}

message DryRunFeedbackAssignmentPolicyRequest {
  repeated FeedbackAssignmentPolicyRule rules = 1;
  repeated int64 feedback_ids = 2;
}

message FeedbackAssignmentPolicyDryRunImpact {
  int64 feedback_id = 1;
  string current_rule_key = 2;
  string current_rule_name = 3;
  string current_owner_lane = 4;
  int32 current_sla_hours = 5;
  optional string current_owner_member_id = 6;
  string draft_rule_key = 7;
  string draft_rule_name = 8;
  string draft_owner_lane = 9;
  int32 draft_sla_hours = 10;
  optional string draft_owner_member_id = 11;
  bool changed = 12;
}

message DryRunFeedbackAssignmentPolicyResponse {
  int32 total_matched = 1;
  int32 changed = 2;
  repeated FeedbackAssignmentRecommendation recommendations = 3;
  repeated BatchAssignFeedbackFailure failed = 4;
  repeated FeedbackAssignmentPolicyDryRunImpact impacts = 5;
}

message RestoreFeedbackAssignmentPolicyRequest {
  int32 version = 1;
  string note = 2;
}

message Attachment {
  string url = 1;
  optional string mime = 2;
  optional int64 size = 3;
}

// FeedbackIdentityEvidence normalizes the customer identity signals embedded in
// user_feedback.user_id and source_meta so console detail views can show which
// fields are available for identity-graph merging.
message FeedbackIdentityEvidence {
  string source_user = 1;
  repeated FeedbackIdentityKey keys = 2;
  int32 merge_candidate_count = 3;
  bool has_email = 4;
  bool has_external_id = 5;
  bool has_source_contact_id = 6;
  bool has_crm_id = 7;
  bool has_support_id = 8;
  FeedbackIdentityAssessment assessment = 9;
}

message FeedbackIdentityKey {
  string kind = 1;
  string value = 2;
  string source = 3;
}

enum FeedbackIdentityResolutionStrength {
  FEEDBACK_IDENTITY_RESOLUTION_STRENGTH_UNSPECIFIED = 0;
  FEEDBACK_IDENTITY_RESOLUTION_STRENGTH_STRONG = 1;
  FEEDBACK_IDENTITY_RESOLUTION_STRENGTH_MEDIUM = 2;
  FEEDBACK_IDENTITY_RESOLUTION_STRENGTH_WEAK = 3;
}

enum FeedbackIdentityRecommendedAction {
  FEEDBACK_IDENTITY_RECOMMENDED_ACTION_UNSPECIFIED = 0;
  FEEDBACK_IDENTITY_RECOMMENDED_ACTION_REVIEW_MERGE = 1;
  FEEDBACK_IDENTITY_RECOMMENDED_ACTION_REVIEW_WITH_CONTEXT = 2;
  FEEDBACK_IDENTITY_RECOMMENDED_ACTION_CAPTURE_MORE_KEYS = 3;
}

// FeedbackIdentityAssessment gives operators a deterministic first-pass
// resolution-quality read before the full signal graph supports reversible
// merge and split operations.
message FeedbackIdentityAssessment {
  FeedbackIdentityResolutionStrength strength = 1;
  FeedbackIdentityRecommendedAction recommended_action = 2;
  repeated string missing_kinds = 3;
  repeated string risk_reasons = 4;
  int32 stable_key_count = 5;
  int32 source_count = 6;
}

message GetFeedbackIdentityReviewRequest {}

message GetFeedbackIdentityReviewResponse {
  FeedbackIdentityReviewSummary summary = 1;
  repeated FeedbackIdentityMergeCandidate merge_candidates = 2;
  repeated FeedbackIdentityNeedsEvidenceItem needs_evidence = 3;
  repeated FeedbackIdentityReviewedMerge recent_merges = 4;
  FeedbackIdentitySubjectRoster subject_roster = 5;
}

message GetFeedbackIdentitySubjectRequest {
  string subject_id = 1;
}

message MergeFeedbackIdentityReviewRequest {
  string identity_kind = 1;
  string identity_value = 2;
