syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "gnostic/openapi/v3/annotations.proto";

import "attune/v1/tag.proto";
import "attune/v1/workflow.proto";

// FeedbackService is attune's feedback API. Today it exposes Ingest
// (POST /v1/feedback/ingest, public, API-key auth); the console feedback reads
// (list / stats / detail) join it as the migration proceeds.
//
// We do NOT generate server stubs — chi routing stays. The google.api.http
// annotation exists only so protoc-gen-openapi emits the REST path + operation
// into the OpenAPI document. (ts-proto with onlyTypes ignores this service.)
service FeedbackService {
  // Ingest stores one feedback item and queues it for enrichment.
  //
  // Idempotency: send an `Idempotency-Key` header to make retries safe — a
  // replay with the same key + body returns the original id; the same key with
  // a different body fails 409. Errors use the shared ErrorResponse envelope
  // (`code` from the ErrorCode enum).
  rpc Ingest(IngestRequest) returns (IngestResponse) {
    option (google.api.http) = {
      post: "/v1/feedback/ingest"
      body: "*"
    };
    // The OpenAPI document is generated, so the header parameter and the
    // header-driven error responses (which the proto request/response types
    // can't express) are declared here for the REST contract.
    option (gnostic.openapi.v3.operation) = {
      parameters: [
        {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            description: "Optional dedup token (8-64 chars, [A-Za-z0-9_-]). Replaying the same key with the same body returns the original feedback id; reusing it with a different body fails with 409 IDEMPOTENCY_CONFLICT. When omitted, each request is treated as distinct."
            required: false
            schema: {schema: {type: "string"}}
          }
        }
      ]
      responses: {
        response_or_reference: [
          {
            name: "409"
            value: {response: {description: "Idempotency-Key was reused with a different request body (error code IDEMPOTENCY_CONFLICT)."}}
          },
          {
            name: "413"
            value: {response: {description: "Request body exceeds the 64 KiB ingest limit (error code BODY_TOO_LARGE)."}}
          },
          {
            name: "429"
            value: {response: {description: "Rate limited by the per-tenant or per-key limiter; response carries a Retry-After header (error code RATE_LIMITED)."}}
          }
        ]
      }
    };
  }

  // GET /fb/v1/console/feedback (console; session auth)
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback"};
  }
  // GET /fb/v1/console/feedback/{id}
  rpc GetFeedback(GetFeedbackRequest) returns (FeedbackDetail) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/{id}"};
  }
  // GET /fb/v1/console/feedback/stats
  rpc GetFeedbackStats(GetFeedbackStatsRequest) returns (GetFeedbackStatsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/feedback/stats"};
  }
  // POST /fb/v1/console/feedback/{id}/reply-draft/regenerate (console; session auth)
  rpc RegenerateReplyDraft(RegenerateReplyDraftRequest) returns (RegenerateReplyDraftResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/feedback/{id}/reply-draft/regenerate"
      body: "*"
    };
  }
}

// IngestRequest is the JSON body of POST /v1/feedback/ingest.
//
// JSON field names follow the protoJSON default (lowerCamelCase), which exactly
// reproduces today's wire: content / source / sourceUser / sourceMeta / pageUrl.
message IngestRequest {
  // The feedback text. Required; the handler caps it at 5000 chars.
  string content = 1 [(google.api.field_behavior) = REQUIRED];

  // Inbound channel/source identity ("api", "web", …). Channel-agnostic and
  // validated against the handler allow-list; defaults to "api" when empty.
  string source = 2;

  // Opaque end-user identifier from the originating system (optional).
  string source_user = 3;

  // Arbitrary source-specific metadata (optional).
  google.protobuf.Struct source_meta = 4;

  // Originating page URL, for the in-app web widget (optional).
  string page_url = 5;
}

// IngestResponse is returned on 200.
message IngestResponse {
  // The stored feedback row id.
  //
  // NOTE: per the protoJSON spec, int64 serializes as a JSON *string*
  // ({"id":"123"}). Deliberate — JavaScript cannot safely parse 64-bit integers.
  int64 id = 1;

  // Enrichment lifecycle state at ingest time (always "pending" here).
  string enrichment_status = 2;
}

// Feedback is a console feedback list row. Post-E3 (metadata-driven
// Dimensions): the per-row classification lives in `enriched_attrs`, a
// map<dim.name, value> where value is a JSON string (single-kind dim)
// or a JSON string array (multi-kind dim). `is_urgent` is a derived
// boolean persisted at write time.
message Feedback {
  int64 id = 1;  // → JSON string
  string content = 2;
  string source = 3;
  string type = 4;
  string user_id = 5;
  string page_url = 6;
  optional string enriched_title = 7;
  // map<dim.name, string | repeated string> — the LLM-emitted values.
  google.protobuf.Struct enriched_attrs = 8;
  bool is_urgent = 9;
  string enrichment_status = 10;  // pending | enriching | done | failed
  string created_at = 11;         // RFC3339
  optional string language = 12;   // ISO 639-1-ish detected source language
  optional string enriched_display_title = 13;     // tenant-locale console title
  optional string enriched_display_locale = 14;  // tenant locale used for display
  optional double classification_confidence = 15;  // model self-rated review signal [0,1]
  repeated Tag tags = 16;
  optional WorkflowState         workflow_state      = 17;
  repeated WorkflowState         allowed_next_states = 18;
}

// FeedbackDetail is the single-row view: the list fields plus extras (flat).
message FeedbackDetail {
  int64 id = 1;
  string content = 2;
  string source = 3;
  string type = 4;
  string user_id = 5;
  string page_url = 6;
  optional string enriched_title = 7;
  google.protobuf.Struct enriched_attrs = 8;
  bool is_urgent = 9;
  string enrichment_status = 10;
  string created_at = 11;
  google.protobuf.Struct source_meta = 12;
  repeated Attachment attachments = 13;
  optional string enrichment_error = 14;
  optional string enriched_at = 15;  // RFC3339
  // LLM's short "why these values" justification. Already delivered
  // via the outbox envelope; persisted to user_feedback.enriched_rationale
  // by migration 013.
  optional string enriched_rationale = 16;
  optional string language = 17;  // ISO 639-1-ish detected source language
  optional string enriched_display_title = 18;      // tenant-locale console title
  optional string enriched_display_rationale = 19;  // tenant-locale "why these values"
  optional string enriched_display_locale = 20;   // tenant locale used for display
  optional double classification_confidence = 21;  // model self-rated review signal [0,1]
  optional string reply_draft = 22;                 // operator-facing LLM draft (#26); never auto-sent
  optional string reply_draft_generated_at = 23;    // RFC3339; when the draft was last generated
  bool reply_draft_enabled = 24;                    // tenant opt-in; lets the UI tell off / on-but-empty / has-draft apart
  repeated Tag tags = 25;
  optional WorkflowState         workflow_state      = 26;
  repeated WorkflowState         allowed_next_states = 27;
}

message Attachment {
  string url = 1;
  optional string mime = 2;
  optional int64 size = 3;
}

// AttrFilter is one per-dim filter in a console list query. The
// `dim` is a Dimension.Name; `value` is a stable Taxonomy.Value;
// `multi` says whether the dim is multi-kind (needed because the
// SQL containment shape differs).
message AttrFilter {
  string dim = 1;
  string value = 2;
  bool multi = 3;
}

message ListFeedbackRequest {
  optional string cursor = 1;  // last row id; opaque to the client
  optional int32 limit = 2;
  // Per-dim filters, AND-composed via JSONB containment.
  repeated AttrFilter attrs = 3;
  // nil = no filter; true = only urgent; false = only non-urgent.
  optional bool urgent = 4;
  optional string q = 5;  // full-text query
  optional string tag_id = 6;
  optional string workflow_state_id = 7;
  optional string workflow_category = 8;
}

message ListFeedbackResponse {
  repeated Feedback items = 1;
  optional string next_cursor = 2;  // absent when no more pages
}

message GetFeedbackRequest {
  int64 id = 1;  // path param
}

// RegenerateReplyDraftRequest re-runs reply-draft generation for one row (#26).
message RegenerateReplyDraftRequest {
  int64 id = 1;  // path param
}

message RegenerateReplyDraftResponse {
  string reply_draft = 1;
  string reply_draft_generated_at = 2;  // RFC3339
}

message GetFeedbackStatsRequest {}

// ValueCount is one bucket of a per-dim distribution.
message ValueCount {
  string value = 1;
  int64 count = 2;
}

// DimStats is the per-dim top-values distribution for the stats view.
message DimStats {
  string dim = 1;
  repeated ValueCount top = 2;
}

message GetFeedbackStatsResponse {
  string period_start = 1;
  string period_end = 2;
  int64 total = 3;
  // One per-dim distribution for every dim the tenant has configured.
  repeated DimStats dims = 4;
  // Count of is_urgent = true rows within the window.
  int64 urgent_count = 5;
}
