}

message GetFeedbackStatsRequest {}

message GetTerminalFailureWorkbenchRequest {}

message GetFeedbackTriageCommandCenterRequest {}

// ValueCount is one bucket of a per-dim distribution.
message ValueCount {
  string value = 1;
  int64 count = 2;
}

// DimStats is the per-dim top-values distribution for the stats view.
message DimStats {
  string dim = 1;
  repeated ValueCount top = 2;
}

message GetFeedbackStatsResponse {
  string period_start = 1;
  string period_end = 2;
  int64 total = 3;
  // One per-dim distribution for every dim the tenant has configured.
  repeated DimStats dims = 4;
  // Count of is_urgent = true rows within the window.
  int64 urgent_count = 5;
}

message TerminalFailureCluster {
  string key = 1;
  string label = 2;
  int64 count = 3;
  string oldest_created_at = 4;
  string newest_created_at = 5;
  repeated int64 sample_feedback_ids = 6;
  optional string remediation_hint = 7;
}

message GetTerminalFailureWorkbenchResponse {
  string period_start = 1;
  string period_end = 2;
  int64 total_terminal_failures = 3;
  optional string oldest_created_at = 4;
  repeated TerminalFailureCluster reason_class_clusters = 5;
  repeated TerminalFailureCluster model_channel_clusters = 6;
  repeated TerminalFailureCluster config_fingerprint_clusters = 7;
  repeated TerminalFailureCluster age_bucket_clusters = 8;
}

