syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

// ApiKeyService manages a tenant's external ingest API keys (console).
service ApiKeyService {
  // GET /fb/v1/console/api-keys
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (google.api.http) = {get: "/fb/v1/console/api-keys"};
  }
  // POST /fb/v1/console/api-keys — returns the raw secret once.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse) {
    option (google.api.http) = {
      post: "/fb/v1/console/api-keys"
      body: "*"
    };
  }
  // DELETE /fb/v1/console/api-keys/{id} — revoke (204).
  rpc DeleteApiKey(DeleteApiKeyRequest) returns (DeleteApiKeyResponse) {
    option (google.api.http) = {delete: "/fb/v1/console/api-keys/{id}"};
  }
  // GET /fb/v1/console/api-keys/scopes — list available scopes.
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse) {
    option (google.api.http) = {get: "/fb/v1/console/api-keys/scopes"};
  }
  // GET /fb/v1/console/api-keys/presets — list scope preset templates.
  rpc ListScopePresets(ListScopePresetsRequest) returns (ListScopePresetsResponse) {
    option (google.api.http) = {get: "/fb/v1/console/api-keys/presets"};
  }
}

message ApiKey {
  string id = 1;
  string key_prefix = 2;
  string label = 3;
  bool is_active = 4;
  string created_at = 5;             // RFC3339
  optional string last_used_at = 6;  // RFC3339, null if never used
  optional string revoked_at = 7;    // RFC3339, null if active
  repeated string scopes = 8;        // granted scopes
}

message ListApiKeysRequest {}

message ListApiKeysResponse {
  repeated ApiKey items = 1;
}

message CreateApiKeyRequest {
  string label = 1 [(google.api.field_behavior) = REQUIRED];
  repeated string scopes = 2;  // optional, defaults to full_access preset
}

message CreateApiKeyResponse {
  ApiKey key = 1;
  // The raw secret — returned only here, once, at creation.
  string secret = 2;
}

message DeleteApiKeyRequest {
  string id = 1;  // path param (UUID)
}

message DeleteApiKeyResponse {}

// Scope metadata
message ListScopesRequest {}

message ListScopesResponse {
  repeated ScopeInfo scopes = 1;
}

message ScopeInfo {
  string scope = 1;        // e.g., "feedback:read"
  string resource = 2;     // e.g., "feedback"
  string action = 3;       // e.g., "read"
  string description = 4;  // human-readable
  repeated string implies = 5;  // scopes this one implies (hierarchy)
}

// Preset templates
message ListScopePresetsRequest {}

message ListScopePresetsResponse {
  repeated ScopePreset presets = 1;
}

message ScopePreset {
  string id = 1;           // e.g., "ingest_only"
  string name = 2;         // e.g., "Ingest Only"
  string description = 3;  // human-readable
  repeated string scopes = 4;
}
