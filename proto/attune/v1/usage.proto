syntax = "proto3";

package attune.v1;

import "google/api/annotations.proto";

// UsageService serves the console usage dashboard.
service UsageService {
  // GET /fb/v1/console/usage — ingest volume for the current calendar month.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option (google.api.http) = {get: "/fb/v1/console/usage"};
  }

  // GET /fb/v1/console/llm-usage — LLM token and cost usage.
  rpc GetLLMUsage(GetLLMUsageRequest) returns (GetLLMUsageResponse) {
    option (google.api.http) = {get: "/fb/v1/console/llm-usage"};
  }
}

message GetUsageRequest {
  // Reserved for future billing surfaces; currently ignored by the handler.
  string granularity = 1;
  string range = 2;
}

message GetUsageResponse {
  // RFC3339 period bounds (current calendar month, UTC).
  string period_start = 1;
  string period_end = 2;

  // Total ingested rows in the period. (int64 → JSON string.)
  int64 total = 3;

  // Per-day buckets.
  repeated UsageBucket series = 4;

  // Plan quota; absent until billing lands. (int64 → JSON string.)
  optional int64 quota = 5;
}

message UsageBucket {
  // RFC3339 day bucket (UTC).
  string bucket = 1;
  // Rows in the bucket. (int64 → JSON string.)
  int64 value = 2;
}

enum UsageGranularity {
  USAGE_GRANULARITY_UNSPECIFIED = 0;
  USAGE_GRANULARITY_DAY = 1;
  USAGE_GRANULARITY_WEEK = 2;
  USAGE_GRANULARITY_MONTH = 3;
}

message GetLLMUsageRequest {
  // day | week | month. Defaults to week.
  UsageGranularity granularity = 1;
  // Grafana-style from expression: now-7d | now-30d | now-90d | now/M. Defaults to now-30d.
  string range = 2;
}

message GetLLMUsageResponse {
  string period_start = 1;
  string period_end = 2;
  string granularity = 3;
  repeated LLMUsageBucket series = 4;
  int64 prompt_tokens = 5;      // JSON string
  int64 completion_tokens = 6;  // JSON string
  double cost_usd = 7;
  int64 calls = 8;   // JSON string
  int64 errors = 9;  // JSON string
}

message LLMUsageBucket {
  string bucket = 1;  // RFC3339 bucket boundary (UTC)
  string tenant_id = 2;
  string model_id = 3;
  int64 prompt_tokens = 4;      // JSON string
  int64 completion_tokens = 5;  // JSON string
  double cost_usd = 6;
  int64 calls = 7;   // JSON string
  int64 errors = 8;  // JSON string
}
