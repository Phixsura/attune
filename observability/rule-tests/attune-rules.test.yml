rule_files:
  - /etc/prometheus/rules/attune-recording.yml
  - /etc/prometheus/rules/attune-alerts.yml

evaluation_interval: 30s

tests:
  - interval: 30s
    input_series:
      - series: 'attune_ingest_total{tenant="tenant-a",source="api",result="ok"}'
        values: '0+60x40'
      - series: 'attune_ingest_total{tenant="tenant-a",source="api",result="validate_err"}'
        values: '0+3x40'
      - series: 'attune_ingest_rate_limit_total{tenant="tenant-a"}'
        values: '0+6x40'
      - series: 'attune_llm_calls_total{tenant="tenant-a",model="unknown",status="ok"}'
        values: '0+294x40'
      - series: 'attune_llm_calls_total{tenant="tenant-a",model="unknown",status="error"}'
        values: '0+6x40'
      - series: 'attune_outbox_lag_seconds'
        values: '120x40'
      - series: 'attune_outbox_dead_rows'
        values: '3x40'

    alert_rule_test:
      - eval_time: 20m
        alertname: AttuneIngestValidationErrorsHigh
        exp_alerts:
          - exp_labels:
              alertname: AttuneIngestValidationErrorsHigh
              service: attune
              severity: warning
              tenant: tenant-a
            exp_annotations:
              action: Identify the source/result driving validate_err, sample recent rejected payloads, and confirm whether the client contract or source adapter changed.
              dashboard: Attune Overview
              dashboard_url: /d/attune-overview/attune-overview?var-tenant=tenant-a
              description: Tenant tenant-a has validation_error_ratio=4.762% over 5m. Check Attune Overview > Traffic by source/result before changing server code.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestvalidationerrorshigh
              summary: Attune ingest validation errors are above 2%

      - eval_time: 20m
        alertname: AttuneIngestRateLimited
        exp_alerts:
          - exp_labels:
              alertname: AttuneIngestRateLimited
              service: attune
              severity: warning
              tenant: tenant-a
            exp_annotations:
              action: Confirm whether the tenant is bursting legitimately, retrying aggressively, or misconfigured before changing limiter values.
              dashboard: Attune Overview
              dashboard_url: /d/attune-overview/attune-overview?var-tenant=tenant-a
              description: Tenant tenant-a is being rate limited at 200m req/s over 5m. Check Attune Overview > Top tenants by volume.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestratelimited
              summary: Attune ingest is rate limiting sustained traffic

      - eval_time: 20m
        alertname: AttuneLLMProviderErrors
        exp_alerts:
          - exp_labels:
              alertname: AttuneLLMProviderErrors
              model: unknown
              service: attune
              severity: warning
              tenant: tenant-a
            exp_annotations:
              action: Confirm the affected model, provider status, and configured credentials; then compare with enrichment latency before retry policy changes.
              dashboard: Attune LLM Cost
              dashboard_url: /d/attune-llm-cost/attune-llm-cost?var-tenant=tenant-a&var-model=unknown
              description: Tenant tenant-a model unknown has provider error ratio 2% over 5m. Check Attune LLM Cost > Error calls by model.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunellmprovidererrors
              summary: Attune LLM provider error ratio is above 1%

      - eval_time: 20m
        alertname: AttuneOutboxLagHigh
        exp_alerts:
          - exp_labels:
              alertname: AttuneOutboxLagHigh
              service: attune
              severity: warning
            exp_annotations:
              action: Compare outbox lag with notification failures and claim contention to decide whether this is destination failure or worker capacity.
              dashboard: Attune Operations
              dashboard_url: /d/attune-operations/attune-operations
              description: Oldest pending delivery is 2m 0s. Check Attune Operations > Delivery and contention.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxlaghigh
              summary: Attune outbox lag is above 60s

      - eval_time: 20m
        alertname: AttuneOutboxDeadRowsHigh
        exp_alerts:
          - exp_labels:
              alertname: AttuneOutboxDeadRowsHigh
              service: attune
              severity: warning
            exp_annotations:
              action: Open Console > Dead deliveries, inspect destination_type and last_error, fix or remove the target, then manually retry.
              dashboard: Attune Operations
              dashboard_url: /d/attune-operations/attune-operations
              description: 3 outbox delivery(s) are in the terminal 'dead' state. A webhook may be deleted/misconfigured (e.g. a removed Discord/Slack channel webhook).
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeadrowshigh
              summary: Attune has deliveries stuck in the dead queue

  - interval: 30s
    input_series:
      - series: 'attune_ingest_total{tenant="tenant-a",source="api",result="ok"}'
        values: '0+98x40'
      - series: 'attune_ingest_total{tenant="tenant-a",source="api",result="internal_err"}'
        values: '0+2x40'
      - series: 'attune_enrich_duration_seconds_bucket{tenant="tenant-a",dims_mode="freeform",result="ok",le="5"}'
        values: '0+20x40'
      - series: 'attune_enrich_duration_seconds_count{tenant="tenant-a",dims_mode="freeform",result="ok"}'
        values: '0+100x40'
      - series: 'attune_outbound_delivery_attempts_total{destination_type="slack",result="terminal",status="500"}'
        values: '0+3x40'
      - series: 'attune_outbound_delivery_attempts_total{destination_type="slack",result="success",status="200"}'
        values: '0+97x40'
      - series: 'attune_mcp_tool_calls_total{tenant="tenant-a",tool="list_feedback",result="ok"}'
        values: '0+97x40'
      - series: 'attune_mcp_tool_calls_total{tenant="tenant-a",tool="list_feedback",result="internal_error"}'
        values: '0+3x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="started"}'
        values: '0+100x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="completed"}'
        values: '0+97x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="failed"}'
        values: '0+3x40'
      - series: 'attune_oidc_login_total{result="success"}'
        values: '0+97x40'
      - series: 'attune_oidc_login_total{result="idp_error"}'
        values: '0+3x40'
      - series: 'attune_apikey_usage_total{tenant="tenant-a",key_prefix="fbk_live_abc"}'
        values: '0+10x40'
      - series: 'attune_apikey_expired_total'
        values: '0+10x40'
      - series: 'attune_apikey_ip_denied_total'
        values: '0+10x40'
      - series: 'attune_apikey_rate_limited_total{tenant="tenant-a"}'
        values: '0+10x40'

    alert_rule_test:
      - eval_time: 20m
        alertname: AttuneIngestServiceFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneIngestServiceFastBurn
              service: attune
              severity: critical
              slo: ingest_service
              tenant: tenant-a
            exp_annotations:
              action: Inspect ingest internal errors by tenant and source/result, then confirm whether the root cause is a code regression, bad client payloads, or an upstream dependency failure.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a
              description: Tenant tenant-a is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Burn trend.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestservicefastburn
              summary: Attune ingest service is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneIngestServiceSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneIngestServiceSlowBurn
              service: attune
              severity: warning
              slo: ingest_service
              tenant: tenant-a
            exp_annotations:
              action: Check whether the ingest regression is sustained, compare against recent deploys, and verify if rate-limit pressure or validation noise is masking a real backend failure.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a
              description: Tenant tenant-a is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Burn trend.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestserviceslowburn
              summary: Attune ingest service is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneEnrichmentFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneEnrichmentFastBurn
              service: attune
              severity: critical
              slo: enrichment_latency
              tenant: tenant-a
            exp_annotations:
              action: Split enrichment latency by dims_mode and result, then confirm whether the issue is provider latency, queue pressure, or a parser / prompt regression.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a
              description: Tenant tenant-a is above the 14.4x fast-burn threshold on both 5m and 1h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentfastburn
              summary: Attune enrichment latency is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneEnrichmentSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneEnrichmentSlowBurn
              service: attune
              severity: warning
              slo: enrichment_latency
              tenant: tenant-a
            exp_annotations:
              action: Compare with AI queue depth and provider errors. If latency is elevated but failures are not, the system may be saturating rather than failing.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a
              description: Tenant tenant-a is above the 6x slow-burn threshold on both 30m and 6h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentslowburn
              summary: Attune enrichment latency is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneOutboxDeliveryFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneOutboxDeliveryFastBurn
              destination_type: slack
              service: attune
              severity: critical
              slo: outbox_delivery
            exp_annotations:
              action: Inspect terminal delivery failures, then compare outbox lag and notify failures to decide whether the destination or worker capacity is the limiting factor.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-destination_type=slack
              description: Destination type slack is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Delivery pressure.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryfastburn
              summary: Attune outbox delivery is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneOutboxDeliverySlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneOutboxDeliverySlowBurn
              destination_type: slack
              service: attune
              severity: warning
              slo: outbox_delivery
            exp_annotations:
              action: Check provider rejection patterns, retry pressure, and whether the worker pool is keeping up with the queue.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-destination_type=slack
              description: Destination type slack is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Delivery pressure.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryslowburn
              summary: Attune outbox delivery is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneOIDCLoginFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneOIDCLoginFastBurn
              service: attune
              severity: critical
              slo: oidc_login
            exp_annotations:
              action: Check the failing login outcomes, IdP status, callback errors, and recent auth or cookie changes before changing SSO configuration.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact
              description: OIDC login failures are above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Auth pressure.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoidcloginfastburn
              summary: Attune OIDC login is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneOIDCLoginSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneOIDCLoginSlowBurn
              service: attune
              severity: warning
              slo: oidc_login
            exp_annotations:
              action: Compare against IdP health, login callback errors, and recent auth configuration changes. If the failure set is mixed, split by result before changing any global setting.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact
              description: OIDC login failures are above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Auth pressure.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoidcloginslowburn
              summary: Attune OIDC login is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneAPIKeyAccessFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneAPIKeyAccessFastBurn
              service: attune
              severity: critical
              slo: apikey_access
            exp_annotations:
              action: Check whether keys are expiring together, a hot key is being throttled, or an allowlist change is rejecting traffic; then split Security & Compliance by denial class.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact
              description: API key access denials are above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Deep dive.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneapikeyaccessfastburn
              summary: Attune API key access is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneAPIKeyAccessSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneAPIKeyAccessSlowBurn
              service: attune
              severity: warning
              slo: apikey_access
            exp_annotations:
              action: Split expiration, IP-denied, and rate-limited requests, then confirm whether this is a rollout issue, hot key, or client misuse pattern.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact
              description: API key access denials are above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Deep dive.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneapikeyaccessslowburn
              summary: Attune API key access is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneMCPToolFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneMCPToolFastBurn
              service: attune
              severity: critical
              slo: mcp_tool
              tenant: tenant-a
              tool: list_feedback
            exp_annotations:
              action: Check whether the tool itself is failing, the adapter returned bad input, or the MCP policy layer is blocking allowed calls.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-tool=list_feedback
              description: Tenant tenant-a tool list_feedback is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > MCP.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemcptoolfastburn
              summary: Attune MCP tool reliability is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneMCPToolSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneMCPToolSlowBurn
              service: attune
              severity: warning
              slo: mcp_tool
              tenant: tenant-a
              tool: list_feedback
            exp_annotations:
              action: Split the tool mix by result, then confirm whether the issue is a tool regression, policy denial, or an upstream dependency failure.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-tool=list_feedback
              description: Tenant tenant-a tool list_feedback is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > MCP.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemcptoolslowburn
              summary: Attune MCP tool reliability is consuming budget too fast

      - eval_time: 20m
        alertname: AttuneGDPRJobFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneGDPRJobFastBurn
              request_type: export
              service: attune
              severity: critical
              slo: gdpr_job
              tenant: tenant-a
            exp_annotations:
              action: Check whether the queue is stalled, the worker is failing, or the storage path is rejecting completion.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-request_type=export
              description: Tenant tenant-a request type export is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > GDPR.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobfastburn
              summary: Attune GDPR job completion is burning error budget quickly

      - eval_time: 20m
        alertname: AttuneGDPRJobSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneGDPRJobSlowBurn
              request_type: export
              service: attune
              severity: warning
              slo: gdpr_job
              tenant: tenant-a
            exp_annotations:
              action: Compare started vs completed jobs, inspect the worker queue, and verify whether cancellations or revocations are masking a backlog.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-request_type=export
              description: Tenant tenant-a request type export is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > GDPR.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobslowburn
              summary: Attune GDPR job completion is consuming budget too fast

  - interval: 30s
    input_series:
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="started"}'
        values: '0+100x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="completed"}'
        values: '0+95x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="cancelled"}'
        values: '0+5x40'

    alert_rule_test:
      - eval_time: 20m
        alertname: AttuneGDPRJobFastBurn
        exp_alerts: []

      - eval_time: 20m
        alertname: AttuneGDPRJobSlowBurn
        exp_alerts: []

  # No cancellation or revocation series: the safe denominator must still
  # resolve to the started jobs so the burn alerts still fire.
  - interval: 30s
    input_series:
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="started"}'
        values: '0+100x40'
      - series: 'attune_gdpr_job_total{tenant="tenant-a",request_type="export",result="completed"}'
        values: '0+95x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: AttuneGDPRJobFastBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneGDPRJobFastBurn
              request_type: export
              service: attune
              severity: critical
              slo: gdpr_job
              tenant: tenant-a
            exp_annotations:
              action: Check whether the queue is stalled, the worker is failing, or the storage path is rejecting completion.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-request_type=export
              description: Tenant tenant-a request type export is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > GDPR.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobfastburn
              summary: Attune GDPR job completion is burning error budget quickly
      - eval_time: 20m
        alertname: AttuneGDPRJobSlowBurn
        exp_alerts:
          - exp_labels:
              alertname: AttuneGDPRJobSlowBurn
              request_type: export
              service: attune
              severity: warning
              slo: gdpr_job
              tenant: tenant-a
            exp_annotations:
              action: Compare started vs completed jobs, inspect the worker queue, and verify whether cancellations or revocations are masking a backlog.
              dashboard: Attune Tenant Impact
              dashboard_url: /d/attune-tenant-impact/attune-tenant-impact?var-tenant=tenant-a&var-request_type=export
              description: Tenant tenant-a request type export is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > GDPR.
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobslowburn
              summary: Attune GDPR job completion is consuming budget too fast

  # Restore-drill staleness — the only alert that makes a lapsed drill visible.
  # 5m series interval keeps the gauge fresh (under the lookback) so `for: 1h`
  # accumulates; a last success older than 8d fires after the 1h pending window.
  - interval: 5m
    input_series:
      - series: 'attune_restore_drill_last_success_timestamp_seconds'
        values: '100x2520' # last success at epoch 100, held ~8.75 days
    alert_rule_test:
      - eval_time: 10h # time()-100 well under 8d → quiet
        alertname: AttuneRestoreDrillStale
        exp_alerts: []
      - eval_time: 200h # > 8d since last success, pending 1h satisfied → fires
        alertname: AttuneRestoreDrillStale
        exp_alerts:
          - exp_labels:
              alertname: AttuneRestoreDrillStale
              service: attune
              severity: warning
            exp_annotations:
              summary: No successful restore drill in over 8 days
              description: The most recent passing backup/restore drill is more than 8 days old. Recoverability of the latest backup is unverified.
              dashboard: Attune Operations
              dashboard_url: /d/attune-operations/attune-operations
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunerestoredrillstale
              action: Run 'attune restore-drill run --target <restored-db-url> --record', or check the restore-drill CronJob (restoreDrill.enabled). See docs/private-deploy.md.

  # Never-run: the > 0 guard suppresses the alert (the preflight check warns instead).
  - interval: 5m
    input_series:
      - series: 'attune_restore_drill_last_success_timestamp_seconds'
        values: '0x2520'
    alert_rule_test:
      - eval_time: 200h
        alertname: AttuneRestoreDrillStale
        exp_alerts: []

  # Anomaly worker lag (#237): 3-day-old settled bucket fires after the 1h
  # pending window; a fresh worker (lag under 2d) stays quiet.
  - interval: 5m
    input_series:
      - series: 'attune_anomaly_worker_lag_seconds{tenant="tenant-a"}'
        values: '259200x40' # 3 days, held
    alert_rule_test:
      - eval_time: 30m # pending (for: 1h) not yet satisfied
        alertname: AttuneAnomalyWorkerLagHigh
        exp_alerts: []
      - eval_time: 90m
        alertname: AttuneAnomalyWorkerLagHigh
        exp_alerts:
          - exp_labels:
              alertname: AttuneAnomalyWorkerLagHigh
              service: attune
              severity: warning
            exp_annotations:
              summary: Anomaly detection is more than 2 days behind
              description: The oldest settled, unjudged anomaly bucket is 3d 0h 0m 0s old. Spikes and drops in that window are going unreported.
              dashboard: Attune AI Pipeline
              dashboard_url: /d/attune-ai-pipeline/attune-ai-pipeline
              runbook_url: https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneanomalyworkerlaghigh
              action: Check the anomaly worker is running (worker=anomaly in heartbeat/panic metrics), then look for failed detection runs in anomaly_detection_runs (status='failed') and slow rollups on the AI Pipeline dashboard.

  - interval: 5m
    input_series:
      - series: 'attune_anomaly_worker_lag_seconds{tenant="tenant-a"}'
        values: '3600x40' # 1h lag: healthy
    alert_rule_test:
      - eval_time: 90m
        alertname: AttuneAnomalyWorkerLagHigh
        exp_alerts: []

  # Anomaly notify failures (#237): sustained failures fire after 15m.
  - interval: 1m
    input_series:
      - series: 'attune_anomaly_notify_failures_total{tenant="tenant-a"}'
        values: '0+1x40' # one failure per minute
