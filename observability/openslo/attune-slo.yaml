apiVersion: "openslo/v1"
kind: "DataSource"
metadata:
  name: "attune-prometheus"
  displayName: "Attune Prometheus"
spec:
  description: "Prometheus metrics source for the generated Attune OpenSLO bundle."
  type: "Prometheus"
---
apiVersion: "openslo/v1"
kind: "Service"
metadata:
  name: "attune"
  displayName: "Attune"
spec:
  description: "Service-owned SLOs and burn-rate policies generated from the reliability catalog."
---
apiVersion: "openslo/v1"
kind: "AlertNotificationTarget"
metadata:
  name: "attune-alertmanager"
  displayName: "Attune Alertmanager"
spec:
  description: "Alertmanager sink for generated Attune SLO burn-rate policies."
  target: "alertmanager"
---
apiVersion: "openslo/v1"
kind: "SLO"
metadata:
  name: "attune-ingest-service"
  displayName: "Ingest burn x"
  annotations:
    attune.io/catalog-key: "ingest_service"
    attune.io/owner: "Ingest"
    attune.io/escalation: "Ingest on-call"
    attune.io/scope: "tenant"
    attune.io/alert-label: "ingest_service"
    attune.io/burn-kind: "error"
    attune.io/recorded-ratio-base: "attune:ingest_service_failure_ratio"
    attune.io/trend-legend-base: "ingest"
    attune.io/include-in-tenant-rank: "true"
    attune.io/dashboard-title: "Attune Tenant Impact"
    attune.io/budget-exception-policy: "Maintenance windows only"
    attune.io/budget-exception-note: "Use only for approved deploy or maintenance windows; validation failures and rate-limit pressure stay in burn."
    attune.io/policy-summary: "Start at 99.9% objective; page at 14.4x on 5m and 1h; warn at 6x on 30m and 6h; keep traffic floor > 0.01."
    attune.io/policy-note: "Keep validation failures diagnostic and fold rate-limit pressure into the service-owned failure ratio."
    attune.io/tenant-rank-legend-base: "ingest"
spec:
  description: "Fast burn multiplier for ingest internal errors and rate-limit pressure. 1x means the budget is being consumed at the planned rate; 14.4x is the classic 30d fast-burn page threshold."
  service: "attune"
  indicator:
    metadata:
      name: "attune-ingest-service-sli"
      displayName: "Ingest burn x SLI"
    spec:
      ratioMetric:
        counter: false
        rawType: "failure"
        raw:
          metricSource:
            metricSourceRef: "attune-prometheus"
            type: "Prometheus"
            spec:
              query: "attune:ingest_service_failure_ratio:ratio5m"
  timeWindow:
    - duration: "30d"
      isRolling: true
  budgetingMethod: "RatioTimeslices"
  objectives:
    - displayName: "Ingest burn x objective"
      target: 0.999
  alertPolicies:
    - alertPolicyRef: "attune-ingest-service-fast-burn-policy"
    - alertPolicyRef: "attune-ingest-service-slow-burn-policy"
---
apiVersion: "openslo/v1"
kind: "AlertCondition"
metadata:
  name: "attune-ingest-service-fast-burn"
  displayName: "Ingest burn x fast burn"
  annotations:
    attune.io/catalog-key: "ingest_service"
    attune.io/owner: "Ingest"
    attune.io/escalation: "Ingest on-call"
    attune.io/scope: "tenant"
    attune.io/alert-label: "ingest_service"
    attune.io/burn-kind: "error"
    attune.io/recorded-ratio-base: "attune:ingest_service_failure_ratio"
    attune.io/trend-legend-base: "ingest"
    attune.io/include-in-tenant-rank: "true"
    attune.io/dashboard-title: "Attune Tenant Impact"
    attune.io/budget-exception-policy: "Maintenance windows only"
    attune.io/budget-exception-note: "Use only for approved deploy or maintenance windows; validation failures and rate-limit pressure stay in burn."
    attune.io/policy-summary: "Start at 99.9% objective; page at 14.4x on 5m and 1h; warn at 6x on 30m and 6h; keep traffic floor > 0.01."
    attune.io/policy-note: "Keep validation failures diagnostic and fold rate-limit pressure into the service-owned failure ratio."
    attune.io/tenant-rank-legend-base: "ingest"
    attune.io/burn-phase: "fast"
    attune.io/alert-name: "AttuneIngestServiceFastBurn"
    attune.io/dashboard-url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
    attune.io/runbook-url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestservicefastburn"
    attune.io/action: "Inspect ingest internal errors and rate-limit pressure by tenant and source/result, then confirm whether the root cause is a code regression, hot tenant, bad client payloads, or an upstream dependency failure."
    attune.io/traffic-guard: "sum by (tenant) (attune:ingest_requests:rate5m)\n  + (\n    attune:ingest_rate_limit:rate5m\n    or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)\n  ) > 0.01"
    attune.io/promql: "(\n  (attune:ingest_service_failure_ratio:ratio5m) / 0.001 > 14.4\n)\nand\n(\n  (attune:ingest_service_failure_ratio:ratio1h) / 0.001 > 14.4\n)\nand\n(\n  sum by (tenant) (attune:ingest_requests:rate5m)\n  + (\n    attune:ingest_rate_limit:rate5m\n    or on(tenant) (sum by (tenant) (attune:ingest_requests:rate5m) * 0)\n  ) > 0.01\n)"
spec:
  description: "Ingest burn x exceeds the 14.4x fast-burn threshold over 5m and 1h windows."
  severity: "page"
  condition:
    kind: "burnrate"
    op: "gt"
    threshold: 14.4
    lookbackWindow: "5m"
    alertAfter: "2m"
---
