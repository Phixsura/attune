    attune.io/promql: "(\n  (1 - attune:gdpr_job_completion_ratio:ratio30m) / 0.001 > 6\n)\nand\n(\n  (1 - attune:gdpr_job_completion_ratio:ratio6h) / 0.001 > 6\n)\nand\n(\n  sum by (tenant, request_type) (rate(attune_gdpr_job_total{result=\"started\"}[5m])) > 0.01\n)"
spec:
  description: "GDPR burn x exceeds the 6x slow-burn threshold over 30m and 6h windows."
  severity: "warning"
  condition:
    kind: "burnrate"
    op: "gt"
    threshold: 6
    lookbackWindow: "30m"
    alertAfter: "5m"
