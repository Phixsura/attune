groups:
  - name: attune.alerts.ingest
    rules:
      - alert: AttuneIngestValidationErrorsHigh
        expr: attune:ingest_validation_error_ratio:ratio5m > 0.02
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune ingest validation errors are above 2%"
          description: "Tenant {{ $labels.tenant }} has validation_error_ratio={{ $value | humanizePercentage }} over 5m. Check Attune Overview > Traffic by source/result before changing server code."
          dashboard: "Attune Overview"
          dashboard_url: "/d/attune-overview/attune-overview?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestvalidationerrorshigh"
          action: "Identify the source/result driving validate_err, sample recent rejected payloads, and confirm whether the client contract or source adapter changed."

      - alert: AttuneIngestRateLimited
        expr: attune:ingest_rate_limit:rate5m > 0.1
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune ingest is rate limiting sustained traffic"
          description: "Tenant {{ $labels.tenant }} is being rate limited at {{ $value | humanize }} req/s over 5m. Check Attune Overview > Top tenants by volume."
          dashboard: "Attune Overview"
          dashboard_url: "/d/attune-overview/attune-overview?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestratelimited"
          action: "Confirm whether the tenant is bursting legitimately, retrying aggressively, or misconfigured before changing limiter values."

  - name: attune.alerts.inbound
    rules:
      - alert: AttuneInboundAvailabilityLow
        expr: attune:inbound_availability:ratio5m < 0.99
        for: 10m
        labels:
          severity: critical
          service: attune
        annotations:
          summary: "Attune inbound availability is below 99%"
          description: "Tenant {{ $labels.tenant }} channel {{ $labels.channel }} has inbound availability {{ $value | humanizePercentage }} over 5m. Check Attune Inbound > Events by channel/result."
          dashboard: "Attune Inbound"
          dashboard_url: "/d/attune-inbound/attune-inbound?var-tenant={{ $labels.tenant }}&var-channel={{ $labels.channel }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneinboundavailabilitylow"
          action: "Split errors by source_slug/result, then verify source credentials, upstream API status, and payload shape."

      - alert: AttuneInboundLatencyHigh
        expr: attune:inbound_p95_seconds:5m > 2
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune inbound p95 latency is above 2s"
          description: "Tenant {{ $labels.tenant }} channel {{ $labels.channel }} has inbound p95={{ $value | humanizeDuration }} over 5m. Check Attune Inbound > Inbound latency."
          dashboard: "Attune Inbound"
          dashboard_url: "/d/attune-inbound/attune-inbound?var-tenant={{ $labels.tenant }}&var-channel={{ $labels.channel }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneinboundlatencyhigh"
          action: "Compare latency with event rate and source attribution; if traffic is flat, inspect adapter or upstream source latency."

      - alert: AttuneInboundSourcesStale
        expr: attune:inbound_stale_sources:count > 0
        for: 15m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune inbound poll sources are stale"
          description: "Tenant {{ $labels.tenant }} channel {{ $labels.channel }} has {{ $value | humanize }} stale poll sources. Check Attune Inbound > Poll lag by source."
          dashboard: "Attune Inbound"
          dashboard_url: "/d/attune-inbound/attune-inbound?var-tenant={{ $labels.tenant }}&var-channel={{ $labels.channel }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneinboundsourcesstale"
          action: "Open Poll lag by source, identify stale source_slug values, and verify worker scheduling plus upstream credentials."

  - name: attune.alerts.ai
    rules:
      - alert: AttuneEnrichmentLatencyHigh
        expr: attune:enrich_p95_seconds:5m > 5
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune enrichment p95 is above 5s"
          description: "Tenant {{ $labels.tenant }} has enrichment p95={{ $value | humanizeDuration }} over 5m. Check Attune AI Pipeline > Enrich duration and LLM Cost > Provider errors."
          dashboard: "Attune AI Pipeline"
          dashboard_url: "/d/attune-ai-pipeline/attune-ai-pipeline?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentlatencyhigh"
          action: "Compare triage mix, AI queue depth, and LLM provider errors to separate load, worker backlog, and provider latency."

      - alert: AttuneAIQueueBacklog
        expr: attune:ai_queue_depth:sum > 10
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune AI queues are backing up"
          description: "Tenant {{ $labels.tenant }} has combined AI queue depth {{ $value | humanize }}. Check Attune AI Pipeline > Downstream AI jobs."
          dashboard: "Attune AI Pipeline"
          dashboard_url: "/d/attune-ai-pipeline/attune-ai-pipeline?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneaiqueuebacklog"
          action: "Check embedding and reply-draft queues separately, then confirm worker health before increasing concurrency."

      - alert: AttuneLLMProviderErrors
        expr: attune:llm_provider_error_ratio:ratio5m > 0.01
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune LLM provider error ratio is above 1%"
          description: "Tenant {{ $labels.tenant }} model {{ $labels.model }} has provider error ratio {{ $value | humanizePercentage }} over 5m. Check Attune LLM Cost > Error calls by model."
          dashboard: "Attune LLM Cost"
          dashboard_url: "/d/attune-llm-cost/attune-llm-cost?var-tenant={{ $labels.tenant }}&var-model={{ $labels.model }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunellmprovidererrors"
          action: "Confirm the affected model, provider status, and configured credentials; then compare with enrichment latency before retry policy changes."

      - alert: AttuneEnrichmentTerminalFailures
        # No `for`: the 5m increase window is itself the debounce. Stacking `for`
        # on a windowed increase delays paging and can miss a lone failure that
        # ages out of the window before `for` elapses.
        expr: sum by (tenant) (increase(attune_enrichment_terminal_failures_total[5m])) > 0
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune feedback rows are exhausting enrichment retries"
          description: "Tenant {{ $labels.tenant }} had {{ $value | humanize }} feedback rows stop in 'failed' after exhausting retries over 5m. Check Attune AI Pipeline > Enrich duration."
          dashboard: "Attune AI Pipeline"
          dashboard_url: "/d/attune-ai-pipeline/attune-ai-pipeline?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentterminalfailures"
          action: "Sample the stranded rows' enrichment_error, confirm whether a provider, prompt, or parse bug is the cause, then remediate and re-enqueue."

      - alert: AttuneWorkerPanics
        expr: sum by (worker) (increase(attune_worker_panics_total[10m])) > 0
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune background worker is panicking"
          description: "Worker {{ $labels.worker }} recovered {{ $value | humanize }} panic(s) over 10m. The supervisor restarts it, but a sustained panic→restart loop silently degrades that subsystem."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneworkerpanics"
          action: "Find the panicking worker in logs (grep the worker label for the recovered-panic stack), fix the underlying bug; a tight loop means a poison input or a persistent nil-deref."

      - alert: AttuneWorkerHeartbeatLost
        expr: sum by (worker) (increase(attune_worker_heartbeat_total{outcome="lost"}[10m])) > 5
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune worker losing task leases"
          description: "Worker {{ $labels.worker }} lost {{ $value | humanize }} task leases over 10m. This indicates tasks are being re-claimed by other workers before completion."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneworkerheartbeatlost"
          action: "Check if task processing time exceeds the stale claim threshold (5m). Consider increasing heartbeat frequency or reducing task complexity."

      - alert: AttuneWorkerDrainTimeout
        expr: sum by (worker) (increase(attune_worker_drain_total{outcome="timeout"}[30m])) > 0
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune worker shutdown drain timeout"
          description: "Worker {{ $labels.worker }} timed out during graceful shutdown drain. In-flight tasks may have been abandoned mid-processing."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneworkerdraintimeout"
          action: "Check for stuck tasks in the queue tables. Consider increasing drain timeout or investigating why tasks are taking too long."

      - alert: AttuneWorkerStaleClaimsHigh
        expr: sum by (worker) (increase(attune_worker_stale_claims_recovered_total[1h])) > 10
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "High stale claim recovery rate"
          description: "Worker {{ $labels.worker }} recovered {{ $value | humanize }} stale claims in 1h. This indicates workers are crashing or not completing heartbeats."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneworkerstaleclaimshigh"
          action: "Check worker logs for crashes or OOM kills. Verify heartbeat goroutines are running and database connectivity is stable."

  - name: attune.alerts.slo
    rules:
      - alert: AttuneIngestServiceFastBurn
        expr: |
          (
            attune:ingest_service_failure_ratio:ratio5m / 0.001 > 14.4
          )
          and
          (
            attune:ingest_service_failure_ratio:ratio1h / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: ingest_service
        annotations:
          summary: "Attune ingest service is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Burn trend."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestservicefastburn"
          action: "Inspect ingest internal errors by tenant and source/result, then confirm whether the root cause is a code regression, bad client payloads, or an upstream dependency failure."

      - alert: AttuneIngestServiceSlowBurn
        expr: |
          (
            attune:ingest_service_failure_ratio:ratio30m / 0.001 > 6
          )
          and
          (
            attune:ingest_service_failure_ratio:ratio6h / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: ingest_service
        annotations:
          summary: "Attune ingest service is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Burn trend."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneingestserviceslowburn"
          action: "Check whether the ingest regression is sustained, compare against recent deploys, and verify if rate-limit pressure or validation noise is masking a real backend failure."

      - alert: AttuneEnrichmentFastBurn
        expr: |
          (
            (1 - attune:enrich_success_under_5s:ratio5m) / 0.05 > 14.4
          )
          and
          (
            (1 - attune:enrich_success_under_5s:ratio1h) / 0.05 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: enrichment_latency
        annotations:
          summary: "Attune enrichment latency is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} is above the 14.4x fast-burn threshold on both 5m and 1h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentfastburn"
          action: "Split enrichment latency by dims_mode and result, then confirm whether the issue is provider latency, queue pressure, or a parser / prompt regression."

      - alert: AttuneEnrichmentSlowBurn
        expr: |
          (
            (1 - attune:enrich_success_under_5s:ratio30m) / 0.05 > 6
          )
          and
          (
            (1 - attune:enrich_success_under_5s:ratio6h) / 0.05 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: enrichment_latency
        annotations:
          summary: "Attune enrichment latency is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} is above the 6x slow-burn threshold on both 30m and 6h windows for the 5s enrichment latency SLO. Open Attune Tenant Impact > Burn trend."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneenrichmentslowburn"
          action: "Compare with AI queue depth and provider errors. If latency is elevated but failures are not, the system may be saturating rather than failing."

      - alert: AttuneOutboxDeliveryFastBurn
        expr: |
          (
            attune:outbox_delivery_failure_ratio:ratio5m / 0.001 > 14.4
          )
          and
          (
            attune:outbox_delivery_failure_ratio:ratio1h / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: outbox_delivery
        annotations:
          summary: "Attune outbox delivery is burning error budget quickly"
          description: "Destination type {{ $labels.destination_type }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Delivery pressure."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-destination_type={{ $labels.destination_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryfastburn"
          action: "Inspect terminal delivery failures, then compare outbox lag and notify failures to decide whether the destination or worker capacity is the limiting factor."

      - alert: AttuneOutboxDeliverySlowBurn
        expr: |
          (
            attune:outbox_delivery_failure_ratio:ratio30m / 0.001 > 6
          )
          and
          (
            attune:outbox_delivery_failure_ratio:ratio6h / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: outbox_delivery
        annotations:
          summary: "Attune outbox delivery is consuming budget too fast"
          description: "Destination type {{ $labels.destination_type }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Delivery pressure."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-destination_type={{ $labels.destination_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeliveryslowburn"
          action: "Check provider rejection patterns, retry pressure, and whether the worker pool is keeping up with the queue."

      - alert: AttuneOIDCLoginFastBurn
        expr: |
          (
            attune:oidc_login_failure_ratio:ratio5m / 0.001 > 14.4
          )
          and
          (
            attune:oidc_login_failure_ratio:ratio1h / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: oidc_login
        annotations:
          summary: "Attune OIDC login is burning error budget quickly"
          description: "OIDC login failures are above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Auth pressure."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoidcloginfastburn"
          action: "Check the failing login outcomes, IdP status, callback errors, and recent auth or cookie changes before changing SSO configuration."

      - alert: AttuneOIDCLoginSlowBurn
        expr: |
          (
            attune:oidc_login_failure_ratio:ratio30m / 0.001 > 6
          )
          and
          (
            attune:oidc_login_failure_ratio:ratio6h / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: oidc_login
        annotations:
          summary: "Attune OIDC login is consuming budget too fast"
          description: "OIDC login failures are above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Auth pressure."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoidcloginslowburn"
          action: "Compare against IdP health, login callback errors, and recent auth configuration changes. If the failure set is mixed, split by result before changing any global setting."

      - alert: AttuneAPIKeyAccessFastBurn
        expr: |
          (
            attune:apikey_access_denial_ratio:ratio5m / 0.05 > 14.4
          )
          and
          (
            attune:apikey_access_denial_ratio:ratio1h / 0.05 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: apikey_access
        annotations:
          summary: "Attune API key access is burning error budget quickly"
          description: "API key access denials are above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > Deep dive."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneapikeyaccessfastburn"
          action: "Check whether keys are expiring together, a hot key is being throttled, or an allowlist change is rejecting traffic; then split Security & Compliance by denial class."

      - alert: AttuneAPIKeyAccessSlowBurn
        expr: |
          (
            attune:apikey_access_denial_ratio:ratio30m / 0.05 > 6
          )
          and
          (
            attune:apikey_access_denial_ratio:ratio6h / 0.05 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: apikey_access
        annotations:
          summary: "Attune API key access is consuming budget too fast"
          description: "API key access denials are above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > Deep dive."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneapikeyaccessslowburn"
          action: "Split expiration, IP-denied, and rate-limited requests, then confirm whether this is a rollout issue, hot key, or client misuse pattern."

      - alert: AttuneMCPToolFastBurn
        expr: |
          (
            attune:mcp_tool_error_ratio:ratio5m / 0.001 > 14.4
          )
          and
          (
            attune:mcp_tool_error_ratio:ratio1h / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: mcp_tool
        annotations:
          summary: "Attune MCP tool reliability is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} tool {{ $labels.tool }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > MCP."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}&var-tool={{ $labels.tool }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemcptoolfastburn"
          action: "Check whether the tool itself is failing, the adapter returned bad input, or the MCP policy layer is blocking allowed calls."

      - alert: AttuneMCPToolSlowBurn
        expr: |
          (
            attune:mcp_tool_error_ratio:ratio30m / 0.001 > 6
          )
          and
          (
            attune:mcp_tool_error_ratio:ratio6h / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: mcp_tool
        annotations:
          summary: "Attune MCP tool reliability is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} tool {{ $labels.tool }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > MCP."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}&var-tool={{ $labels.tool }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemcptoolslowburn"
          action: "Split the tool mix by result, then confirm whether the issue is a tool regression, policy denial, or an upstream dependency failure."

      - alert: AttuneGDPRJobFastBurn
        expr: |
          (
            (1 - attune:gdpr_job_completion_ratio:ratio5m) / 0.001 > 14.4
          )
          and
          (
            (1 - attune:gdpr_job_completion_ratio:ratio1h) / 0.001 > 14.4
          )
        for: 2m
        labels:
          severity: critical
          service: attune
          slo: gdpr_job
        annotations:
          summary: "Attune GDPR job completion is burning error budget quickly"
          description: "Tenant {{ $labels.tenant }} request type {{ $labels.request_type }} is above the 14.4x fast-burn threshold on both 5m and 1h windows. Open Attune Tenant Impact > GDPR."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}&var-request_type={{ $labels.request_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobfastburn"
          action: "Check whether the queue is stalled, the worker is failing, or the storage path is rejecting completion."

      - alert: AttuneGDPRJobSlowBurn
        expr: |
          (
            (1 - attune:gdpr_job_completion_ratio:ratio30m) / 0.001 > 6
          )
          and
          (
            (1 - attune:gdpr_job_completion_ratio:ratio6h) / 0.001 > 6
          )
        for: 5m
        labels:
          severity: warning
          service: attune
          slo: gdpr_job
        annotations:
          summary: "Attune GDPR job completion is consuming budget too fast"
          description: "Tenant {{ $labels.tenant }} request type {{ $labels.request_type }} is above the 6x slow-burn threshold on both 30m and 6h windows. Open Attune Tenant Impact > GDPR."
          dashboard: "Attune Tenant Impact"
          dashboard_url: "/d/attune-tenant-impact/attune-tenant-impact?var-tenant={{ $labels.tenant }}&var-request_type={{ $labels.request_type }}"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunegdprjobslowburn"
          action: "Compare started vs completed jobs, inspect the worker queue, and verify whether cancellations or revocations are masking a backlog."

  - name: attune.alerts.operations
    rules:
      - alert: AttuneOutboxLagHigh
        expr: attune:outbox_lag_seconds:max > 60
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune outbox lag is above 60s"
          description: "Oldest pending delivery is {{ $value | humanizeDuration }}. Check Attune Operations > Delivery and contention."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxlaghigh"
          action: "Compare outbox lag with notification failures and claim contention to decide whether this is destination failure or worker capacity."

      - alert: AttuneNotifyFailures
        expr: sum(attune:notify_failures:rate5m) > 0
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune notification delivery failures are occurring"
          description: "Notification failures are non-zero over 5m. Check Attune Operations > Delivery and contention for destination type and reason."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunenotifyfailures"
          action: "Group by destination_type/reason, verify customer webhook or Lark target health, and avoid replaying until terminal failures are understood."

      - alert: AttuneOutboxDeadRowsHigh
        expr: attune_outbox_dead_rows > 0
        for: 15m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune has deliveries stuck in the dead queue"
          description: "{{ $value }} outbox delivery(s) are in the terminal 'dead' state. A webhook may be deleted/misconfigured (e.g. a removed Discord/Slack channel webhook)."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneoutboxdeadrowshigh"
          action: "Open Console > Dead deliveries, inspect destination_type and last_error, fix or remove the target, then manually retry."

  - name: attune.alerts.migrations
    rules:
      - alert: AttuneMigrationsPending
        expr: attune_migration_pending > 0
        for: 5m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Pending migrations detected"
          description: "{{ $value }} migrations pending on {{ $labels.instance }}. This means the binary has new migrations that were not applied at startup."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemigrationspending"
          action: "Check migration runner logs for failures, verify database connectivity, and confirm the migration files are valid SQL."

      - alert: AttuneMigrationChecksumDrift
        # No `for`: the 1h increase window is itself the debounce. A single drift
        # event is operator-actionable — a migration file was edited after being
        # applied, which is a release hygiene violation.
        expr: increase(attune_migration_checksum_drift_total[1h]) > 0
        labels:
          severity: critical
          service: attune
        annotations:
          summary: "Migration file modified after apply"
          description: "Checksum drift detected on {{ $labels.instance }}. A migration file was edited after being applied to the database, or the binary was built from different source than what's recorded."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunemigrationchecksumdrift"
          action: "Identify the drifted migration by comparing embedded checksums in the binary with schema_migrations table. Roll back to the original file content or create a remediation migration."

      - alert: AttuneRestoreDrillStale
        # Warning, not critical: a stale drill is a process lapse, not an outage.
        # Guarded on > 0 so a never-run drill does not page — the preflight
        # backup:restore_drill check surfaces that as a warning instead. The 8d
        # window tolerates one missed weekly run.
        expr: max(attune_restore_drill_last_success_timestamp_seconds) > 0 and (time() - max(attune_restore_drill_last_success_timestamp_seconds)) > 8 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "No successful restore drill in over 8 days"
          description: "The most recent passing backup/restore drill is more than 8 days old. Recoverability of the latest backup is unverified."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunerestoredrillstale"
          action: "Run 'attune restore-drill run --target <restored-db-url> --record', or check the restore-drill CronJob (restoreDrill.enabled). See docs/private-deploy.md."

  - name: attune.alerts.security
    rules:
      - alert: AttuneAuthorizationDenialsHigh
        expr: sum(rate(attune_authz_denied_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune authorization denials are elevated"
          description: "Authorization denials are above 0.1/s over 5m. Check Attune Security & Compliance > Authorization denials."
          dashboard: "Attune Security & Compliance"
          dashboard_url: "/d/attune-security-compliance/attune-security-compliance"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneauthorizationdenialshigh"
          action: "Split by role and required permission, then determine whether this is expected access control, role drift, or probing."

      - alert: AttuneAuditRowsMissing
        expr: sum(rate(attune_audit_rows_written_total[30m])) == 0 and sum(rate(attune_authz_denied_total[30m])) > 0
        for: 30m
        labels:
          severity: critical
          service: attune
        annotations:
          summary: "Attune audit rows may be missing"
          description: "Authorization denials occurred in the last 30m but audit rows did not increase. Check Attune Security & Compliance > Audit log."
          dashboard: "Attune Security & Compliance"
          dashboard_url: "/d/attune-security-compliance/attune-security-compliance"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneauditrowsmissing"
          action: "Treat as compliance-sensitive: verify audit writer health, database writes, and recent authorization-denial paths before suppressing."

  - name: attune.alerts.performance
    rules:
      - alert: AttuneGlobalEnrichmentLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(attune_enrich_duration_seconds_bucket[5m]))) > 30
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune enrichment p95 latency exceeds 30s"
          description: "Enrichment p95 latency is {{ $value | humanizeDuration }}. Check AI pipeline health and LLM provider latency."
          dashboard: "Attune AI Pipeline"
          dashboard_url: "/d/attune-ai-pipeline/attune-ai-pipeline"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneglobalenrichmentlatencyhigh"
          action: "Split by tenant and model. Check LLM provider status and queue depth. Consider scaling workers if queue is backing up."

      - alert: AttuneSearchLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, type) (rate(attune_search_query_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Attune search p95 latency exceeds 1s"
          description: "Search p95 latency for {{ $labels.type }} is {{ $value | humanizeDuration }}. Check database indexes and query plans."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunesearchlatencyhigh"
          action: "Check pg_stat_statements for slow queries. Verify embedding indexes are current. Consider VACUUM ANALYZE on large tables."

      - alert: AttuneCircuitBreakerOpen
        expr: sum by (name) (increase(attune_circuit_breaker_transitions_total{to="open"}[10m])) > 0
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Circuit breaker opened for {{ $labels.name }}"
          description: "The circuit breaker for {{ $labels.name }} opened in the last 10 minutes due to repeated failures."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunecircuitbreakeropen"
          action: "Check upstream provider health. The circuit will automatically recover after the open duration. If persistent, investigate root cause."

      - alert: AttuneEmbeddingQueueDepthHigh
        expr: max(attune_embed_queue_depth) > 100
        for: 10m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Embedding queue depth exceeds 100"
          description: "Embedding task queue depth is {{ $value }}. Workers may be saturated or failing."
          dashboard: "Attune AI Pipeline"
          dashboard_url: "/d/attune-ai-pipeline/attune-ai-pipeline"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attuneembeddingqueuedepthhigh"
          action: "Check embedding worker health and provider latency. Scale workers if queue is growing. Check for poison tasks."

  - name: attune.alerts.cohortsync
    rules:
      - alert: AttuneCohortSyncSourceError
        expr: |
          sum by (provider) (rate(attune_cohort_sync_runs_total{status="failed"}[30m])) > 0
          and
          sum by (provider) (rate(attune_cohort_sync_runs_total{status="succeeded"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Cohort sync source has been failing for 30+ minutes"
          description: "Provider {{ $labels.provider }} has only failed sync runs in the last 30 minutes. Check Console > Integrations > Cohort Sync for error details."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunecohortsyncsourceerror"
          action: "Open Console > Integrations > Cohort Sync, identify the failing source, check the last error, and verify the provider webhook configuration and credentials."

      - alert: AttuneCohortSyncWebhookErrors
        expr: |
          sum by (provider) (rate(attune_cohort_sync_webhook_requests_total{status="error"}[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          service: attune
        annotations:
          summary: "Cohort sync webhook error rate elevated"
          description: "Provider {{ $labels.provider }} webhook error rate is {{ $value | humanize }}/s over 10m."
          dashboard: "Attune Operations"
          dashboard_url: "/d/attune-operations/attune-operations"
          runbook_url: "https://github.com/Phixsura/attune/blob/main/observability/runbooks.md#attunecohortsyncwebhookerrors"
          action: "Check webhook handler logs for auth failures, parse errors, or provider misconfiguration. Verify the source credentials and provider webhook URL."
