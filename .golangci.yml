version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # correctness core (golangci-lint v2 default set, listed explicitly)
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    # high-value additions
    - revive
    - errorlint # error wrapping (%w, errors.Is/As)
    - bodyclose # leaked HTTP response bodies (we make outbound calls)
    - noctx # outbound requests must carry a context
    - misspell
    - unconvert
    - nolintlint
    - usestdlibvars # http.MethodGet etc.
    - depguard # ban forbidden imports + enforce CLAUDE.md §5 layering

  settings:
    depguard:
      rules:
        # CLAUDE.md §5: infra never imports service or repo.
        infra-isolation:
          list-mode: lax
          files:
            - "**/internal/infra/**/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "infra must not import service (CLAUDE.md §5)"
            - pkg: github.com/Phixsura/attune/internal/repo
              desc: "infra must not import repo (CLAUDE.md §5)"
        # CLAUDE.md §5: notify never imports service.
        notify-isolation:
          list-mode: lax
          files:
            - "**/internal/notify/**/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "notify must not import service (CLAUDE.md §5)"
        # CLAUDE.md §7 / #48: only the logging facade may import log/slog.
        # Business code logs through internal/pkg/logext; the facade
        # (logext itself + observability's TraceIDHandler) is the only
        # place that touches slog directly.
        slog-facade:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/internal/pkg/logext/**"
            - "!**/internal/infra/observability/**"
          deny:
            - pkg: log/slog
              desc: "log via internal/pkg/logext, not log/slog directly (CLAUDE.md §7, #48)"
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Phixsura/attune
