version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    # correctness core (golangci-lint v2 default set, listed explicitly)
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    # high-value additions
    - revive
    - errorlint # error wrapping (%w, errors.Is/As)
    - bodyclose # leaked HTTP response bodies (we make outbound calls)
    - noctx # outbound requests must carry a context
    - misspell
    - unconvert
    - nolintlint
    - usestdlibvars # http.MethodGet etc.
    - depguard # ban forbidden imports + enforce CLAUDE.md §5 layering

  settings:
    depguard:
      rules:
        # CLAUDE.md §5: infra never imports service or repo.
        infra-isolation:
          list-mode: lax
          files:
            - "**/internal/infra/**/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "infra must not import service (CLAUDE.md §5)"
            - pkg: github.com/Phixsura/attune/internal/repo
              desc: "infra must not import repo (CLAUDE.md §5)"
        # CLAUDE.md §5: notify never imports service.
        notify-isolation:
          list-mode: lax
          files:
            - "**/internal/notify/**/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "notify must not import service (CLAUDE.md §5)"
        # CLAUDE.md §7 / #48: only the logging facade may import log/slog.
        # Business code logs through internal/pkg/logext; the facade
        # (logext itself + observability's TraceIDHandler) is the only
        # place that touches slog directly.
        slog-facade:
          list-mode: lax
          files:
            - "**/*.go"
            - "!**/internal/pkg/logext/**"
            - "!**/internal/infra/observability/**"
          deny:
            - pkg: log/slog
              desc: "log via internal/pkg/logext, not log/slog directly (CLAUDE.md §7, #48)"
        # #66 channel-agnostic inbound boundary. Two rules:
        # 1. inbound-boundary: nothing under service / handlers / repo /
        #    infra / notify / domain — nor the framework root itself —
        #    may import internal/inbound/adapter/*. Adapters self-register
        #    via init(); cmd/attune is the only legal blank-import site.
        # Exception: internal/handlers/console/inbound/ is the operator
        # surface that drives webhook secret rotation (it calls
        # webhook.RotateSecret directly). This file is the wiring point
        # for that operation, analogous to cmd/attune for adapter Start.
        # See: docs/proposals/2026/06/2026-06-08-channel-agnostic-inbound.md
        inbound-boundary:
          list-mode: lax
          files:
            - "**/internal/service/**"
            - "**/internal/handlers/**"
            - "!**/internal/handlers/console/inbound/**"
            - "**/internal/repo/**"
            - "**/internal/infra/**"
            - "**/internal/notify/**"
            - "**/internal/domain/**"
            - "**/internal/inbound/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/inbound/adapter
              desc: "core/framework must not import inbound adapters; cmd/attune blank-imports only (#66)"
        # 2. inbound-framework-isolation: the framework root defines
        #    IngestPort + SourceStore + SecretStore as interfaces; the
        #    implementations are wired by cmd/attune. The framework
        #    itself must not shortcut and import them.
        inbound-framework-isolation:
          list-mode: lax
          files:
            - "**/internal/inbound/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "inbound framework defines IngestPort; impl is wired by cmd/attune"
            - pkg: github.com/Phixsura/attune/internal/repo
              desc: "inbound framework defines SourceStore; impl wired by cmd/attune"
            - pkg: github.com/Phixsura/attune/internal/handlers
              desc: "framework is below handlers"
            - pkg: github.com/Phixsura/attune/internal/notify
              desc: "inbound and notify are sibling subsystems"
        # 3. outbound-boundary: nothing under service / handlers / repo /
        #    infra / notify — nor the framework root itself — may import
        #    internal/outbound/adapter/*. Adapters self-register via
        #    init(); cmd/attune is the only legal blank-import site.
        #    Mirrors inbound-boundary for outbound.
        outbound-boundary:
          list-mode: lax
          files:
            - "**/internal/service/**"
            - "**/internal/handlers/**"
            - "**/internal/repo/**"
            - "**/internal/infra/**"
            - "**/internal/notify/**"
            - "**/internal/domain/**"
            - "**/internal/outbound/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/outbound/adapter
              desc: "core/framework must not import outbound adapters; cmd/attune blank-imports only (#34)"
        # 4. outbound-framework-isolation: the framework root defines
        #    Target as a decoupled struct; no imports from service / repo /
        #    handlers / notify. Drivers live in service and bridge to
        #    notify.Transport.
        outbound-framework-isolation:
          list-mode: lax
          files:
            - "**/internal/outbound/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "outbound framework is below service"
            - pkg: github.com/Phixsura/attune/internal/repo
              desc: "outbound framework uses Target struct, not repo"
            - pkg: github.com/Phixsura/attune/internal/handlers
              desc: "framework is below handlers"
            - pkg: github.com/Phixsura/attune/internal/notify
              desc: "outbound and notify are sibling subsystems"
        # 5. cohortsync-boundary: nothing under service / handlers / repo /
        #    infra may import internal/cohortsync/adapter/*. Adapters
        #    self-register via init(); cmd/attune is the only legal
        #    blank-import site. Mirrors inbound-boundary for cohortsync.
        cohortsync-boundary:
          list-mode: lax
          files:
            - "**/internal/service/**"
            - "**/internal/handlers/**"
            - "**/internal/repo/**"
            - "**/internal/infra/**"
            - "**/internal/cohortsync/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/cohortsync/adapter
              desc: "cohortsync adapters self-register; only cmd/attune may blank-import (#233)"
        # 6. cohortsync-framework-isolation: the framework root defines
        #    Provider as the adapter interface; no imports from service /
        #    repo / handlers.
        cohortsync-framework-isolation:
          list-mode: lax
          files:
            - "**/internal/cohortsync/*.go"
          deny:
            - pkg: github.com/Phixsura/attune/internal/service
              desc: "cohortsync framework must not import service layer"
            - pkg: github.com/Phixsura/attune/internal/repo
              desc: "cohortsync framework must not import repo layer"
            - pkg: github.com/Phixsura/attune/internal/handlers
              desc: "cohortsync framework must not import handlers layer"
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Phixsura/attune
