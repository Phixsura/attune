version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Phixsura/attune/sdk/go
    - file_option: go_package
      module: buf.build/gnostic/gnostic
      value: github.com/google/gnostic-models/openapiv3
  disable:
    - module: buf.build/googleapis/googleapis
plugins:
  - local: protoc-gen-go
    out: sdk/go
    opt: paths=source_relative
    strategy: all
