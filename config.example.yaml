# Attune runtime config.
#
# This file is the single source of process configuration. There are no env-var
# overrides and no *_file indirections. Keep the real file private.
#
# Generate a fresh Tink AEAD keyset before first start:
#
#   attune secrets generate-keyset

port: 8090

database:
  url: "postgres://<user>@<host>:5432/attune?sslmode=require"

migrations:
  # Set true only after exporting any legacy lark-* user_feedback rows.
  confirm_lark_delete: false

enricher:
  interval: "30s"
  batch: 10

console:
  base_url: "https://attune.example.com"
  # At least 32 random characters. Used to sign console session cookies.
  session_key: "replace-with-32-or-more-random-characters"
  bootstrap_admin:
    # Used only while admins is empty.
    email: "admin@example.com"
    password: "replace-this-after-first-login"

secrets:
  # Paste the JSON printed by `attune secrets generate-keyset`.
  # All replicas must run with the same keyset. Tink ciphertexts carry key ids,
  # so rolling rotation works by:
  #   1. `attune secrets add-key`
  #   2. `attune secrets set-primary --key-id <new>`
  #   3. `attune secrets reencrypt --from-key-id <old> --apply`
  #   4. `attune secrets retire-key --key-id <old> --apply`
  #   5. `attune secrets delete-key --key-id <old>`
  # Optional migration-only fallback for installs that already have
  # inbound_sources encrypted by the old ATTUNE_INBOUND_MASTER_KEY. Set the
  # old 32-byte key here as hex/base64, run `attune secrets reencrypt --apply`,
  # then remove this field from every replica config.
  # legacy_inbound_master_key: ""
  tink_keyset: |
    {
      "primaryKeyId": 0,
      "key": []
    }

observability:
  service_version: "dev"
  environment: "dev"
  otlp_endpoint: ""
  otlp_traces_path: "/opentelemetry/v1/traces"
  otlp_headers: {}
  otlp_insecure: false

rate_limit:
  per_minute: 60
  burst: 300
  disabled: false

# Optional bootstrap raw-webhook destinations. The console/API can manage
# runtime targets after startup.
custom_webhooks: []
