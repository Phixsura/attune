# Attune configuration. Override path via FEEDBACK_API_CONFIG env var.
# Every field below has an env var override — see internal/infra/config/env.go.

# HTTP listen port.
port: 8090

# Postgres connection string.
# Format: postgres://<user>:<password>@<host>:5432/<db>?sslmode=<mode>
#
# First-time setup on a fresh DB:
#   1. Apply migrations (auto on attune server startup, or:
#      psql ... -f internal/infra/database/migrations/001_init.sql)
#   2. Create your first tenant:
#      attune tenant create --slug acme-corp --name "Acme Corp"
#   3. Mint an API key:
#      attune keys issue --tenant acme-corp --label "main-app"
database_url: "postgres://<user>:<password>@<host>:5432/attune?sslmode=require"

# ── LLM endpoint ──────────────────────────────────────────────────
# LLM protocol. One of:
#   openai-compat    — any OpenAI-compatible /v1/chat/completions endpoint
#                      (OpenAI, Azure OpenAI, vLLM, ollama, oneapi, etc.)
#   openai-responses — OpenAI Responses API (via official SDK)
#   anthropic        — Anthropic Messages API (via official SDK)
#   gemini           — Google Gemini API (via official SDK)
# Default: openai-compat (backward compatible with existing deployments).
# Env override: FEEDBACK_API_LLM_PROTOCOL
llm_protocol: "openai-compat"

# Base URL for the OpenAI-compatible backend (llm_protocol=openai-compat only).
# Common values:
#   OpenAI 官方:    https://api.openai.com
#   Azure OpenAI:   https://<resource>.openai.azure.com/openai/deployments/<deployment>
#   vllm local:     http://localhost:8000
#   ollama local:   http://localhost:11434
#   oneapi proxy:   http://your-oneapi-host:3000
# Attune auto-appends "/v1/chat/completions" — don't include it in base_url.
# Required when llm_protocol=openai-compat; ignored for other protocols.
llm_openai_base_url: "https://api.openai.com"

# API key / bearer token.
# - openai-compat:    local ollama / vllm without auth may leave this blank.
# - openai-responses, anthropic, gemini: required (used by the official SDK).
# Prefer FEEDBACK_API_LLM_OPENAI_API_KEY env injection over committing to yaml.
llm_openai_api_key: ""

# Background enricher cadence.
enricher_interval: "30s"
enricher_batch:    10

# ── Lark / Feishu event subscription (optional) ────────────────
# Leave empty to disable the /v1/lark/event handler entirely (it returns 404).
# These come from the Lark Open Platform "事件订阅" tab of your app.
lark_signing_secret:      ""
lark_verification_token:  ""
# Tenant slug to associate Lark-sourced feedback with. Resolved to UUID at
# startup; service refuses to start if this slug doesn't exist in the
# tenants table when lark_signing_secret is set.
lark_default_tenant_slug: ""

# ── Outbound webhooks ────────────────────────────────────────────
# Each is a Lark custom group bot webhook URL (the "自定义机器人" URL in
# any Lark chat). Leave blank to disable that destination. Secrets are
# optional — set them only if the bot has signature verification enabled.
#
# Pool  = all-feedback channel:   every enriched row.
# Radar = critical-only channel:  P0 / P1 only.
feedback_pool_webhook_url:    ""
feedback_pool_webhook_secret: ""
dev_radar_webhook_url:        ""
dev_radar_webhook_secret:     ""

# ── Per-tenant custom HTTPS webhooks ──────────────────────────────
# Each entry is synced into tenant_notify_targets at startup. The console
# UI takes over CRUD; this env path is kept as a bootstrap escape hatch.
#
# tenant_slug must already exist in tenants.slug or startup will fail.
# url must be https://. secret must be ≥ 16 chars (used for HMAC-SHA256
# over POST body; customer verifies via X-Attune-Signature header).
# audience ∈ {pool, radar, all}; default pool.
custom_webhooks: []
# Example:
# custom_webhooks:
#   - tenant_slug: "acme-corp"
#     url:    "https://example.com/api/internal/attune-webhook"
#     secret: "<set-via-env-or-ops-handoff>"
#     audience: "all"     # optional, default "pool"
#     timeout_seconds: 10 # optional, default 10
#     disabled: false     # optional, default false (kill switch)
