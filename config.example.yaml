# Attune runtime config.
#
# This file is the single source of process configuration. There are no env-var
# overrides and no *_file indirections. Keep the real file private.
#
# Generate a fresh Tink AEAD keyset before first start:
#
#   attune secrets generate-keyset

port: 8090

database:
  url: "postgres://<user>@<host>:5432/attune?sslmode=require"

migrations:
  # Set true only after exporting any legacy lark-* user_feedback rows.
  confirm_lark_delete: false

enricher:
  interval: "30s"
  batch: 10

console:
  base_url: "https://attune.example.com"
  # At least 32 random characters. Used to sign console session cookies.
  session_key: "replace-with-32-or-more-random-characters"
  bootstrap_admin:
    # Used only while admins is empty.
    email: "admin@example.com"
    password: "replace-this-after-first-login"

# OIDC SSO (optional). Enables enterprise single sign-on via OpenID Connect.
# oidc:
#   enabled: true
#   issuer_url: "https://idp.example.com"  # OIDC discovery endpoint (must support .well-known/openid-configuration)
#   client_id: "attune-console"
#   client_secret: "your-client-secret"
#   redirect_uri: "https://attune.example.com/fb/v1/console/auth/oidc/callback"
#   scopes:
#     - openid
#     - profile
#     - email
#     - groups
#   provider_name: "Corporate SSO"         # Displayed on login button
#   # oidc_only: true                       # Set true to hide local admin login
#   # allowed_groups:                       # Restrict access to these groups
#   #   - attune-users
#   # role_mapping:                         # Map IdP groups to attune roles (first match wins)
#   #   - role: admin
#   #     groups: [attune-admins]
#   #   - role: member
#   #     groups: [attune-users]
#   # user_claim: email                     # Claim to use as user identifier (default: email)
#   # groups_claim: groups                  # Claim containing group membership (default: groups)
#   # skip_issuer_check: false              # For IdPs with non-standard issuer
#   # insecure_skip_verify: false           # Skip TLS verification (dev only!)

secrets:
  # Paste the JSON printed by `attune secrets generate-keyset`.
  # All replicas must run with the same keyset. Tink ciphertexts carry key ids,
  # so rolling rotation works by:
  #   1. `attune secrets add-key`
  #   2. `attune secrets set-primary --key-id <new>`
  #   3. `attune secrets reencrypt --from-key-id <old> --apply`
  #   4. `attune secrets retire-key --key-id <old> --apply`
  #   5. `attune secrets delete-key --key-id <old>`
  # Optional migration-only fallback for installs that already have
  # inbound_sources encrypted by the old ATTUNE_INBOUND_MASTER_KEY. Set the
  # old 32-byte key here as hex/base64, run `attune secrets reencrypt --apply`,
  # then remove this field from every replica config.
  # legacy_inbound_master_key: ""
  tink_keyset: |
    {
      "primaryKeyId": 0,
      "key": []
    }

observability:
  service_version: "dev"
  environment: "dev"
  otlp_endpoint: ""
  otlp_traces_path: "/opentelemetry/v1/traces"
  otlp_headers: {}
  otlp_insecure: false

rate_limit:
  per_minute: 60
  burst: 300
  disabled: false

# Outbound egress + reverse-proxy hardening. Cloud-metadata, link-local,
# unspecified, and multicast targets are ALWAYS blocked for outbound webhook /
# LLM dials regardless of these flags.
security:
  # Allow outbound dials to loopback (127.0.0.1, ::1, localhost). Off in
  # production; turn on for local dev or a loopback reverse-proxy in front of an
  # LLM gateway.
  allow_loopback_egress: false
  # Allow outbound dials to RFC1918 / unique-local networks. Turn on for on-prem
  # deployments co-located with an internal IMAP or LLM host.
  allow_private_egress: false
  # Number of trusted reverse proxies in front of attune that append to
  # X-Forwarded-For. The API-key IP allowlist reads the client IP that many hops
  # from the right of the header. 0 ignores X-Forwarded-For entirely (use the
  # direct peer) so a direct client cannot spoof an allowlisted source IP.
  trusted_proxy_hops: 0

# MCP (Model Context Protocol) server for AI agent access. Enables AI assistants
# like Claude to read/write feedback data via OAuth 2.1 + PKCE flow.
# mcp:
#   enabled: true
#   public_base_url: "https://mcp.attune.example.com" # Optional; defaults to console.base_url
#   oauth:
#     # At least 32 random characters for JWT signing. Generate with:
#     #   openssl rand -base64 32
#     jwt_secret: "replace-with-32-or-more-random-characters"
#     issuer: ""                         # Defaults to {console.base_url}/mcp/oauth
#     access_token_ttl: "1h"
#     refresh_token_ttl: "168h"          # 7 days
#   rate_limit:
#     requests_per_minute: 60
#     burst: 10
#   # Allowed redirect URI patterns for loopback clients (Claude Code, etc.)
#   allowed_redirect_patterns:
#     - "http://127.0.0.1:*"
#     - "http://localhost:*"

# Optional bootstrap outbound destinations. The console/API can manage
# runtime targets after startup. Each entry's destination_type is one of
# raw-webhook (default) | slack | lark | discord | github-issue. For slack /
# lark / discord the webhook URL is the credential, so secret is optional.
#   - tenant_slug: acme
#     destination_type: discord
#     audience: all          # pool | radar | all
#     url: https://discord.com/api/webhooks/123/abc
custom_webhooks: []
