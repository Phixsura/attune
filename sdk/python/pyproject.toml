[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attune-sdk"
version = "0.1.0"
description = "Python SDK for the attune feedback platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["attune", "feedback", "sdk"]

[project.urls]
Homepage = "https://github.com/phjardas/attune"
Repository = "https://github.com/phjardas/attune"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/attune"]
