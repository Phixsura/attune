# Publish the Node SDK (@phixsura/attune) to npm on an `sdk-v*` tag, with npm
# provenance (a signed SLSA attestation via OIDC). The SDK versions
# independently from the server image (which uses `v*` tags in release.yml).
#
# workflow_dispatch runs a publish dry-run (including the live e2e gate, but no
# publish, no token) so the path can be exercised without cutting a tag.
#
# Setup required once: an `NPM_TOKEN` repo secret (npm automation token with
# publish rights to the @phixsura scope), or npm trusted publishing.
name: SDK Release

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
    defaults:
      run:
        working-directory: sdk/node
    permissions:
      contents: read
      id-token: write # npm provenance signs via OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: sdk/node/package.json

      # The SDK release gate boots a real attune server from source in
      # `pnpm e2e`, so the workflow needs the repo's Go toolchain too. As with
      # setup-node below, caching stays disabled in publish workflows.
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      # Caching is intentionally NOT enabled here (no `cache:`): a publish
      # workflow must not restore a potentially poisoned cache into an artifact
      # it then signs and ships. The ignore is for zizmor's conservative default
      # flag on setup-node; a clean frozen-lockfile install is cheap and safe.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 # zizmor: ignore[cache-poisoning] — caching is not enabled; clean install
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # On a tag, the tag (sdk-vX.Y.Z) must match package.json "version".
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#sdk-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $REF_NAME ($tag_version) != package.json version $pkg_version"
            exit 1
          fi

      - run: pnpm biome check src test
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

      - name: Install Chromium for real-browser SDK e2e
        run: |
          playwright_version="$(node -p "require('./package.json').devDependencies['playwright-core']")"
          npx -y "playwright@${playwright_version}" install --with-deps chromium

      - name: Full live SDK e2e
        run: pnpm e2e

      - name: Select publish strategy
        if: github.event_name == 'push'
        run: |
          if [ "${NPM_TOKEN_PRESENT}" = "true" ]; then
            echo "Using NPM_TOKEN-based publish."
          else
            echo "Using trusted publishing (no NPM_TOKEN configured)."
          fi

      - name: Verify npm publisher identity
        if: github.event_name == 'push' && env.NPM_TOKEN_PRESENT == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          publisher="$(npm whoami)"
          owners="$(npm owner ls "$pkg_name" 2>/dev/null || true)"
          echo "npm publisher: ${publisher}"
          if [ -n "$owners" ]; then
            echo "package owners:"
            printf '%s\n' "$owners"
            if ! printf '%s\n' "$owners" | awk '{print $1}' | grep -Fxq "$publisher"; then
              echo "::error::NPM_TOKEN authenticates as ${publisher}, but that account is not an owner of ${pkg_name}."
              exit 1
            fi
          else
            echo "::warning::Could not list package owners for ${pkg_name}; continuing to publish attempt."
          fi

      # prepack (tsdown) builds dist; publishConfig forces public access + npmjs.
      - name: Publish (dry-run on manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --dry-run

      - name: Publish to npm (token)
        if: github.event_name == 'push' && env.NPM_TOKEN_PRESENT == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance

      - name: Publish to npm (trusted publishing)
        if: github.event_name == 'push' && env.NPM_TOKEN_PRESENT != 'true'
        run: npm publish --provenance
