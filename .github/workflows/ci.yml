# CI — mirrors the quality gates in CLAUDE.md §1, built to match how
# well-maintained Go + JS-frontend repos (cli/cli, goreleaser, gitea) run CI.
#
# Conventions:
#   * Actions are pinned to a full commit SHA with a trailing `# vX.Y.Z` comment;
#     .github/dependabot.yml bumps both together weekly.
#   * Go + pnpm use the toolchains' BUILT-IN caching (setup-go keyed on go.sum,
#     setup-node `cache: pnpm`) — no hand-rolled actions/cache.
#   * dorny/paths-filter runs the Go jobs only on `**/*.go` and the console job
#     only on `console/**`; touching this workflow re-runs everything.
#   * `ci-gate` is an `if: always()` aggregator and is the ONLY job that should
#     be marked "required" in branch protection — a path-skipped job reports
#     success, so gating on the real jobs directly would let unrelated PRs pass
#     without ever running them. The gate fails iff a real job failed/cancelled.
#
# Deliberately omitted for now:
#   * docker-build — the Dockerfile still assumes the old monorepo layout
#     (COPY gateway/ + listen/); deferred to a follow-up that builds standalone.
#
# govulncheck is informational (continue-on-error): its standard-library
# findings track the Go toolchain version against a live DB, so they change
# over time independent of our code and must not block unrelated PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Path gate: which areas changed? ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads changed files on PRs
    outputs:
      go: ${{ steps.filter.outputs.go }}
      console: ${{ steps.filter.outputs.console }}
      code: ${{ steps.filter.outputs.code }}
      changelog: ${{ steps.filter.outputs.changelog }}
      deploy: ${{ steps.filter.outputs.deploy }}
      proto: ${{ steps.filter.outputs.proto }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            console:
              - 'console/**'
              - '.github/workflows/ci.yml'
            # `code` = substantive source whose change should carry a changelog entry
            code:
              - '**/*.go'
              - 'console/src/**'
            changelog:
              - 'CHANGELOG.md'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'buf.lock'
              - '.github/workflows/ci.yml'

  # ── Go: integration tier — real Postgres via testcontainers-go ────────────
  # Gated behind the `integration` build tag so the unit tier (go-checks)
  # stays fast. Each test spins up postgres:17-alpine inside the runner's
  # Docker daemon; the whole suite takes well under a minute on a warm cache.
  go-integration:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Integration tests (real Postgres)
        run: make test-integration

  # ── Go: vet / build / test ─────────────────────────────────────────────────
  go-checks:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod # single source of truth (Go 1.25)
          cache-dependency-path: go.sum # built-in cache, keyed on go.sum
      - run: go vet ./...
      - run: go build ./...
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        continue-on-error: true # never block on a coverage-upload hiccup
        with:
          files: ./coverage.txt
          flags: go
      - name: go.mod / go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ── golangci-lint: ~15 linters (subsumes go vet) + §5 layering via depguard ─
  golangci-lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  # ── lint-slog: slog / OTel / http.Client static checks (CLAUDE.md §1 / §7) ──
  # Pure bash/grep/awk — no Go toolchain. Scans all tracked *.go; --strict gates.
  lint-slog:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-slog.sh --strict

  # ── lint-rawptr: bans bare *p / &x — funnel via internal/pkg/ptrext  ──────
  # AST-aware Go linter (cmd/lint-rawptr/). Type-position *T, &xs[i],
  # out-param &arg (json.Unmarshal / *Row.Scan / flag.*Var / errors.As / …),
  # and per-site // ptrext:allow / // ptrext:file-allow markers are exempt.
  lint-rawptr:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/lint-rawptr.sh

  # ── lint-errorcode: ErrorResponse.code must flow from ErrorCode enum ───────
  lint-errorcode:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/lint-errorcode.sh

  # ── Lizard: complexity (CCN ≤ 15) + length (NLOC ≤ 100) ────────────────────
  lizard:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: pip install lizard==1.23.0
      - run: lizard . -l go -C 15 -T nloc=100 --warnings_only

  # ── jscpd: code duplication gate, generated proto excluded ─────────────────
  jscpd:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npx -y jscpd . -f go -i '**/*.pb.go' -t 4 --silent

  # ── govulncheck (informational — never blocks; see header) ─────────────────
  govulncheck:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: govulncheck ./...
        continue-on-error: true
        run: govulncheck ./...

  # ── Console SPA: biome + tsc ───────────────────────────────────────────────
  console:
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # pnpm before setup-node so setup-node can resolve the store for caching.
      # Version comes from console/package.json "packageManager".
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check
      # vite build generates src/routeTree.gen.ts (gitignored, produced by the
      # TanStack Router plugin) that tsc needs — and doubles as a build smoke test.
      - run: pnpm exec vite build
      - run: pnpm tsc -b --noEmit
      - run: pnpm vitest run --coverage
      # dependency-cruiser enforces architectural import boundaries (#19):
      # no cross-feature imports, shared → features → app one-way,
      # no circular deps. See console/.dependency-cruiser.cjs.
      - run: pnpm arch

  # ── Changelog enforcement: a code PR must update CHANGELOG.md (CLAUDE.md §2) ─
  changelog:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.code == 'true' &&
      needs.changes.outputs.changelog != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require a CHANGELOG.md entry (unless exempt)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "skip-changelog label present — exempt."
            exit 0
          fi
          # Exempt the changelog-free commit types from CLAUDE.md §2 (+ style).
          if printf '%s' "$PR_TITLE" | grep -qiE '^(chore|ci|docs|refactor|style|test)(\(.+\))?!?:'; then
            echo "PR title is changelog-exempt per CLAUDE.md §2 — ok."
            exit 0
          fi
          echo "::error::Code changed but CHANGELOG.md was not updated."
          echo "Fix one of: add an entry under [Unreleased] in CHANGELOG.md;"
          echo "  use a chore/ci/docs/refactor/test/style PR title;"
          echo "  or apply the 'skip-changelog' label (CLAUDE.md §2)."
          exit 1

  # ── Docker image smoke build (multi-arch, no push) ──────────────────────────
  docker-build:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: docker-compose base + obs overlay parse ────────────────────────
  compose-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate base + obs overlay merge & parse
        working-directory: deploy
        # The base compose has `env_file: .env` (gitignored); seed a throwaway one
        # from the example so `config` can resolve it. `config` validates the
        # merged YAML only — it never starts containers or reads real secrets.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.obs.yml config -q

  # ── proto: buf lint + codegen drift gate (issue #19) ───────────────────────
  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares against the base branch
      - name: Install buf
        env:
          BUF_VERSION: 1.50.0
          BUF_ASSET: buf-Linux-x86_64
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/${BUF_ASSET}" -o "$HOME/.local/bin/buf"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/sha256.txt" -o "$RUNNER_TEMP/buf-sha256.txt"
          expected="$(awk -v asset="${BUF_ASSET}" '$2 == asset { print $1 }' "$RUNNER_TEMP/buf-sha256.txt")"
          actual="$(sha256sum "$HOME/.local/bin/buf" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: buf lint
      - name: proto-breaking (against base branch)
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "${base}:refs/remotes/origin/${base}"
          base_commit="$(git merge-base HEAD "origin/${base}")"
          buf breaking --against ".git#commit=${base_commit}"
      - name: proto-sync (committed Go/TS/OpenAPI match `buf generate`)
        run: |
          buf generate
          git diff --exit-code

  # ── Required-check aggregator (the ONLY job to mark "required") ─────────────
  ci-gate:
    needs: [changes, go-checks, go-integration, golangci-lint, lint-slog, lint-rawptr, lint-errorcode, lizard, jscpd, govulncheck, console, changelog, docker-build, compose-config, proto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          bad=0
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a required job concluded '$r'"; bad=1 ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "All required jobs passed or were legitimately skipped."
