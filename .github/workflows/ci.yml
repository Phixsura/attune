# CI — mirrors the quality gates in CLAUDE.md §1, built to match how
# well-maintained Go + JS-frontend repos (cli/cli, goreleaser, gitea) run CI.
#
# Conventions:
#   * Actions are pinned to a full commit SHA with a trailing `# vX.Y.Z` comment;
#     .github/dependabot.yml bumps both together weekly.
#   * Go + pnpm use the toolchains' BUILT-IN caching (setup-go keyed on go.sum,
#     setup-node `cache: pnpm`) — no hand-rolled actions/cache.
#   * dorny/paths-filter classifies changed areas for policy checks such as the
#     changelog gate. CI jobs themselves still run and conclude pass/fail instead
#     of showing up as skipped checks.
#   * `ci-gate` is an `if: always()` aggregator and is the ONLY job that should
#     be marked "required" in branch protection. The gate fails iff a real job
#     failed/cancelled/skipped.
#
# govulncheck is informational (continue-on-error): its standard-library
# findings track the Go toolchain version against a live DB, so they change
# over time independent of our code and must not block unrelated PRs.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Path gate: which areas changed? ────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads changed files on PRs
    outputs:
      go: ${{ steps.filter.outputs.go }}
      console: ${{ steps.filter.outputs.console }}
      code: ${{ steps.filter.outputs.code }}
      changelog: ${{ steps.filter.outputs.changelog }}
      deploy: ${{ steps.filter.outputs.deploy }}
      proto: ${{ steps.filter.outputs.proto }}
      sdk: ${{ steps.filter.outputs.sdk }}
      sdkgo: ${{ steps.filter.outputs.sdkgo }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'buf.lock'
              - 'Dockerfile'
              - 'codecov.yml'
              - 'scripts/lint-integration-layout.sh'
              - 'scripts/lint-outbound-conformance.sh'
              - '.github/workflows/ci.yml'
            console:
              - 'console/**'
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'buf.lock'
              - 'codecov.yml'
              - '.github/workflows/ci.yml'
            # `code` = substantive source whose change should carry a changelog entry
            code:
              - '**/*.go'
              - 'console/src/**'
              - 'sdk/node/src/**'
              - 'proto/**'
              - 'deploy/helm/**'
              - 'Dockerfile'
            changelog:
              - 'CHANGELOG.md'
            deploy:
              - 'deploy/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
              - 'buf.gen.sdk-go.yaml'
              - 'buf.lock'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/node/**'
              - 'proto/**'
              - 'buf.gen.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/sdk-release.yml'
            sdkgo:
              - 'sdk/go/**'
              - 'proto/**'
              - 'buf.gen.sdk-go.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/sdk-go-release.yml'

  # ── Go: integration tier — real Postgres service container ────────────────
  # Gated behind the `integration` build tag so the unit tier (go-checks)
  # stays fast. The CI job runs pgvector/pgvector:pg17 as a GitHub Actions
  # service container; internal/testdb creates an isolated database per test.
  integration-postgres:
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: attune
          POSTGRES_PASSWORD: attune
          POSTGRES_DB: attune
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install PostgreSQL 17 tools (match the pg17 service; incl. pg_waldump)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # Don't auto-create/start a local cluster — the pg17 service already owns :5432.
          sudo install -d /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          # postgresql-17 pulls in postgresql-client-17 and adds pg_waldump,
          # which pg_verifybackup needs to validate streamed WAL.
          sudo apt-get install -y postgresql-17
      - name: Enable replication on the Postgres service (for the pg_basebackup verify-backup test)
        run: |
          cid="$(docker ps --filter 'ancestor=pgvector/pgvector:pg17' --format '{{.ID}}' | head -1)"
          if [ -z "$cid" ]; then echo "::error::pg17 service container not found"; exit 1; fi
          docker exec "$cid" sh -c 'echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
          docker exec "$cid" psql -U attune -d attune -c 'SELECT pg_reload_conf();'
      - name: Integration tests (real Postgres)
        env:
          ATTUNE_TEST_DATABASE_HOST: localhost
          ATTUNE_TEST_DATABASE_PORT: "5432"
          ATTUNE_TEST_DATABASE_NAME: attune
          ATTUNE_TEST_DATABASE_USER: attune
          ATTUNE_TEST_DATABASE_PASSWORD: attune
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          db_userinfo="${ATTUNE_TEST_DATABASE_USER}:${ATTUNE_TEST_DATABASE_PASSWORD}"
          db_host="${ATTUNE_TEST_DATABASE_HOST}:${ATTUNE_TEST_DATABASE_PORT}"
          ATTUNE_TEST_DATABASE_URL="postgres://${db_userinfo}@${db_host}/${ATTUNE_TEST_DATABASE_NAME}?sslmode=disable"
          export ATTUNE_TEST_DATABASE_URL
          make test-integration

  # ── Go: vet / build / test ─────────────────────────────────────────────────
  go-checks:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod # single source of truth (Go 1.26.5)
          cache-dependency-path: go.sum # built-in cache, keyed on go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: bash scripts/lint-outbound-conformance.sh
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Go coverage summary
        run: go tool cover -func=coverage.txt | tail -1
      - name: Upload coverage to Codecov
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        continue-on-error: true # never block on a coverage-upload hiccup
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: go
      - name: go.mod / go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ── golangci-lint: ~15 linters (subsumes go vet) + §5 layering via depguard ─
  golangci-lint:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  # ── lint-slog: slog / OTel / http.Client static checks (CLAUDE.md §1 / §7) ──
  # Pure bash/grep/awk — no Go toolchain. Scans all tracked *.go; --strict gates.
  lint-slog:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-slog.sh --strict

  # ── lint-artifacts: shipped-artifact hygiene (CLAUDE.md §1; issue #64) ─────
  # Pure bash/grep/perl — no Go toolchain. Runs UNCONDITIONALLY (no `changes`
  # gate): leaked roadmap markers / CJK span *.go + openapi.yaml + *.md, so a
  # docs-only or proto-only PR must be scanned too. --strict gates Check A/B.
  lint-artifacts:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-artifacts.sh --strict

  # ── lint-migrations: migration integrity (CLAUDE.md §1; issue #150) ────────
  # Pure bash — no Go toolchain. Checks duplicate prefixes, no-tx format, naming.
  lint-migrations:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-migrations.sh

  # ── lint-rawptr: bans bare *p / &x — funnel via internal/pkg/ptrext  ──────
  # AST-aware Go linter (cmd/lint-rawptr/). Type-position *T, &xs[i],
  # out-param &arg (json.Unmarshal / *Row.Scan / flag.*Var / errors.As / …),
  # and per-site // ptrext:allow / // ptrext:file-allow markers are exempt.
  lint-rawptr:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/lint-rawptr.sh

  # ── lint-errorcode: ErrorResponse.code must flow from ErrorCode enum ───────
  lint-errorcode:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/lint-errorcode.sh

  # ── Lizard: complexity (CCN ≤ 15) + length (NLOC ≤ 100) ────────────────────
  lizard:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: pip install lizard==1.23.0
      - run: lizard . -l go -C 15 -T nloc=100 --warnings_only

  # ── jscpd: code duplication gate (config in .jscpd.json) ────────────────────
  jscpd:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npx -y jscpd . --silent

  # ── Integration layout: keep build-tagged suites centralized ───────────────
  integration-layout:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-integration-layout.sh

  # ── govulncheck (informational — never blocks; see header) ─────────────────
  govulncheck:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: govulncheck ./...
        continue-on-error: true
        run: govulncheck ./...

  # ── Console SPA: biome + build + browser accessibility ─────────────────────
  console:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # pnpm before setup-node so setup-node can resolve the store for caching.
      # Version comes from console/package.json "packageManager".
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check
      # vite build generates src/routeTree.gen.ts (gitignored, produced by the
      # TanStack Router plugin) that tsc needs — and doubles as a build smoke test.
      - run: pnpm exec vite build
      - run: pnpm tsc -b --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      - run: ATTUNE_CONSOLE_E2E_PREBUILT=1 pnpm test:e2e:a11y
      - run: pnpm vitest run --coverage
      - name: Upload console coverage to Codecov
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        continue-on-error: true # never block on a coverage-upload hiccup
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./console/coverage/lcov.info
          flags: console
      # dependency-cruiser enforces architectural import boundaries (#19):
      # no cross-feature imports, shared → features → app one-way,
      # no circular deps. See console/.dependency-cruiser.cjs.
      - run: pnpm arch

  # ── Public board runtime smoke: real PostgreSQL + Chromium + tenant isolation ──
  public-board-smoke:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # pnpm before setup-node so setup-node can resolve the store for caching.
      # Version comes from console/package.json "packageManager".
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install PostgreSQL 17 tools (match local smoke fallback)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo install -d /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector
      - name: Public board browser smoke
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          node scripts/public-board-smoke.mjs

  # ── Node SDK (@phixsura/attune, #37): typecheck, lint, test, build, examples ─
  sdk-node:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: sdk/node/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sdk/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check src test
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec tsdown
      # Examples build against the freshly built package (file: dependency).
      - name: typecheck examples
        run: |
          for ex in examples/node-ingest examples/browser-ingest; do
            ( cd "$ex" && pnpm install --no-frozen-lockfile && pnpm exec tsc --noEmit )
          done

  # ── Go SDK (github.com/Phixsura/attune/sdk/go, #36): fmt, vet, test, build ───
  # A separate nested module with a Go 1.26.5 floor — setup-go reads sdk/go/go.mod
  # so this verifies the SDK compiles on its advertised minimum. Its wire types
  # are generated from proto, so it has deps + a go.sum; toolchain caching keys
  # on sdk/go/go.sum.
  sdk-go:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: sdk/go/go.mod # the SDK's own Go floor
          cache-dependency-path: sdk/go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo '::error::gofmt found unformatted files'; gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2
          working-directory: sdk/go # the SDK's own .golangci.yml (server depguard rules don't apply)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      # Compile the build-tagged e2e suite so it can't rot (it runs live in
      # scripts/e2e.sh, not in CI).
      - run: go vet -tags e2e ./test/...
      # govulncheck on the SDK's own module — its deps (protobuf/genproto/
      # gnostic-models) are NOT covered by the root govulncheck job. Advisory
      # (continue-on-error), matching the root job's posture.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: govulncheck ./... (sdk/go)
        continue-on-error: true
        run: govulncheck ./...

  # ── Changelog enforcement: a code PR must update CHANGELOG.md (CLAUDE.md §2) ─
  changelog:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Require a CHANGELOG.md entry when code changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGELOG_CHANGED: ${{ needs.changes.outputs.changelog }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Changelog gate only applies to pull requests."
            exit 0
          fi
          if [ "$CODE_CHANGED" != "true" ]; then
            echo "No changelog-required code changes detected."
            exit 0
          fi
          if [ "$CHANGELOG_CHANGED" = "true" ]; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi
          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "skip-changelog label present — exempt."
            exit 0
          fi
          # Exempt the changelog-free commit types from CLAUDE.md §2 (+ style).
          if printf '%s' "$PR_TITLE" | grep -qiE '^(chore|ci|docs|refactor|style|test)(\(.+\))?!?:'; then
            echo "PR title is changelog-exempt per CLAUDE.md §2 — ok."
            exit 0
          fi
          echo "::error::Code changed but CHANGELOG.md was not updated."
          echo "Fix one of: add an entry under [Unreleased] in CHANGELOG.md;"
          echo "  use a chore/ci/docs/refactor/test/style PR title;"
          echo "  or apply the 'skip-changelog' label (CLAUDE.md §2)."
          exit 1

  # ── maturity-contract: proposal traceability + verification links ─────────
  maturity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - run: bash scripts/lint-maturity-contract.sh

  # ── Docker image smoke build (multi-arch, no push) ──────────────────────────
  docker-build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: docker-compose base + obs overlay parse ────────────────────────
  compose-config:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate base + obs overlay merge & parse
        working-directory: deploy
        # The base compose has `env_file: .env` (gitignored); seed a throwaway one
        # from the example so `config` can resolve it. `config` validates the
        # merged YAML only — it never starts containers or reads real secrets.
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.obs.yml config -q

  # ── Helm chart: lint + schema/render validation + kind smoke ──────────────
  helm-chart:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Helm version
        run: helm version --short
      - name: Generate disposable Tink keyset
        run: go run ./cmd/attune secrets generate-keyset >/tmp/attune-keyset.json
      - name: Helm lint
        run: |
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-kind.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-kind.yaml \
            -f deploy/helm/attune/ci/values-distributed-kind.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-external-postgres.yaml
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-production-hpa.yaml
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-bluegreen-router.yaml
          helm lint deploy/helm/attune \
            -f deploy/helm/attune/ci/values-bluegreen-app.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json
      - name: Render kind/dev values
        run: |
          helm template attune deploy/helm/attune \
            -f deploy/helm/attune/ci/values-kind.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            >/tmp/attune-kind.yaml
      - name: Assert kind/dev observability defaults
        run: |
          grep -Fq 'profile: "dev"' /tmp/attune-kind.yaml
          grep -Fq 'environment: "dev"' /tmp/attune-kind.yaml
      - name: Render external Postgres values
        run: helm template attune deploy/helm/attune -f deploy/helm/attune/ci/values-external-postgres.yaml >/tmp/attune-external.yaml
      - name: Render production HPA values
        run: helm template attune deploy/helm/attune -f deploy/helm/attune/ci/values-production-hpa.yaml >/tmp/attune-production-hpa.yaml
      - name: Render blue-green values
        run: |
          helm template attune-router deploy/helm/attune \
            -f deploy/helm/attune/ci/values-bluegreen-router.yaml \
            >/tmp/attune-bluegreen-router.yaml
          helm template attune-blue deploy/helm/attune \
            -f deploy/helm/attune/ci/values-bluegreen-app.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            >/tmp/attune-bluegreen-app.yaml
      - name: Render distributed kind values
        run: |
          helm template attune deploy/helm/attune \
            -f deploy/helm/attune/ci/values-kind.yaml \
            -f deploy/helm/attune/ci/values-distributed-kind.yaml \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            >/tmp/attune-distributed-kind.yaml
      - name: Helm negative validation
        run: |
          expect_failure() {
            name="$1"
            shift
            if "$@" >/tmp/"${name}".out 2>&1; then
              echo "expected ${name} to fail" >&2
              cat /tmp/"${name}".out >&2
              exit 1
            fi
            cat /tmp/"${name}".out
          }

          expect_failure production-single-replica \
            helm template attune deploy/helm/attune \
              --set profile=production \
              --set config.existingSecret=attune-config \
              --set postgres.embedded.enabled=false \
              --set postgres.external.enabled=true \
              --set replicaCount=1
          expect_failure production-without-external-postgres \
            helm template attune deploy/helm/attune \
              --set profile=production \
              --set config.existingSecret=attune-config \
              --set postgres.embedded.enabled=false \
              --set replicaCount=2
          expect_failure rendered-config-without-database \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.enabled=false
          expect_failure traffic-service-missing-active-color \
            helm template attune deploy/helm/attune \
              -f deploy/helm/attune/ci/values-bluegreen-router.yaml \
              --set rollout.trafficService.activeColor=
          expect_failure traffic-service-name-collision \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set rollout.trafficService.enabled=true \
              --set rollout.trafficService.name=attune \
              --set rollout.trafficService.activeColor=blue
          expect_failure router-release-with-workload-dependencies \
            helm template attune deploy/helm/attune \
              --set workload.enabled=false \
              --set rollout.trafficService.enabled=true \
              --set rollout.trafficService.activeColor=blue
          expect_failure helm-test-without-service \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set service.enabled=false
          expect_failure hpa-min-greater-than-max \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set autoscaling.enabled=true \
              --set autoscaling.minReplicas=5 \
              --set autoscaling.maxReplicas=2 \
              --set resources.requests.cpu=250m \
              --set resources.requests.memory=512Mi
          expect_failure rendered-port-mismatch \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set app.port=8090 \
              --set config.render.port=9090
          expect_failure pdb-blocks-all-evictions \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set podDisruptionBudget.enabled=true \
              --set podDisruptionBudget.minAvailable=1 \
              --set replicaCount=1
          expect_failure networkpolicy-empty-rules \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set networkPolicy.enabled=true
          expect_failure hpa-missing-resource-requests \
            helm template attune deploy/helm/attune \
              --set config.render.secrets.tinkKeyset=dummy \
              --set postgres.embedded.auth.password=dummy \
              --set autoscaling.enabled=true
      - name: kubeconform rendered manifests
        run: |
          docker run --rm -v /tmp:/tmp ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -ignore-missing-schemas \
            /tmp/attune-kind.yaml \
            /tmp/attune-external.yaml \
            /tmp/attune-production-hpa.yaml \
            /tmp/attune-bluegreen-router.yaml \
            /tmp/attune-bluegreen-app.yaml \
            /tmp/attune-distributed-kind.yaml
      - name: kind install + test + upgrade smoke
        run: |
          go install sigs.k8s.io/kind@v0.24.0
          kind_bin="$(go env GOPATH)/bin/kind"
          "$kind_bin" create cluster --name attune-chart --wait 90s
          trap '"$kind_bin" delete cluster --name attune-chart' EXIT

          docker build -t ghcr.io/phixsura/attune:chart-ci .
          "$kind_bin" load docker-image ghcr.io/phixsura/attune:chart-ci --name attune-chart

          ready_service_targets() {
            service_name="${1:?service name}"
            kubectl -n attune get endpointslice \
              -l "kubernetes.io/service-name=${service_name}" \
              -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.targetRef.name}{"\n"}{end}' | sort -u
          }

          wait_for_service_target_count() {
            service_name="${1:?service name}"
            expected_count="${2:?expected target count}"
            deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              targets="$(ready_service_targets "$service_name")"
              target_count="$(printf '%s\n' "$targets" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [ "$target_count" -eq "$expected_count" ]; then
                printf '%s\n' "$targets"
                return 0
              fi
              echo "waiting for ${service_name} ready endpoints: got ${target_count}, want ${expected_count}" >&2
              printf '%s\n' "$targets" >&2
              sleep 2
            done

            targets="$(ready_service_targets "$service_name")"
            target_count="$(printf '%s\n' "$targets" | sed '/^$/d' | wc -l | tr -d ' ')"
            echo "timed out waiting for ${service_name} ready endpoints: got ${target_count}, want ${expected_count}" >&2
            printf '%s\n' "$targets" >&2
            return 1
          }

          check_distributed_endpoints() {
            expected_app_pods="${1:?expected app pod count}"
            kubectl -n attune rollout status deploy/attune --timeout 5m

            app_targets="$(
              wait_for_service_target_count attune "$expected_app_pods"
            )"
            echo "attune Service targets:"
            echo "$app_targets"
            if echo "$app_targets" | grep -E 'postgres|smoke'; then
              echo "attune Service selected a non-app pod" >&2
              exit 1
            fi

            postgres_targets="$(
              wait_for_service_target_count attune-postgres 1
            )"
            echo "postgres Service targets:"
            echo "$postgres_targets"
            echo "$postgres_targets" | grep -q '^attune-postgres-0$'
          }

          probe_attune_service() {
            name="attune-probe-${RANDOM}-${RANDOM}"
            kubectl -n attune run "$name" \
              --rm \
              --quiet \
              -i \
              --restart=Never \
              --image=curlimages/curl:8.11.1 \
              --image-pull-policy=IfNotPresent \
              --command -- sh -ec \
              'curl -fsS --max-time 3 http://attune:8090/readyz >/dev/null'
          }

          probe_attune_service_until_success() {
            attempts="${1:?attempts}"
            i=1
            while [ "$i" -le "$attempts" ]; do
              if probe_attune_service; then
                return 0
              fi
              sleep 1
              i=$((i + 1))
            done
            probe_attune_service
          }

          force_delete_one_app_pod_smoke() {
            probe_attune_service_until_success 5

            victim=""
            for attempt in 1 2 3 4 5; do
              candidate="$(ready_service_targets attune | head -n 1)"
              if [ -z "$candidate" ]; then
                echo "no ready app Service endpoint available before force delete attempt ${attempt}" >&2
                sleep 1
                continue
              fi
              if kubectl -n attune get pod "$candidate" >/dev/null 2>&1; then
                victim="$candidate"
                break
              fi
              echo "selected endpoint pod disappeared before delete: $candidate" >&2
              sleep 1
            done
            test -n "$victim"
            echo "force deleting app pod: $victim"

            kubectl -n attune delete pod "$victim" \
              --force \
              --grace-period=0 \
              --wait=false

            probe_attune_service_until_success 30
            kubectl -n attune rollout status deploy/attune --timeout 5m
            check_distributed_endpoints 3
            remaining_targets="$(
              kubectl -n attune get endpointslice \
                -l kubernetes.io/service-name=attune \
                -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.targetRef.name}{"\n"}{end}' | sort -u
            )"
            if echo "$remaining_targets" | grep -qx "$victim"; then
              echo "force-deleted pod is still a ready Service endpoint" >&2
              exit 1
            fi
          }

          helm upgrade --install attune deploy/helm/attune \
            --namespace attune \
            --create-namespace \
            -f deploy/helm/attune/ci/values-kind.yaml \
            -f deploy/helm/attune/ci/values-distributed-kind.yaml \
            --set image.tag=chart-ci \
            --set image.pullPolicy=IfNotPresent \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            --wait \
            --timeout 8m
          helm test attune --namespace attune --timeout 5m
          check_distributed_endpoints 2

          kubectl -n attune exec deploy/attune -- \
            /app/attune --config /app/config/config.yaml tenant create \
            --slug chart-ci --name "Chart CI"

          helm upgrade attune deploy/helm/attune \
            --namespace attune \
            --reuse-values \
            --set podAnnotations.chart-ci-upgrade="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait \
            --timeout 8m
          helm test attune --namespace attune --timeout 5m
          check_distributed_endpoints 2

          helm upgrade attune deploy/helm/attune \
            --namespace attune \
            --reuse-values \
            --set replicaCount=3 \
            --set podAnnotations.chart-ci-scale="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait \
            --timeout 8m
          helm test attune --namespace attune --timeout 5m
          check_distributed_endpoints 3
          force_delete_one_app_pod_smoke
          helm test attune --namespace attune --timeout 5m

          kubectl -n attune exec deploy/attune -- \
            /app/attune --config /app/config/config.yaml keys issue \
            --tenant chart-ci --label after-scale-out >/tmp/attune-ci-key.txt

          check_traffic_color() {
            namespace="$1"
            service_name="$2"
            expected_prefix="$3"
            forbidden_prefix="$4"
            targets="$(
              kubectl -n "$namespace" get endpointslice \
                -l kubernetes.io/service-name="$service_name" \
                -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.targetRef.name}{"\n"}{end}' | sort -u
            )"
            echo "${service_name} traffic targets:"
            echo "$targets"
            test "$(echo "$targets" | sed '/^$/d' | wc -l | tr -d ' ')" -ge 1
            echo "$targets" | grep -q "^${expected_prefix}"
            if echo "$targets" | grep -q "^${forbidden_prefix}"; then
              echo "${service_name} selected inactive color pods" >&2
              exit 1
            fi
          }

          helm upgrade --install attune-router deploy/helm/attune \
            --namespace attune-bg \
            --create-namespace \
            -f deploy/helm/attune/ci/values-bluegreen-router.yaml \
            --wait \
            --timeout 5m
          helm upgrade --install attune-blue deploy/helm/attune \
            --namespace attune-bg \
            -f deploy/helm/attune/ci/values-bluegreen-app.yaml \
            --set image.tag=chart-ci \
            --set image.pullPolicy=IfNotPresent \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            --wait \
            --timeout 8m
          helm test attune-blue --namespace attune-bg --timeout 5m
          check_traffic_color attune-bg attune attune-blue attune-green

          helm upgrade --install attune-green deploy/helm/attune \
            --namespace attune-bg \
            -f deploy/helm/attune/ci/values-bluegreen-app.yaml \
            --set rollout.color=green \
            --set image.tag=chart-ci \
            --set image.pullPolicy=IfNotPresent \
            --set-file config.render.secrets.tinkKeyset=/tmp/attune-keyset.json \
            --wait \
            --timeout 8m
          helm test attune-green --namespace attune-bg --timeout 5m
          check_traffic_color attune-bg attune attune-blue attune-green

          helm upgrade attune-router deploy/helm/attune \
            --namespace attune-bg \
            -f deploy/helm/attune/ci/values-bluegreen-router.yaml \
            --set rollout.trafficService.activeColor=green \
            --wait \
            --timeout 5m
          check_traffic_color attune-bg attune attune-green attune-blue

  # ── proto: buf lint + codegen drift gate (issue #19) ───────────────────────
  proto:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0 # buf breaking compares against the base branch
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Install buf
        env:
          BUF_VERSION: 1.50.0
          BUF_ASSET: buf-Linux-x86_64
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/${BUF_ASSET}" -o "$HOME/.local/bin/buf"
          curl -fsSL "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/sha256.txt" -o "$RUNNER_TEMP/buf-sha256.txt"
          expected="$(awk -v asset="${BUF_ASSET}" '$2 == asset { print $1 }' "$RUNNER_TEMP/buf-sha256.txt")"
          actual="$(sha256sum "$HOME/.local/bin/buf" | awk '{ print $1 }')"
          test -n "$expected"
          test "$actual" = "$expected"
          chmod +x "$HOME/.local/bin/buf"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: buf lint
      - name: proto-breaking (against base branch)
        run: |
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "${base}:refs/remotes/origin/${base}"
          base_commit="$(git merge-base HEAD "origin/${base}")"
          buf breaking --against ".git#commit=${base_commit}"
      - name: proto-sync (committed Go/TS/OpenAPI match `make proto`)
        run: |
          make proto
          git diff --exit-code

  # ── Required-check aggregator (the ONLY job to mark "required") ─────────────
  ci-gate:
    needs: [changes, go-checks, integration-postgres, integration-layout, golangci-lint, lint-slog, lint-artifacts, lint-migrations, lint-rawptr, lint-errorcode, lizard, jscpd, govulncheck, console, public-board-smoke, sdk-node, sdk-go, changelog, maturity-contract, docker-build, compose-config, helm-chart, proto]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream results: $RESULTS"
          bad=0
          for r in $RESULTS; do
            case "$r" in
              success) ;;
              skipped) echo "::error::a required job was skipped"; bad=1 ;;
              *) echo "::error::a required job concluded '$r'"; bad=1 ;;
            esac
          done
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "All required jobs passed."
