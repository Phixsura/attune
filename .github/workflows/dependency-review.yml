# Dependency Review — fails a PR that introduces a vulnerable or copyleft
# dependency, keeping the Apache-2.0 dependency tree clean. (Public repo / GHAS.)
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0
          # TruffleHog's *action* is AGPL, but it's a CI tool — not linked into
          # our Apache-2.0 binary — so its license doesn't affect our code.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
