# Go Coverage - Grafana-style Go coverage review for PRs.
name: Go Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"
      - "scripts/compare-go-coverage.mjs"
      - "scripts/filter-go-coverage.mjs"
      - ".github/workflows/go-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    name: Go Coverage
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-go-coverage')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false

      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: pr/go.mod
          cache-dependency-path: pr/go.sum

      - name: Test coverage on main
        working-directory: main
        run: |
          for attempt in 1 2; do
            rm -f coverage.txt coverage-func.txt coverage.html
            if go test -race -covermode=atomic -coverprofile=coverage.txt ./...; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "coverage test attempt ${attempt} failed; retrying once"
            sleep 5
          done
          node ../pr/scripts/filter-go-coverage.mjs coverage.txt coverage.filtered.txt
          mv coverage.filtered.txt coverage.txt
          go tool cover -func=coverage.txt > coverage-func.txt
          go tool cover -html=coverage.txt -o coverage.html
          tail -1 coverage-func.txt

      - name: Test coverage on PR
        working-directory: pr
        run: |
          for attempt in 1 2; do
            rm -f coverage.txt coverage-func.txt coverage.html
            if go test -race -covermode=atomic -coverprofile=coverage.txt ./...; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "coverage test attempt ${attempt} failed; retrying once"
            sleep 5
          done
          node scripts/filter-go-coverage.mjs coverage.txt coverage.filtered.txt
          mv coverage.filtered.txt coverage.txt
          go tool cover -func=coverage.txt > coverage-func.txt
          go tool cover -html=coverage.txt -o coverage.html
          tail -1 coverage-func.txt

      - name: Compare coverage
        run: >-
          node pr/scripts/compare-go-coverage.mjs
          main/coverage-func.txt
          pr/coverage-func.txt
          go-coverage.md

      - name: Upload PR Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage-html
          path: |
            pr/coverage.html
            pr/coverage.txt
            pr/coverage-func.txt
          retention-days: 7

      - name: Comment coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: go-coverage
          path: go-coverage.md

      - name: Fail if coverage decreased
        run: |
          node -e "const result = require('./go-coverage-result.json'); process.exit(result.passed ? 0 : 1)"
