# Workflow security lint — zizmor audits our own GitHub Actions for token
# over-permissioning, template injection, unpinned actions, dangerous triggers.
name: Workflow Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false # hard-fail in CI instead of only uploading SARIF
          annotations: true
