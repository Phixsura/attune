name: Console Accessibility Supplemental

on:
  workflow_dispatch:
  schedule:
    - cron: '34 8 * * 1'

concurrency:
  group: console-a11y-supplemental-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  supplemental-browser-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vite build
      - run: pnpm exec playwright install --with-deps firefox webkit
      - run: ATTUNE_CONSOLE_E2E_PREBUILT=1 pnpm test:e2e:a11y:supplemental:ci
