# OpenSSF Scorecard — supply-chain posture score (branch protection, pinned
# deps, token permissions, dangerous workflows…). Publishes SARIF + badge data.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1" # weekly (Mon 04:23 UTC)
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write # publish_results
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@d77b13a0df3134d64a457ea9003f600b09fa1c8a # v3
        with:
          sarif_file: results.sarif
