# Secret scanning — TruffleHog scans PR diffs (and full history weekly) for
# committed credentials, verifying whether found secrets are still live.
name: Secret Scan

on:
  pull_request:
  schedule:
    - cron: "15 5 * * 1" # weekly full-history scan (Mon 05:15 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          extra_args: --results=verified,unknown --exclude-paths=.trufflehogignore
