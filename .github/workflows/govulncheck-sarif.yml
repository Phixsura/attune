# Govulncheck SARIF - scheduled Go vulnerability findings for code scanning.
name: Govulncheck SARIF

on:
  schedule:
    - cron: "41 4 * * 1" # weekly (Mon 04:41 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # In SARIF mode, govulncheck exits 0 when it finds vulnerabilities; tool
      # or upload failures still fail this scheduled monitoring workflow.
      - name: govulncheck SARIF
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 -format sarif ./... > govulncheck.sarif
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: govulncheck.sarif
