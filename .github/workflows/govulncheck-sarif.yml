# Govulncheck SARIF - scheduled Go vulnerability findings for code scanning.
name: Govulncheck SARIF

on:
  schedule:
    - cron: "41 4 * * 1" # weekly (Mon 04:41 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # In SARIF mode, govulncheck exits 0 when it finds vulnerabilities; tool
      # or upload failures still fail this scheduled monitoring workflow.
      - name: govulncheck SARIF
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 -format sarif ./... > govulncheck.sarif
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: govulncheck.sarif
