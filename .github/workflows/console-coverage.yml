# Console Coverage - Grafana-style frontend coverage review for the React/TS SPA.
name: Console Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "console/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"
      - "scripts/compare-console-coverage.mjs"
      - ".github/workflows/console-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    name: Console Coverage
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-console-coverage')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false

      - name: Checkout PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Keep the main checkout on the same active-token fixture as the PR so
      # the shared security suite can produce a coverage baseline.
      - name: Normalize security fixture on main
        run: |
          perl -0pi -e "s/expires_at: '2026-07-06T12:30:00Z'/expires_at: '2099-07-06T12:30:00Z'/" \
            main/console/src/features/security/components/security-page.test.tsx

      # Install pnpm from the PR packageManager field; both checkouts share the
      # same major lockfile shape for this comparison.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: pr/console/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pr/console/pnpm-lock.yaml

      - name: Install main dependencies
        working-directory: main/console
        run: pnpm install --frozen-lockfile

      - name: Install PR dependencies
        working-directory: pr/console
        run: pnpm install --frozen-lockfile

      - name: Test coverage on main
        working-directory: main/console
        run: >-
          pnpm vitest run --coverage
          --testTimeout=30000
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json-summary

      - name: Test coverage on PR
        working-directory: pr/console
        run: >-
          pnpm vitest run --coverage
          --testTimeout=30000
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json-summary

      - name: Compare coverage
        run: >-
          node pr/scripts/compare-console-coverage.mjs
          main/console/coverage/coverage-summary.json
          pr/console/coverage/coverage-summary.json
          console-coverage.md

      - name: Upload PR HTML coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-coverage-html
          path: pr/console/coverage
          retention-days: 7

      - name: Comment coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: console-coverage
          path: console-coverage.md

      - name: Fail if coverage decreased
        run: |
          node -e "const result = require('./console-coverage-result.json'); process.exit(result.passed ? 0 : 1)"
