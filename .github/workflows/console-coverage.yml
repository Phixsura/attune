# Console Coverage - Grafana-style frontend coverage review for the React/TS SPA.
name: Console Coverage

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "console/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buf.lock"
      - "scripts/compare-console-coverage.mjs"
      - ".github/workflows/console-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    name: Console Coverage
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-console-coverage')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false

      - name: Checkout PR
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Install pnpm from the PR packageManager field; both checkouts share the
      # same major lockfile shape for this comparison.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: pr/console/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pr/console/pnpm-lock.yaml

      - name: Install main dependencies
        working-directory: main/console
        run: pnpm install --frozen-lockfile

      - name: Install PR dependencies
        working-directory: pr/console
        run: pnpm install --frozen-lockfile

      - name: Test coverage on main
        working-directory: main/console
        run: >-
          pnpm vitest run --coverage
          --testTimeout=30000
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json-summary

      - name: Test coverage on PR
        working-directory: pr/console
        run: >-
          pnpm vitest run --coverage
          --testTimeout=30000
          --coverage.reporter=text
          --coverage.reporter=html
          --coverage.reporter=json-summary

      - name: Compare coverage
        run: >-
          node pr/scripts/compare-console-coverage.mjs
          main/console/coverage/coverage-summary.json
          pr/console/coverage/coverage-summary.json
          console-coverage.md

      - name: Upload PR HTML coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: console-coverage-html
          path: pr/console/coverage
          retention-days: 7

      - name: Comment coverage
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: console-coverage
          path: console-coverage.md

      - name: Fail if coverage decreased
        run: |
          node -e "const result = require('./console-coverage-result.json'); process.exit(result.passed ? 0 : 1)"
